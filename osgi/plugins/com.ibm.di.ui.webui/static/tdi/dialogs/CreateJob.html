<div>
	<p></p>
	<div dojoType="dijit.form.Form" dojoAttachEvent="onSubmit:onSubmit" dojoAttachPoint="Form">
		<table cellspacing="5">
			<tr>
				<td>${nls.WebCE_name}:</td>
				<td><div dojoType="dijit.form.ValidationTextBox" type="text" name="name" required="true" regExp="[\w]+"></div></td>
			</tr>
			<tr>
				<td></td>
				<td>
					<div dojoType="dijit.form.Button" data-dojo-attach-event="onClick:handleCancel">${nls.WebCE_cancel}</div>
					<div dojoType="dijit.form.Button" type="submit">${nls.WebCE_ok}</div>
				</td>
			</tr>
		</table>
	</div>
</div>
