<div class="dijitReset" style='width:100%'>
	<div style='width:100%; margin:0; padding:1em; border-radius:8px; border-width:1px; border-style:solid; border-color:lightgray;'>
		<table class="dijitReset">
			<tr>
				<td>
					${nls.WebCE_type}
				</td><td>
					<div data-dojo-type="dijit/form/Select" data-dojo-attach-point="_type" data-dojo-attach-event="onChange:_typeChanged">
						<option value="jdbc">${nls.JDBCDataBrowser_12}</option>
						<option value="db2">DB2</option>
						<option value="derby">Derby</option>
						<option value="embedded">Derby Embedded</option>
						<option value="solid">Solid DB</option>
						<option value="mssql">MS/SQL</option>
						<option value="oracle">Oracle</option>
					</div>
				</td>
			</tr>
		</table>
		
		<div data-dojo-type="dijit/layout/StackContainer" data-dojo-attach-point="_stack" style="width:100%">
		
			<div data-dojo-type="dijit/layout/ContentPane" id="${id}_db2">
				<table class="dijitReset" style="width:100%">
					<tr data-dojo-attach-point="hostnameTR">
						<td>
							${nls.WebCE_hostname}
						</td>
						<td>
							<div data-dojo-type='dijit/form/TextBox' style='width:100%' data-dojo-attach-event='onChange:_onChange' intermediateChanges=true data-dojo-attach-point='Hostname'></div>
						</td>
						<td>
							${nls.FDS_tcpPort}
						</td>
						<td>
							<div data-dojo-type='dijit/form/ValidationTextBox' pattern="\d*" 
								invalidMessage="Enter port number - only numeric digits allowed"
								style='width:6em' data-dojo-attach-event='onChange:_onChange' intermediateChanges=true data-dojo-attach-point='Port'></div>
						</td>
					</tr><tr>
					</tr><tr data-dojo-attach-point="databaseTR">
						<td>
							${nls.FDS_database}
						</td>
						<td colspan="3">
							<div style="width:100%" data-dojo-type='dijit/form/TextBox' data-dojo-attach-event='onChange:_onChange' data-dojo-attach-point='Database'></div>
						</td>
					</tr>
				</table>
			</div>
			
			<div class="dijitReset" data-dojo-type="dijit/layout/ContentPane" id="${id}_jdbc">
				<table width="100%">
					<tr>
						<td>${nls.WebCE_jdbcUrl}</td>
						<td><div data-dojo-type="dijit/form/TextBox" style="width:100%" data-dojo-attach-point="jdbcSource" data-dojo-attach-event="onChange:_updateURL"></div></td>
					</tr>
					<tr>
						<td>${nls.WebCE_jdbcDriver}</td>
						<td><div data-dojo-type="dijit/form/TextBox" style="width:100%" data-dojo-attach-point="jdbcDriver" data-dojo-attach-event="onChange:_updateDriver"></div></td>
					</tr>
				</table>
			</div>
		</div>
	</div>
	
	<div data-dojo-attach-point="_loginDetails" "style="width:100%; margin-top:1em; padding:1em; border-radius:8px; border-width:1px; border-style:solid; border-color:lightgray;"">
		<div data-dojo-type="dijit/form/Form" data-dojo-attach-point="userForm">
			<table style="width:100%;">
				<tr>
					<td>${nls.WebCE_username}</td>
					<td><div data-dojo-type="dijit/form/TextBox" name="jdbcUser" style="width:100%" data-dojo-attach-event="onChange:_updateLogin"></div></td>
				</tr>
				<tr>
					<td>${nls.WebCE_password}</td>
					<td><div data-dojo-type="dijit/form/TextBox" name="jdbcPassword" style="width:100%" data-dojo-attach-event="onChange:_updateLogin"></div></td>
				</tr>
				<tr>
					<td>${nls.DiscoverSchemaWidget_0}</td>
					<td><div data-dojo-type="dijit/form/TextBox" name="jdbcSchema" style="width:100%" data-dojo-attach-event="onChange:_updateLogin"></div></td>
				</tr>
				<tr>
					<td>${nls.WebCE_tableName}</td>
					<td><div data-dojo-type="dijit/form/ValidationTextBox" name="jdbcTable" style="width:100%" data-dojo-attach-event="onChange:_updateLogin"></div></td>
				</tr>
			</table>
		</div>
	</div>
	
</div>
