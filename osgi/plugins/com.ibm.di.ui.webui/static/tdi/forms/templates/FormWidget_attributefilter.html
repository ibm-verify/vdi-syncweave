<div>
	<div data-dojo-type="dijit/form/Form" data-dojo-attach-point="_Form" action="">
	<table style="width:100%">
		<tr>
			<td width="40%">
				<div style="width:95%" data-dojo-type="dijit/form/ComboBox"
					data-dojo-attach-point="_attribute" data-dojo-attach-event="onChange:_onChange" name="attribute"></div>
			</td>
			<td width="25%">
				<select data-dojo-type="dijit/form/Select" name="operator" data-dojo-attach-event="onChange:_onChange">
					<option value="equals">${nls.BranchingConfig_Conditions_equals}</option>
					<option value="contains">${nls.BranchingConfig_Conditions_contains}</option>
					<option value="exists">${nls.BranchingConfig_Conditions_exists}</option>
					<option value="startsWith">${nls.BranchingConfig_Conditions_startsWith}</option>
					<option value="endsWith">${nls.BranchingConfig_Conditions_endsWith}</option>
					<option value="hasValue">${nls.BranchingConfig_Conditions_hasValue}</option>
					<option value="not_equals">${nls.BranchingConfig_Conditions_not_equals}</option>
					<option value="not_contains">${nls.BranchingConfig_Conditions_not_contains}</option>
					<option value="not_exists">${nls.BranchingConfig_Conditions_not_exists}</option>
					<option value="not_startsWith">${nls.BranchingConfig_Conditions_not_startsWith}</option>
					<option value="not_endsWith">${nls.BranchingConfig_Conditions_not_endsWith}</option>
					<option value="not_hasValue">${nls.BranchingConfig_Conditions_not_hasValue}</option>
				</select>
			</td>
			<td width="35%">
				<div style="width:100%" data-dojo-type="dijit/form/TextBox"
					data-dojo-attach-event="onChange:_onChange" name="value"></div>
			</td>
		</tr>
	</table>
	</div>
</div>
