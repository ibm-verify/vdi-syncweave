<div style="padding-top:10px">
	&nbsp;
	<div dojoType="idx.grid.PropertyFormatter" 
		 data-dojo-attach-point="grid"
	     properties="leftHand,operator,rightHand">
	     
		<!-- Attribute  -->
		Attribute:<br></br>
	    <div dojoType="dijit.form.TextBox" name="leftHand"></div>
		  
		<!-- Operator  -->
	    <div dojoType="dijit.form.Select" name="operator">
	    	<option value="equal to">equal to</option>
	    	<option value="less than">less than</option>
	    	<option value="greater than">greater than</option>
	    	<option value="greater than or equal">greater than or equal</option>
	    	<option value="less than or equal">less than or equal</option>
	    	<option value="starts with">starts with</option>
	    	<option value="ends with">ends with</option>
	    	<option value="contains">contains</option>
	    </div>
		  <br></br>
		  
	    <!-- Value  -->
	    Value:<br></br>
	    <div dojoType="dijit.form.TextBox" name="rightHand"></div>
	    <br></br>
		<div dojoType="dijit.form.Button" dojoAttachEvent="onClick:onDelete" class="idxEditControllerEditLink">Delete</div>
	</div>
</div>
