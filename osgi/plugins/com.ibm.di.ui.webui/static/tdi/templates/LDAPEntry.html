<div style="width:100%; height:100%; margin:5px; padding:0">
	<div data-dojo-type="dijit/layout/BorderContainer" data-dojo-attach-point="_border" gutters=false style="width:100%; height:100%; margin:0; padding:0">

		<div data-dojo-type="dijit/layout/ContentPane" region="top" style="padding:5px;">
			<div data-dojo-type="dijit/form/Button" data-dojo-attach-point="_saveBtn" data-dojo-attach-event="onClick:_saveEntry" disabled=true label="${nls.WebCE_save}"></div>
			<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:_deleteEntry" label="${nls.WebCE_del}"></div>
			<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:_loginEntry" label="${nls.FDS_ptaTestLogin}"></div>
			<div data-dojo-type="idx/form/CheckBox" data-dojo-attach-event="onClick:_editEntry" label="${nls.FDS_showAllAttributes}"
				data-dojo-attach-point="_showAllAttrCB"></div>
		</div>

		<div data-dojo-type="dijit/layout/ContentPane" region="center" data-dojo-attach-point="_center"></div>
	</div>
</div>
