<div>
	<h2>${name}</h2>
	<p></p>
	<div dojoType="dijit.form.Form" dojoAttachPoint="Form">
		<div style="float:left; width:35%">
			${nls.SolutionInterfaceUI_Label} <div dojoType="dijit.form.TextBox" name="DisplayName"></div><p></p>
			<div dojoType="dijit.form.CheckBox" name="ShowConfig"></div>${nls.WebCE_configuration}<p></p>
			<div dojoType="dijit.form.CheckBox" name="ShowAttMap"></div>${nls.WebCE_attributeMap}<p></p>
		</div>
		<div style="float:left; vertical-align:top">
			<h3>${nls.LoopConfig_connectorParams_label}</h3>
			${nls.BranchingConfig_Edit_label}<br></br>
			<div dojoType="dijit.form.TextBox" name="ConnectorParamsEditable"></div>
			<div dojoType="dijit.form.Button" label="..." dojoAttachEvent="onClick:selectEditableParams"></div>
			<p></p>
			${nls.general_show_label}<br></br>
			<div dojoType="dijit.form.TextBox" name="ConnectorParamsVisible"></div>
			<div dojoType="dijit.form.Button" label="..." dojoAttachEvent="onClick:selectVisibleParams"></div>
		</div>
	</div>
</div>
