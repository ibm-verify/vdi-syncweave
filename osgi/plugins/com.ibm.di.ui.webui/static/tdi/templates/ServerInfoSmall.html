			<table>
				<tr>
					<td>${nls.WebCE_version}: <span dojoAttachPoint="_version"/></td>

					<td>${nls.maxMemory}: <span dojoAttachPoint="_maxmemory"/></td>
				</tr>
				
			</table>
		</div>
		
		<div dojoType="dijit.layout.ContentPane" splitter="false" region="center">
			<table width="100%" height="98%" >
				<tr>
					<td>${nls.memoryUsage}</td>

				</tr>
				<tr>
					<td>

					</td>
					<td>
						<div dojoAttachPoint="Graph2"></div>

				</tr>
			</table>
