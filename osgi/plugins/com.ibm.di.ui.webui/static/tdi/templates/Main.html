<div>

	<div dojoType="dijit.layout.BorderContainer" gutters="false" liveSplitters="true" 
			style="width:100%; height:100%; margins:0">

		<!-- IBM Banner at the top -->		
		<div dojoType="dijit.layout.ContentPane" splitter="false" region="top" style="padding:0; margin:0">
			<div id="ibm-banner">
				<table width="100%" border="0" cellspacing="0" cellpadding="0">
					<tr valign="middle">
						<td height="35" id="ibm-banner-main"><img
							src="banner/img/tivoli-bbm_white.gif" alt="TIVOLI" width="44" height="24" />
						<span class="ibm-banner-product-name" style="font-size:16px;vertical-align:middle">Tivoli Directory Integrator</span></td>
						<td id="ibm-banner-logo" width="49"></td>
					</tr>
				</table>
				<br>
				<br>
			</div>
		</div>
	
		<!-- Navigation area to the left  -->
		<div dojoType="dijit.layout.ContentPane" splitter="true"
			region="leading" style="width: 30%; margin:20; padding: 20">
			<div dojoAttachPoint="TreeDiv"></div>
		</div>
		
		<!-- Tab container for the editor area -->
		<div dojoType="dijit.layout.ContentPane" region="center" style="padding: 0; margin: 0">
			<div dojoType="dijit.layout.TabContainer" dojoAttachPoint="TabContainer" />
		</div>
		
	</div>
</div>
