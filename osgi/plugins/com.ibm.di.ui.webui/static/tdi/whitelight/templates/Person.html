<div class="dijitReset" style="width:100%; height:100%">
	<div data-dojo-type="dijit/layout/BorderContainer" gutters="false" style="width:100%; height:100%" data-dojo-attach-point="Border">
	
		<div data-dojo-type="dijit/layout/ContentPane" region="top">	
			<table >
				<tr>
					<td valign="top">
						<img data-dojo-attach-point="picture" src="/webui/static/images/darkside.jpg" style="width:128px; height;128px"></img>
					</td>
					<td valign="top">
						<table cellspacing="5px" style="margin:0; padding:0">
							<tr><td><h2>${cn}</h2></td></tr>
							<tr><td><a href="mailto:${mail}">${mail}</a></td></tr>
							<tr><td>${item.jobresponsibilities}</td></tr>
							<tr><td>${item.co}</td></tr>
						</table>
					</td>
				</tr>
			</table>
		</div>
			
		<div data-dojo-type="dijit/layout/ContentPane" region="center">	
			<div data-dojo-type="dijit/layout/AccordionContainer" data-dojo-attach-point="Tabs">

					<table width="100%" data-dojo-attach-point="Manager"></table>
				</div>
				<div data-dojo-type="dijit/layout/ContentPane" title="Peers">

				</div>
				<div data-dojo-type="dijit/layout/ContentPane" title="Managed by">
					<table width="100%" data-dojo-attach-point="Subs"></table>
				</div>
			</div>
		</div>
		
	</div>
