<div style="margin:0; padding:0; width:100%; height:100%">
	<div data-dojo-type="dijit/layout/BorderContainer" style="margin:0; padding:0; width:100%; height:100%" data-dojo-attach-point="Border" gutters="false">
		<div data-dojo-type="dijit/layout/ContentPane" region="top" style="width:100%;" splitter="false">
			<div class="dijitToolbar" >Search:
				<div data-dojo-type="dijit/form/TextBox" data-dojo-attach-point="Search" style="width:20em" 
					intermediateChanges="false" placeholder="(search)" xdata-dojo-attach-event="onChange:onSearch"></div>
				<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:onSearch">Go</div>
			</div> 
		</div>		

		<div data-dojo-type="dijit/layout/ContentPane" region="leading" style="width:30%; height:100%" splitter="true">
			<div class="dijitReset" data-dojo-attach-point="tableDiv" style="height:100%; width:100%"></div>
		</div>
				
		<div data-dojo-type="dijit/layout/ContentPane" region="center" style="height:100%; width:70%" splitter="true">
			<div data-dojo-attach-point="Details" style="height:100%; width:100%"></div>
		</div>
	</div>
</div>
