<div>
	<table width="100%">
		<tr>
			<td>
				<img src="${_blankGif}" alt="" data-dojo-attach-point="imageNode" class="dijitArrowNode" role="presentation"></img>
			</td>
			<td><span data-dojo-attach-point="titleNode" class="tdiWebDevComp"></span>
			</td>
		</tr>
		<tr>
			<td colspan="3">
				<div data-dojo-type="dijit/Toolbar" data-dojo-attach-point="_toolbar" style="display:none">
					<div data-dojo-type="dijit/form/CheckBox" data-dojo-attach-point="_enabled" title="Uncheck to disable component" data-dojo-attach-event="onChange:onTooltipEnable" label=""></div>
					<div data-dojo-type="dijit/form/Button" title="Delete component" iconClass="dijitEditorIcon dijitEditorIconDelete" showLabel=false data-dojo-attach-event="onClick:onTooltipDelete"></div>
					<div data-dojo-type="dijit/form/Button" title="Copy to resources" iconClass="dijitEditorIcon dijitEditorIconCopy" showLabel=false data-dojo-attach-event="onClick:onTooltipCopy"></div>
				</div>
			</td>
		</tr>	
		<tr>
			<td></td>
			<td colspan="3">
				<span data-dojo-attach-point="contentNode"></span>
			</td>
		</tr>
		<tr>
			<td></td>
			<td colspan="3">
				<div data-dojo-attach-point="hooksNode"></div>
			</td>
		</tr>
	</table>
</div>
