<div style="width:100%; padding:0; margin:0">
	<div data-dojo-type="dijit/layout/ContentPane" style="width:100%; margin:0; padding:3px">
		<table width="100%">
		<tr>
		<td>
			<span class="tdiWebDevTitle">${title}</span>
		</td>
		<td>
			<div data-dojo-type="idx/form/Select" label="<span class='tdiWebDevTitle'>Mode: </span>" data-dojo-attach-event="onChange:onModeChange"data-dojo-attach-point="_mode">
				<option value='Iterator'>Iterator</option>
				<option value='AddOnly'>AddOnly</option>
				<option value='Delete'>Delete</option>
				<option value='Delta'>Delta</option>
				<option value='Lookup'>Lookup</option>
				<option value='Update'>Update</option>
				<option value='Server'>Server</option>
			</div>
		</td>
		<td>
			<span class="tdiWebDevTitle">Type:</span>
			<div data-dojo-type="dijit/form/FilteringSelect" label="<span class='tdiWebDevTitle'Type: </span>" data-dojo-attach-event="onChange:_onTypeChange"data-dojo-attach-point="_type">
			</div>
		</td>
		
		<td>
			<div data-dojo-type="dijit/form/Button">Test connection</div>
		</tr>
		</table>
	</div>
</div>
