<div>
	<div data-dojo-type="idx/app/AppFrame" style="width: 100%; height: 100%; margin: 0; padding: 0">

		<div data-dojo-type="idx/app/AppMarquee" region="marquee"
		       appName="Federated Directory Server"
		       vendorLogo="/fds/static/images/ibm-logo-white.png">

			<div data-dojo-type="dijit/form/Button" data-dojo-attach-point="btnSave" style="display:none" data-dojo-attach-event="onClick:saveConfig">${nls.WebCE_save}</div>
			<div data-dojo-type="dijit/form/Button" data-dojo-attach-point="btnUpdate" style="display:none" 
				tooltip="${nls.FDS_updateFdsConfigTooltip}" data-dojo-attach-event="onClick:updateFDS">${nls.FDS_updateFdsConfig}</div>

			<span data-dojo-type="idx/form/DropDownLink" label="${nls.AssemblyLineEditor3_options}">
				<div data-dojo-type="dijit/TooltipDialog">
					<table>
						<tr><td colspan="3">
							<div data-dojo-type="idx/form/CheckBox" data-dojo-attach-point="_autosave" data-dojo-attach-event="onChange:toggleAutoSave" label="${nls.FDS_autoSaveEnabled}" checked=true></div>
						</td></tr>
						<tr><td colspan="3">
							<div data-dojo-type="idx/form/CheckBox" data-dojo-attach-point="_autoupdate" data-dojo-attach-event="onChange:toggleAutoUpdate" label="${nls.FDS_snapshotAutoUpdate}" checked=true></div>
						</td></tr>
						<tr><td>
							${nls.FDS_snapshotTitle}
						</td></tr>
						<tr><td>
							<div data-dojo-type="dijit/form/ValidationTextBox" title="${nls.FDS_snapshotTitle}" regExp="^[A-Z|a-z|0-9|_|-]+$" data-dojo-attach-point="_snapshotTitle" style="width:300px"></div>
						</td><td>
							<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:saveSnapShot" >${nls.FDS_snapshotCreate}</div>
						</td></tr>
						<tr><td>
							${nls.FDS_snapshotLoad}
						</td></tr>
						<tr><td>
							<div data-dojo-type="dijit/form/Select" title="${nls.FDS_snapshotLoad}" style="width:300px" data-dojo-attach-point="_snapshots"></div>
						</td><td>
							<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:loadSnapShot">${nls.general_load_label}</div>
							<div data-dojo-type="dijit/form/Button" data-dojo-attach-event="onClick:deleteSnapShot">${nls.general_delete_label}</div>
						</td></tr>
					</table>
				</div>
			</span>

			<span data-dojo-type="idx/form/Link" data-dojo-attach-event="onClick:onShowWelcome">${nls.FDS_welcomePageTitle}</span>
			<span data-dojo-type="idx/form/Link" data-dojo-attach-event="onClick:onShowHelp">${nls.FDS_help}</span>
			<span data-dojo-type="idx/form/Link" data-dojo-attach-event="onClick:onLogout">${nls.FDS_logout}</span>
	
		</div>
		
		<div data-dojo-type="dijit.layout.BorderContainer" style="margin:0; padding:0; width:100%; height:100%">
			<div data-dojo-type="dijit.layout.ContentPane" style="margin:0; padding:0; width:100%; height:100%" region="center">
				<div data-dojo-type="tdi/ldapsync/LDSFlows" data-dojo-attach-point="flows"></div>
			</div>
		</div>

	</div>

</div>
