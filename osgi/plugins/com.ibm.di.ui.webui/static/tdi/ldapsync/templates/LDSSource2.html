<div style="height:100%;width:100%; margin:0px; padding:0px">
	<div data-dojo-type="dijit/layout/BorderContainer" style="width:100%; height:100%; margin:0px; padding:0x" gutters="false" data-dojo-attach-point="border">
		
		<div data-dojo-type="dijit/layout/ContentPane" class="dijitReset" region="top">
			<div data-dojo-type="dijit/form/Button" data-dojo-attach-point="testButton" data-dojo-attach-event="onClick:testConnection">${nls.ConfigSettingsEditor_TestConnection}</div>
			<div data-dojo-type="tdi/ToolbarLabel" label="${nls.ConnectorTreeUI_Localized_Parser}:"></div>
			<div data-dojo-type="idx/form/Select">
				<option value="ibmdi.CSV">CSV Parser</option>
				<option value="ibmdi.Fixed">Fixed Parser</option>
				<option value="ibmdi.JSON">Json Parser</option>
			</div>
			<div data-dojo-type="dijit/form/DropDownButton" data-dojo-attach-point="parserButton">
				<span data-dojo-attach-point="parserLabel">${nls.ConnectorTreeUI_Localized_Parser}</span>
				<div data-dojo-type="dijit/Menu" 
					data-dojo-attach-point="parserMenu">
				</div>
			</div>
		</div>
	
		<div data-dojo-type="dijit/layout/ContentPane" class="dijitReset" region="center" splitter="false">
			<div data-dojo-attach-point="Form" style="width:98%; height:100%; margin:0px; padding:0px;"></div>
		</div>
		
		<div data-dojo-type="dijit/layout/ContentPane" data-dojo-attach-point="_grid" class="dijitReset" collapsible=false region="bottom" splitter="true" style="height:50%">
		</div>
	</div>
</div>
