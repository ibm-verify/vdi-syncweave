<div class="dijitReset" style="width:100%">
	<div data-dojo-type="dijit/Menu" data-dojo-attach-point="CMenu" style="display:none">
		<div data-dojo-type="dijit/MenuItem" data-dojo-attach-event="onClick:_onDeleteEndpoint">${nls.general_delete_label}</div>
		<div data-dojo-type="dijit/MenuItem" data-dojo-attach-event="onClick:_onBrowseEndpoint"
		     data-dojo-attach-point="_browseMenu">${nls.DataBrowser_title}</div>
	</div>
	
	<table class="dijitReset" width="100%">
		<tr>
			<td width="85%">
				<div data-dojo-type="idx/form/Link" 
						data-dojo-attach-point="Name"
						data-dojo-attach-event="onClick:_onEditEndpoint"
				></div>
			</td>
			<td>
				<img width="16" height="16" data-dojo-attach-point="Status" src="images/Active.gif"></img>
			</td>
		</tr>
	</table>
</div>
