<div>
	<p></p>
	<table cellspacing="5">
		<tr>
			<td>${nls.ConfigTable_Name}</td>
			<td><div dojoType="dijit.form.ValidationTextBox" data-dojo-attach-point="name" type="text" name="name" required="true" regExp="[A-Z|a-z|0-9|_|-]+"></div></td>
		</tr>
		<tr>
			<td>${nls.FDS_selectEndpoint}:</td>
			<td><div dojoType="idx/form/Select" name="value" instantValidate="true" required="true" data-dojo-attach-point="selectWidget"></div></td>
		</tr>
		<tr>
			<td></td>
			<td>
				<div dojoType="dijit.form.Button" data-dojo-attach-event="onClick:handleCancel">${nls.WebCE_cancel}</div>
				<div dojoType="dijit.form.Button" data-dojo-attach-event="onClick:handleOK">${nls.WebCE_ok}</div>
			</td>
		</tr>
	</table>
</div>
