TADDM_CD_CONNECTOR_TITLE = TADDM Change Detection Connector
CONN_DESC = A Connector capable of detecting changes in TADDM.
TADDM_CD_CONN_CI = Configuration Item
TADDM_CD_CONN_RELATIONSHIP = Relationship
TADDM_CD_CONN_ARTIFACTTYPE_DESC = Determines the type of artifact that this Connector will work with.
TADDM_CD_CONN_ARTIFACTTYPE_LABEL = Artifact Type
TADDM_CD_CONN_CLASSTYPE_DESC = The type of Configuration Item or Relationship that will be processed.
TADDM_CD_CONN_CLASSTYPE_LABEL = Class Type
TADDM_CD_CONN_CLASSTYPE_SCRIPT_LABEL = Select...
TADDM_CD_CONN_CLASSTYPE_SCRIPT_HELP = Choose one of the supported classes.
TADDM_CD_CONN_IDMLMODE_DESC = If checked the Connector will only work with IdML compatible data.
TADDM_CD_CONN_IDMLMODE_LABEL = IdML Mode
TADDM_CD_CONN_DEPTH_DESC = Limits the amount of related items returned for each item.
TADDM_CD_CONN_DEPTH_LABEL = Depth
TADDM_CD_CONN_HOSTNAME_DESC = The hostname of the TADDM server.
TADDM_CD_CONN_HOSTNAME_LABEL = Hostname
TADDM_CD_CONN_PORT_DESC = The port for connecting to TADDM. If left blank, the default port for the TADDM SDK will be used.
TADDM_CD_CONN_PORT_LABEL = Port
TADDM_CD_CONN_USERNAME_DESC = The username used when connecting to TADDM.
TADDM_CD_CONN_USERNAME_LABEL = Username
TADDM_CD_CONN_PASSWORD_DESC = The password used when connecting to TADDM.
TADDM_CD_CONN_PASSWORD_LABEL = Password
TADDM_CD_CONN_TADDMSDK_DESC = The location of the TADDM SDK used by the Connector.
TADDM_CD_CONN_TADDMSDK_LABEL = TADDM SDK
TADDM_CD_CONN_TADDMSDK_SCRIPT_LABEL = Select...
TADDM_CD_CONN_TADDMSDK_SCRIPT_HELP = Choose the location of TADDM SDK
TADDM_CD_CONN_STATE_KEY_DESC = A key (which should be unique) used to keep track of the last change processed by this Connector.
TADDM_CD_CONN_STATE_KEY_LABEL = Iterator State Key
TADDM_CD_CONN_DELETE_BUTTON_LABEL = Delete
TADDM_CD_CONN_DELETE_BUTTON_HELP = Deletes Iterator State information
TADDM_CD_CONN_STARTAT_DESC = All changes after this point in time will be returned. The supported format is 'dd/MM/yyyy HH\:mm\:ss'. If left blank, all changes since "01/01/1970 00\:00\:00" will be detected while "EOD" will return changes that occurred after the Connector was started. 
TADDM_CD_CONN_STARTAT_LABEL = Start at
Localized.EOD = EOD
TADDM_CD_CONN_SERVER_TIME_LABEL = Check time
TADDM_CD_CONN_SERVER_TIME_HELP = Returns the local time on the TADDM server.
TADDM_CD_CONN_CREATED_DESC = Return created model objects.
TADDM_CD_CONN_CREATED_LABEL = Create
TADDM_CD_CONN_UPDATED_DESC = Return updated model objects.
TADDM_CD_CONN_UPDATED_LABEL = Update
TADDM_CD_CONN_DELETED_DESC = Return deleted model objects.
TADDM_CD_CONN_DELETED_LABEL = Delete
TADDM_CD_CONN_STATE_KEY_PERSIST_DESC = Determines when Iterator State is saved. The recommended setting is End of Cycle.
TADDM_CD_CONN_STATE_KEY_PERSIST_LABEL = State Key Persistence
Localized.After.read = After read
Localized.End.of.cycle = End of cycle
Localized.Manual = Manual
TADDM_CD_CONN_POLLINTERVAL_DESC = The number of seconds between each time TADDM is polled looking for new changes. If left blank, a value of 180 will be used.
TADDM_CD_CONN_POLLINTERVAL_LABEL = Sleep Interval
TADDM_CD_CONN_TIMEOUT_DESC = The maximum number of seconds to wait for the next 'change' (0 \= wait forever). If left blank, a value of 0 will be used.
TADDM_CD_CONN_TIMEOUT_LABEL = Timeout
TADDM_CD_CONN_USESSL_DESC = Use SSL connection.
TADDM_CD_CONN_USESSL_LABEL = Use SSL
TADDM_CD_CONN_DOMAINATTRS_DESC = Returns the domain attributes of each read item.
TADDM_CD_CONN_DOMAINATTRS_LABEL = Domain Attributes
TADDM_CD_CONN_EXTENDEDATTRS_DESC = Returns the extended attributes of each read item.
TADDM_CD_CONN_EXTENDEDATTRS_LABEL = Extended Attributes
TADDM_CD_CONN_MSSATTRS_DESC = Returns information for the MSSs associated with the read item.
TADDM_CD_CONN_MSSATTRS_LABEL = MSS Information
TADDM_CD_CONN_MSS_DESC = Management Software Systems Guid
Advanced = Advanced
ExtraAttributes = Extra Attributes
