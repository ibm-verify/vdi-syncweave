<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
				
		<title>Directory Integrator Dashboard Login</title>
		
		<style type="text/css">
			@import "login/login.css";
		</style>
		
		<!-- Load dojo toolkit -->
		<script>
			var djConfig = {
					parseOnLoad: true,
					isDebug:false,
					modulePaths: {"tdi":"/dashboard/static/tdi", "tdinls":"/dashboard/tdinls"}
			};
		</script>
		<script src="dojo/dojo.js" type="text/javascript"></script>
		
		<script>
		function doLogin() {
			dojo.attr("message", "innerHTML", "");
			dojo.when(dojo.xhrPost({
				url:"/dashboard/static/index.html",
				form: "formData",
				handleAs:"text"
			}), function(respText) {
                /*
                * ISDIDEV-552 [ISDIPSIRT-5]
                * Handles the post-login response to determine the next navigation step.
                * If `status` is "forcePasswordChange", redirects to the change password page.
                * If the response is not valid JSON (assumed to indicate a successful login), 
                */
                let jsonResp;
                // if we can get to the page then we are in session
                // and can redirect to the home page.
                try {
                    jsonResp = JSON.parse(respText);
                    if (jsonResp.status === "forcePasswordChange") {
                        window.location.replace("/dashboard/static/password.html");
                        return;
                    }
                } catch (e) {
                    // Response not JSON, assuming login success
                }
				window.location.replace("/dashboard/static/index.html");
			}, dojo.hitch(this, function(err) {
				// bad login - display error message
				dojo.attr("message","innerHTML", err.responseText ? err.responseText : err);
				dojo.style("message", "color", "red");
			}));
			return false;
		}
		</script>
		
		<script>
			dojo.require("tdi.NlsMixin");
			var nls = new tdi.NlsMixin({});
			dojo.byId("username_label").innerHTML = nls.getString("WebCE_username");
			dojo.byId("password_label").innerHTML = nls.getString("WebCE_password");
		</script>
	
	</head>

	<body>
		<div>
			<form id="formData" method="POST" action="index.html" onsubmit="return doLogin()">
				<table class="main_tbl" cellpadding="0" cellspacing="5">
					<tr>
						<td align="right"><span style="color:white;font-size:1.4em">IBM &#0174;</span></td>
					</tr>
					<tr>
						<td class="dialog" colspan="2">
						<table cellpadding="0" cellspacing="0">
							<tr>
								<td colspan="2" class="prod_name"><img
									src="login/images/title.png" alt="Security Verify Directory Integrator" /></td>
							</tr>
							<tr>
								<td colspan="2">
									<span id="message"></span>
								</td>
							</tr>
							<tr>
								<td class="input_pad"><label id="username_label" for="user">User name:</label> <br />
								<input size="40" name="username" id="username" value="" type="text" /></td>
							</tr>
							<tr>
								<td class="input_pad"><label id="password_label" for="password">Password:</label> <br />
								<input size="40" name="password" id="password" value=""
									type="password" /></td>
							</tr>
							<tr>
								<td align="right"><input type="submit"
									class="tiv_btn" /></td>
							</tr>
						</table>
						</td>
					</tr>
					<tr>
						
					</tr>
				</table>
			</form>
		</div>
	</body>
</html>
