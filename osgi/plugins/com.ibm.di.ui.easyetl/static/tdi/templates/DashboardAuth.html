<div style="margin-left:10px">

	<form dojoAttachPoint="_form" dojoType="dijit.form.Form">
		
		${nls.WebCE_securityDashboard}
		
		<table width="100%">
			<tr><td style="padding-top:8px"">
				${nls.WebCE_securityDashboardLocal}
			</td></tr>
			<tr><td style="padding-top:4px">
				<div dojoType="dijit.form.ComboBox" name="local">
					<option>none</option>
					<option>deny</option>
					<option>ldap</option>
				</div>
			</td></tr>

			<tr><td style="padding-top:8px"">
				${nls.WebCE_securityDashboardRemote}
			</td></tr>
			<tr><td style="padding-top:4px">
				<div dojoType="dijit.form.ComboBox" name="remote">
					<option>none</option>
					<option>deny</option>
					<option>ldap</option>
				</div>
			</td></tr>
			
			<tr><td style="padding-top:8px">
			${nls.WebCE_securityDashboardLdapHost}
			</td></tr>
			<tr><td style="padding-top:4px">
				<div dojoType="dijit.form.TextBox" name="ldap_host" style="width:40em"></div>
			</td></tr>
			
			<tr><td style="padding-top:8px"">
				${nls.WebCE_securityDashboardLdapSearchbase}
			</td></tr>
			<tr><td style="padding-top:4px">
				<div dojoType="dijit.form.TextBox" name="ldap_search" style="width:40em"></div>
			</td></tr>

			<tr><td style="padding-top:8px"">
				${nls.WebCE_securityDashboardGroup} 
			</td></tr>
			<tr><td style="padding-top:4px">
				<div dojoType="dijit.form.TextBox" name="ldap_group" style="width:40em"></div>
			</td></tr>
			
			<tr><td style="padding-top:12px"">
				<div dojoType="dijit.form.Button" dojoAttachEvent="onClick:updateServer" label="${nls.Localized_Update}"></div>
				<p/>
				${nls.WebCE_updateTakesImmediateEffect}
			</td></tr>
			
		</table>
	
	</form>


</div>
