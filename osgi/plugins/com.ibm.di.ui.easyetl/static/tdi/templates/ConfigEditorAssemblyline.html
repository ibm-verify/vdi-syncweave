<div style="width:100%; height:100%; padding:0px">
	<div dojoType="dijit.layout.TabContainer" dojoAttachPoint="Tabs" style="width:100%; height:100%; padding:0px; margin:0px">
		<div dojoType="dijit.layout.ContentPane" title="${nls.WebCE_schedule}">
			<div dojoAttachPoint="Configuration" dojoType="tdi.ALSchedule"></div>
		</div>
		<div dojoType="dijit.layout.ContentPane" title="${nls.WebCE_run}">
			<div dojoType="dijit.Toolbar">
				<div dojoType="dijit.form.Button" dojoAttachPoint="runButton" dojoAttachEvent="onClick:runAssemblyLine">${nls.WebCE_run}</div>
				<div dojoType="dijit.form.Button" dojoAttachPoint="stopButton" dojoAttachEvent="onClick:stopAssemblyLine">${nls.WebCE_stop}</div>
			</div>
			<div dojoAttachPoint="RunLog"></div>
		</div>
	</div>
</div>
