<div>
	<div dojoType="dijit.layout.BorderContainer" gutters="false" design="sidebar" style="width:100%; height:100%" dojoAttachPoint="top">
		
		<div dojoType="dijit.layout.ContentPane" region="leading" splitter="true" style="width:30%" dojoAttachPoint="left">
			<div dojoType="dijit.layout.BorderContainer" gutters="false" design="headline" style="width:100%; height:100%">
				<div dojoType="dijit.layout.ContentPane" region="top">
					<h1>${nls.DataBrowser_title}</h1>
					<div dojoType="dijit.form.ComboBox" dojoAttachPoint="newConnectors" dojoAttachEvent="onChange:openConnector">
						<option></option>
					</div>
					<br>
					${nls.WebCE_parser}:<br><div dojoType="dijit.form.ComboBox" dojoAttachPoint="newParsers" dojoAttachEvent="onChange:openParser">
						<option></option>
					</div>
					<div dojoType="dijit.form.Button" label="${nls.WebCE_save}" title="${nls.saveBrowseConnector}" dojoAttachEvent="onClick:addTarget" dojoAttachPoint="_addButton"></div>
				</div>
				<div dojoType="dijit.layout.ContentPane" region="center" dojoAttachPoint="tableCP">
				</div>
				<div dojoType="dijit.layout.ContentPane" region="bottom">
					<div dojoType="dijit.form.Button" label="${nls.saveIntegration}" title="${nls.saveIntegrationTooltip}" dojoAttachPoint="_saveButton" dojoAttachEvent="onClick:saveTarget"></div>
				</div>
			</div>
		</div>
		
		<div dojoType="dijit.layout.ContentPane" region="center" splitter="true">
			<div dojoType="dijit.layout.TabContainer" dojoAttachPoint="tabs" style="width:100%; height:100%"></div>
		</div>
	</div>
</div>
