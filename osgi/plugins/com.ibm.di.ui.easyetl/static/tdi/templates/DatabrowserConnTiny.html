<div>
	<div dojoType="dijit.layout.BorderContainer" gutters="false" design="headline" style="width:100%; height:100%" dojoAttachPoint="top">
		
		<div dojoType="dijit.layout.ContentPane" region="top" splitter="false">
			${nls.DataBrowser_title}: <div dojoType="dijit.form.ComboBox" dojoAttachPoint="newConnectors" dojoAttachEvent="onChange:openConnector">
				<option></option>
			</div>
			${nls.WebCE_parser}: <div dojoType="dijit.form.ComboBox" dojoAttachPoint="newParsers" dojoAttachEvent="onChange:openParser">
				<option></option>
			</div>
		</div>
		
		<div dojoType="dijit.layout.ContentPane" region="center" splitter="false">
			<div dojoType="dijit.layout.TabContainer" dojoAttachPoint="tabs" style="width:100%; height:100%"></div>
		</div>
		
		<div dojoType="dijit.layout.ContentPane" region="bottom" splitter="false">
			<div dojoType="dijit.form.Button" label="Back" dojoAttachPoint="_saveButton" dojoAttachEvent="onClick:saveTarget"></div>
		</div>

	</div>
</div>
