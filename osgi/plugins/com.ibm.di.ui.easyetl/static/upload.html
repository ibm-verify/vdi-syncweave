<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
<title>Security Verify Directory Integrator - Upload</title>
<link rel="stylesheet" type="text/css"
	href="dijit/themes/claro/claro.css">
<link rel="stylesheet" type="text/css"
	href="dojox/form/resources/FileUploader.css">
<link rel="stylesheet" type="text/css" href="images.css">
<link rel="stylesheet" type="text/css" href="banner/ibm-banner.css">

<style type="text/css">
html,body {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	overflow: hidden;
}

#borderContainerMain {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
}
</style>

<!-- Load dojo toolkit -->
<script>
	var djConfig = {
		parseOnLoad : true,
		isDebug : false
	};
</script>
<script src="dojo/dojo.js" type="text/javascript"></script>

<!-- Main widget -->
<script type="text/javascript">
	dojo.require("tdi.tdiapi");
	function listFiles() {
		dojo.when(tdiapi.getServerProjects(), dojo.hitch(this,
				"listInstalledFiles"));
		dojo
				.when(tdiapi.getWebCeTemplates(), dojo.hitch(this,
						"listTemplates"));
	}

	function listInstalledFiles(result) {
		for (f in result.items) {
			var item = result.items[f];
			dojo.create("div", {
				innerHTML : item.name
			}, dojo.byId("installedFiles"));
		}
	}

	function listTemplates(result) {
		for (f in result.ConfigTemplate) {
			var item = result.ConfigTemplate[f];
			dojo.create("div", {
				innerHTML : item.Name
			}, dojo.byId("templateFiles"));
		}
	}
	
	dojo.addOnLoad(dojo.hitch(this, "listFiles"));
</script>
</head>

<body class="claro">

	<div id="ibm-banner">
	<table width="100%" border="0" cellspacing="0" cellpadding="0">
		<tr valign="middle">
			<td height="35" id="ibm-banner-main"><img
				src="banner/img/tivoli-bbm_white.gif" alt="TIVOLI" width="44"
				height="24" /> <span class="ibm-banner-product-name"
				style="font-size: 16px; vertical-align: middle"> Directory
			Integrator </span></td>
			<td id="ibm-banner-logo" width="49"><img
				src="banner/img/ibm_w_tr.gif" width="41" height="15" alt="IBM logo" /></td>
		</tr>
	</table>
	<br>
	<br>
	</div>

	<form id="form01" method="POST" action="/etl/templates" target="_blank" enctype="multipart/form-data">
		<table>
			<tr>
				<td valign="top">
					<table cellspacing="5">
						<tr>
							<td>
							<h2>Installed Solutions</h2>
							</td>
						</tr>
						<tr>
							<td>
							<div id="installedFiles"></div>
							</td>
						</tr>
						
						<tr>
							<td>
							<h2>Template Solutions</h2>
							</td>
						</tr>
						<tr>
							<td>
							<div id="templateFiles"></div>
							</td>
						</tr>
					</table>
				</td>
				
				<td width="40"></td>
				
				<td valign="top">
					<table cellspacing="5">
						<tr>
							<td colspan="2">
							<h2>Upload SDI Solution</h2>
							</td>
			
						</tr>
						<tr>
							<td></td>
							<td><input type="file" name="filename"></input></td>
						</tr>
						<tr>
							<td></td>
							<td><input type="checkbox" name="template"></input>Upload as template</td>
						</tr>
						<tr>
							<td></td>
							<td><input type="checkbox" name="replace"></input>Overwrite existing solution</td>
						</tr>
						<tr>
							<td></td>
							<td><input type="submit"/></td>
						</tr>
					</table>
				</td>
				
			</tr>
		</table>
	</form>
</body>

</html>
