<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
	<head>
		<title>Security Verify Directory Integrator - Dashboard</title>

		<link rel="stylesheet" type="text/css" href="styles.css">
		
		<style type="text/css">
			html,body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				overflow:hidden;
			}
			
			#borderContainerMain {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
			}
			
		</style>
		
		<!-- Load dojo toolkit -->
		<script>
			var djConfig = {
					parseOnLoad: true,
					isDebug:false,
					modulePaths: {"tdinls":"/dashboard/tdinls"}
			};
		</script>
		<script src="dojo/dojo.js" type="text/javascript"></script>
		
		<!-- Main widget -->
		<script type="text/javascript">
			dojo.require("tdi.Dashboard");
			
			window.onbeforeunload = function (evt) {
				var widget = dijit.byId("borderContainerMain");
				var ret = null;
				if(widget && widget.hasPendingChanges) {
					ret = widget.hasPendingChanges();
				}
				tdiapi.stopServerEventNotifications();
				return ret;
	    	}
	  </script>

	</head>
	
	

	<body class="claro">
		<div id="borderContainerMain" dojoType="tdi.Dashboard"></div>
	</body>

</html>
