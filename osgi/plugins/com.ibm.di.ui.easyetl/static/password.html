<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
				
		<title>Directory Integrator Dashboard Change Password</title>
		
		<style type="text/css">
			@import "password/password.css";
		</style>
		
		<!-- Load dojo toolkit -->
		<script>
			var djConfig = {
					parseOnLoad: true,
					isDebug:false,
					modulePaths: {"tdi":"/dashboard/static/tdi", "tdinls":"/dashboard/tdinls"}
			};
		</script>
		<script src="dojo/dojo.js" type="text/javascript"></script>
		
		<script>
		dojo.addOnLoad(function () {
            window.changePassword = function () {
                dojo.attr("message", "innerHTML", "");

                const newPass = dojo.byId("newpassword").value;
                const confirmPass = dojo.byId("confirmpassword").value;
                const actionPass = dojo.byId("passwordchange").value;

                if (newPass !== confirmPass) {
                    dojo.attr("message", "innerHTML", "Passwords do not match.");
                    dojo.style("message", "color", "red");
                    return false;
                }

                // ISDIDEV-552 password policy regex & disallowed special characters
                // Password must:
                // - Be at least 8 characters
                // - Contain at least one lowercase letter
                // - Contain at least one uppercase letter
                // - Contain at least one number
                // - Contain at l
                var passwordPolicy = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#%^*()_+=\-[\]{}:"\\,.?/]).{8,}$/;
                var disallowedChars = /[<>`$|;&]/;

                if (disallowedChars.test(newPass)) {
                    dojo.attr("message", "innerHTML", "Password cannot contain any of the following characters: < > ` $ | ; &");
                    dojo.style("message", "color", "red");
                    return false;
                }

                if (!passwordPolicy.test(newPass)) {
                    dojo.attr("message", "innerHTML", "Password must be at least 8 characters long and include uppercase, lowercase, number, and a valid special character.");
                    dojo.style("message", "color", "red");
                    return false;
                }

                dojo.when(dojo.xhrPost({
                    url: "/dashboard/static/index.html",
                    form: "formData",
                    handleAs: "text"
                }), function (resp) {
                    window.location.replace("/dashboard/static/login.html");
                }, function (err) {
                    dojo.attr("message", "innerHTML", err.responseText ? err.responseText : err);
                    dojo.style("message", "color", "red");
                });

                return false;
            }
        });
		</script>
	
	</head>

	<body>
		<div>
			<form id="formData" method="POST" action="index.html" onsubmit="return changePassword()">
				<table class="main_tbl" cellpadding="0" cellspacing="5">
					<tr>
						<td align="right"><span style="color:white;font-size:1.4em">IBM &#0174;</span></td>
					</tr>
					<tr style="display: none;">
						<td>
							<input type="hidden" name="action" id="passwordchange" value="passwordchange" />
							<input type="hidden" name="username" id="username" value="admin" />
						</td>
					</tr>
					<tr>
						<td class="dialog" colspan="2">
						<table cellpadding="0" cellspacing="0">
							<tr>
								<td colspan="2" class="prod_name"><img
									src="login/images/title.png" alt="Security Directory Integrator" /></td>
							</tr>
							<tr>
								<td colspan="2">
									<span id="message"></span>
								</td>
							</tr>
							<tr>
								<td class="input_pad"><label id="newpassword_label" for="user">New Password:</label> <br />
								<input size="40" name="newpassword" id="newpassword" value="" type="password" /></td>
							</tr>
							<tr>
								<td class="input_pad"><label id="confirmpassword_label" for="password">Confirm Password:</label> <br />
								<input size="40" name="confirmpassword" id="confirmpassword" value="" type="password" /></td>
							</tr>
							<tr>
								<td align="right"><input type="submit" class="tiv_btn" /></td>
							</tr>
						</table>
						</td>
					</tr>
					<tr>
						
					</tr>
				</table>
			</form>
		</div>
	</body>
</html>
