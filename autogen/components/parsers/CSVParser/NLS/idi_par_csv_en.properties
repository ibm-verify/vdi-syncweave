PAR_DESC = Comma Separated
sep_desc = Character used to separate fields. This is typically a comma or semicolon.
sep_label = Field Separator
col_desc = Field names, in the order they appear. Enter each field name on a separate line.
col_label = Field Names
quo_desc = Check to enable special handling of quotes in field values.
quo_label = Enable Quoting
head_desc = Write a header line containing the field names
head_label = Write header
bom_label = Write BOM
bom_desc = Write Byte Order Marker (BOM) to the file. The Write header parameter needs to be set to true for this to take effect.
line_desc = Log linenumber for lines longer than a specific number of bytes (nice for debugging)
line_label = Log long lines
set_desc = Character Encoding to be used
set_label = Character Encoding
PAR_TITLE = CSV Parser
Advanced = Advanced
combine_last_desc = Combine all extra fields from lines exceeding the number of defined fields into a new "Remainder" field
combine_last_label = Combine remainder in last field
quo_all_desc = Quote all fields independently if they contain quotation mark, separator or new line
quo_all_label = Quote all fields
sort_attr_label = Sort fields
sort_attr_desc = Check to write header fields in alphabetical order (ascending) 
