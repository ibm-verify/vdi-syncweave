# Generic (Common) resource strings
######################################################
# NLS_MESSAGEFORMAT_NONE
# NLS_ENCODING=UNICODE
TITLE=XML-Parser
DESC=XML-Parser
XPATH_EXPR_DESC=Definiert den einfachen XPath-Ausdruck f\u00fcr die Suche nach Eintr\u00e4gen. Beschreibt dar\u00fcber hinaus die XML-Struktur beim Schreibvorgang. (Beispiel: /root/entry | /elm1/pref2:elm2/elm3)
XPATH_EXPR_LABEL=Einfaches XPath
NS_MAP_DESC=Zuordnungen von <pr\u00e4fix>=<namensbereich> getrennt durch das Pipe-Zeichen (|). Wenn das Pr\u00e4fix mit einem Dollarzeichen beginnt, wird es als Standardnamensbereichsdeklaration interpretiert.
NS_MAP_LABEL=Zuordnung von Pr\u00e4fix und Namensbereich
SCHEMA_URL_DESC=Definiert die Schemaposition ausschlie\u00dflich zu Anzeigezwecken.
SCHEMA_URL_LABEL=XSD-Schemaposition
OMIT_ON_REDING_DESC=Die erste XML-Deklaration (falls vorhanden) wird stets akzeptiert, alle weiteren werden ignoriert.
OMIT_ON_REDING_LABEL=Wiederholte XML-Deklarationen beim Lesen ignorieren
OMIT_ON_WRITING_DESC=Wenn diese Option ausgew\u00e4hlt ist, schreibt der Parser keine XML-Deklarationen in die Ausgabe. Dies ist n\u00fctzlich, wenn bereits XML-Inhalt vorliegt (mit XML-Deklarationen), an den XML-Daten angeh\u00e4ngt werden sollen.
OMIT_ON_WRITING_LABEL=XML-Deklaration beim Schreiben \u00fcbergehen
CHARSET_DESC=Beim Lesen oder Schreiben zu verwendende Zeichencodierung.
CHARSET_LABEL=Zeichencodierung
COALESCING_DESC=Wenn diese Option ausgew\u00e4hlt wird, verbindet der Parser benachbarte Zeichendatenabschnitte.
COALESCING_LABEL=Verbinden
STANDALONE_ROOT_DESC=Wenn diese Option ausgew\u00e4hlt wird, wird jeder an den XML-Parser \u00fcbergebene Eintrag in den/die konfigurierten Stammtag(s) geschrieben. Hierdurch wird ein Dokument mit mehreren Stammelementen erstellt, wenn w\u00e4hrend der FL-Ausf\u00fchrung mehrere Eintr\u00e4ge an den Parser \u00fcbergeben werden.
STANDALONE_ROOT_LABEL=Dokument mit mehreren Stammelementen
STATIC_DECL_DESC=Deklarieren von Attributen und Pr\u00e4fixen. Dabei werden die statischen Elemente verwendet, die mit dem Parameter 'xpath.expr' angegeben werden.
STATIC_DECL_LABEL=Statische Attributdeklarationen
INDENT_DECL=Wenn dieses Feld markiert ist, wird die Ausgabe einger\u00fcckt.
INDENT_LABEL=Ausgabe einr\u00fccken
Advanced=Erweitert
ENTRY_TAG_DESC=Der Name des Elements, in das die einzelnen Eintr\u00e4ge bei der Ausgabe eingeschlossen werden. Das Element kann zusammen mit einem Pr\u00e4fix verwendet werden, das bereits f\u00fcr den bestimmten Elementkontext definiert ist.
ENTRY_TAG_LABEL=Eintragstag
VALUE_TAG_DESC=Der Name des Elements, in das die einzelnen Werte eines Attributs mit mehreren Werten eingeschlossen werden. Verf\u00fcgt ein Attribut nur \u00fcber einen einzelnen Wert, wird dieser nicht eingeschlossen. Das Element kann zusammen mit einem Pr\u00e4fix verwendet werden, das bereits f\u00fcr den bestimmten Elementkontext definiert ist.
VALUE_TAG_LABEL=Werttag
INVALID_XML_CHAR_LABEL=Ung\u00fcltige XML-Zeichen beim Schreiben zulassen
INVALID_XML_CHAR_DESC=Wenn diese Option ausgew\u00e4hlt ist, werden die gem\u00e4\u00df XML-Spezifikation ung\u00fcltigen XML-Zeichen in die XML-Tags eingeschlossen. Es wird eine E/A-Ausnahmebedingung ausgel\u00f6st, wenn die Option beim Schreiben der XML abgew\u00e4hlt wird.
