# NLS_MESSAGEFORMAT_NONE
# NLS_ENCODING=UNICODE
TITLE=Parser XML
DESC=Parser XML
XPATH_EXPR_DESC=Imposta la semplice espressione XPath utilizzata per trovare le voci. Utilizzata anche per descrivere la struttura dell'XML in fase di scrittura. (Valore di esempio, /root/entry | /elm1/pref2:elm2/elm3)
XPATH_EXPR_LABEL=XPath semplice
NS_MAP_DESC=Mappature tra <prefix>=<namespace> separate da un carattere pipe (|). Se il prefisso inizia con $, sar\u00e0 considerato una dichiarazione di spazio dei nomi predefinita.
NS_MAP_LABEL=Prefisso a mappa spazio dei nomi
SCHEMA_URL_DESC=Impostare l'ubicazione di schema utilizzata solo per scopi di visualizzazione.
SCHEMA_URL_LABEL=Ubicazione schema XSD
OMIT_ON_REDING_DESC=L'eventuale prima dichiarazione XML viene sempre riconosciuta, mentre le altre verranno ignorate.
OMIT_ON_REDING_LABEL=Ignora dichiarazioni XML ripetute durante la lettura
OMIT_ON_WRITING_DESC=Quando questa opzione \u00e8 selezionata, il parser non scriver\u00e0 dichiarazioni XML nell'output. Questo \u00e8 utile quando si ha del contenuto XML (che gi\u00e0 contiene una dichiarazione XML) e si desidera accodarvi dei dati XML.
OMIT_ON_WRITING_LABEL=Ometti dichiarazione XML in fase di scrittura.
CHARSET_DESC=Codifica caratteri da utilizzare in fase di lettura o scrittura.
CHARSET_LABEL=Codifica caratteri
COALESCING_DESC=Se true, il parser unir\u00e0 le sezioni di dati carattere adiacenti.
COALESCING_LABEL=Unione
STANDALONE_ROOT_DESC=Quando questa opzione \u00e8 selezionata, ciascuna voce passata al parser XML verr\u00e0 scritta nel tag o nei tag root configurati. Questo creer\u00e0 un documento con pi\u00f9 root, se durante l'esecuzione AL viene passata pi\u00f9 di una voce al parser.
STANDALONE_ROOT_LABEL=Documento con pi\u00f9 root
STATIC_DECL_DESC=Utilizzare questa opzione per dichiarare attributi e prefissi. Verranno scritti con gli elementi statici specificati dal parametro xpath.expr.
STATIC_DECL_LABEL=Dichiarazioni attributi statici
INDENT_DECL=Se questo campo \u00e8 selezionato, verr\u00e0 eseguito il rientro dell'output.
INDENT_LABEL=Esegui rientro output
Advanced=Avanzate
ENTRY_TAG_DESC=Questo \u00e8 il nome dell'elemento che includer\u00e0 ciascuna voce all'output. Pu\u00f2 essere utilizzato con un prefisso, che \u00e8 gi\u00e0 definito per il contesto di elemento specifico.
ENTRY_TAG_LABEL=Tag voce
VALUE_TAG_DESC=Questo \u00e8 il nome dell'elemento che verr\u00e0 utilizzato per includere ciascun valore di un attributo con pi\u00f9 valori. Se un attributo ha solo un singolo valore, tale valore non verr\u00e0 incluso. Pu\u00f2 essere utilizzato con un prefisso, che \u00e8 gi\u00e0 definito per il contesto di elemento specifico.
VALUE_TAG_LABEL=Tag valore
INVALID_XML_CHAR_LABEL=Consenti caratteri XML non validi durante la scrittura
INVALID_XML_CHAR_DESC=Quando questa opzione \u00e8 selezionata, i caratteri XML non validi, in base alla specifica XML, vengono inclusi nei tag XML e viene generata un'eccezione se l'opzione viene deselezionata durante la scrittura dell'XML.
