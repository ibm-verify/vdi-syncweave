TITLE = XML Parser
DESC = XML Parser
XPATH_EXPR_DESC = Sets the simple XPath expression used to find entries. Also used to describe the structure of the XML when writing. (Example value, /root/entry | /elm1/pref2\:elm2/elm3)
XPATH_EXPR_LABEL = Simple XPath
NS_MAP_DESC = Mappings between <prefix>\=<namespace> separated by pipe char (|). If the prefix starts with $, it will be considered to be a default namespace declaration.
NS_MAP_LABEL = Prefix To Namespace Map
SCHEMA_URL_DESC = Set the schema location used for displaying purposes only.
SCHEMA_URL_LABEL = XSD Schema Location
OMIT_ON_REDING_DESC = The first XML declaration (if any) is always acknowledged, but any other will be ignored.
OMIT_ON_REDING_LABEL = Ignore repeating XML declarations while reading
OMIT_ON_WRITING_DESC = When this is checked the parser will not write any XML declaration to the output. This is useful when we have some XML contents (already containing XML declaration) and we want to append some XML data to it.
OMIT_ON_WRITING_LABEL = Omit XML declaration when writing.
CHARSET_DESC = Character encoding to use when reading or writing.
CHARSET_LABEL = Character Encoding
COALESCING_DESC = If true, then the parser will coalesce adjacent character data sections.
COALESCING_LABEL = Coalescing
STANDALONE_ROOT_DESC = When checked each entry passed to the XML Parser will be writen inside the configured root tag(s). This will create a multi-rooted document if more than one entries are passed to the Parser during the AL execution.
STANDALONE_ROOT_LABEL = Multi-rooted Document
STATIC_DECL_DESC = Use this to declare attributes and prefixes. They will be written with the static elements specified by the xpath.expr parameter.
STATIC_DECL_LABEL = Static Attribute Declarations
INDENT_DECL = If this field is checked, then the output will be indented.
INDENT_LABEL = Indent Output
Advanced = Advanced
ENTRY_TAG_DESC = This is the name of the element which will wrap each entry when output. Can be used with a prefix, which is already defined for the specific element context.
ENTRY_TAG_LABEL = Entry Tag
VALUE_TAG_DESC = This is the name of the element which will be used to wrap each value of a multi-valued attribute. If an attribute only has a single value, that value will not be wrapped. Can be used with a prefix, that is already defined for the specific element context.
VALUE_TAG_LABEL = Value Tag
INVALID_XML_CHAR_LABEL = Permit invalid XML characters when writing
INVALID_XML_CHAR_DESC = When checked the invalid XML characters according to the XML specification are included in the XML tags and an exception is thrown if unchecked while writing the XML.
