# NLS_MESSAGEFORMAT_NONE
# NLS_ENCODING=UNICODE
TITLE=Analizador XML
DESC=Analizador XML
XPATH_EXPR_DESC=Define la expresi\u00f3n XPath simple utilizada para encontrar las entradas. Tambi\u00e9n se utiliza para describir la estructura de XML al grabar. (por ejemplo, /root/entry | /elm1/pref2:elm2/elm3)
XPATH_EXPR_LABEL=XPath simple
NS_MAP_DESC=Correlaciones entre <prefijo>=<espacio de nombres> separadas por el car\u00e1cter de barra vertical (|). Si el prefijo empieza por $, se considerar\u00e1 una declaraci\u00f3n de espacio de nombres predeterminado.
NS_MAP_LABEL=Prefijo de correlaci\u00f3n de espacio de nombres
SCHEMA_URL_DESC=Establezca la ubicaci\u00f3n del esquema utilizado \u00fanicamente para visualizaci\u00f3n.
SCHEMA_URL_LABEL=Ubicaci\u00f3n del esquema XSD
OMIT_ON_REDING_DESC=La primera declaraci\u00f3n XML (si la hay) siempre se reconoce, pero cualquier otra que pueda haber se ignorar\u00e1.
OMIT_ON_REDING_LABEL=Ignorar declaraciones XML repetitivas al leer
OMIT_ON_WRITING_DESC=Cuando esta opci\u00f3n est\u00e1 seleccionada, el analizador no grabar\u00e1 ninguna declaraci\u00f3n XML en la salida. Resulta \u00fatil cuando tenemos contenidos XML (que ya contienen una declaraci\u00f3n XML) y queremos a\u00f1adir algunos datos a los mismos.
OMIT_ON_WRITING_LABEL=Omitir declaraci\u00f3n XML al grabar.
CHARSET_DESC=Codificaci\u00f3n de caracteres a utilizar al leer o al grabar.
CHARSET_LABEL=Codificaci\u00f3n de caracteres
COALESCING_DESC=Si est\u00e1 a true, el analizador fusionar\u00e1 secciones de datos de caracteres adyacentes.
COALESCING_LABEL=Fusi\u00f3n
STANDALONE_ROOT_DESC=Cuando esta opci\u00f3n est\u00e1 seleccionada, cada entrada que se pase al analizador XML se escribir\u00e1 dentro de las etiquetas ra\u00edz configuradas. Esto crear\u00e1 un documento con m\u00faltiples ra\u00edces si se pasa m\u00e1s de una entrada al analizador durante la ejecuci\u00f3n de la LE.
STANDALONE_ROOT_LABEL=Documento con m\u00faltiples ra\u00edces
STATIC_DECL_DESC=Utilice esta opci\u00f3n para declarar atributos y prefijos. Se grabar\u00e1n con los elementos est\u00e1ticos especificados en el par\u00e1metro xpath.expr.
STATIC_DECL_LABEL=Declaraciones de atributo est\u00e1tico
INDENT_DECL=Si se selecciona este campo, se sangrar\u00e1 la salida.
INDENT_LABEL=Indentar salida
Advanced=Avanzada
ENTRY_TAG_DESC=Es el nombre del elemento que recortar\u00e1 cada entrada en la salida. Se puede utilizar con un prefijo, que est\u00e9 definido para el contexto del elemento espec\u00edfico.
ENTRY_TAG_LABEL=C\u00f3digo de entrada
VALUE_TAG_DESC=Es el nombre del elemento que se utilizar\u00e1 para recortar cada valor de un atributo con varios valores. Si un atributo tiene un \u00fanico valor, el valor no se recortar\u00e1. Se puede utilizar con un prefijo, que ya se ha definido para el contexto del elemento espec\u00edfico.
VALUE_TAG_LABEL=C\u00f3digo de valor
INVALID_XML_CHAR_LABEL=Permitir caracteres XML no v\u00e1lidos al grabar
INVALID_XML_CHAR_DESC=Cuando se selecciona, los caracteres XML no v\u00e1lidos seg\u00fan la especificaci\u00f3n XML se incluyen en las etiquetas XML y se emite una excepci\u00f3n si se deselecciona al grabar el XML.
