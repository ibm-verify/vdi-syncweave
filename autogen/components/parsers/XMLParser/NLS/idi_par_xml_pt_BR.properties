TITLE=Analisador XML
DESC=Analisador XML
XPATH_EXPR_DESC=Define a express\u00e3o XPath simples usada para localizar entradas. Usado tamb\u00e9m para descrever a estrutura do XML ao gravar. (Valor de exemplo, /root/entry | /elm1/pref2:elm2/elm3)
XPATH_EXPR_LABEL=XPath Simples
NS_MAP_DESC=Mapeamentos entre <prefix>=<namespace> separados pelo caractere de barra vertical (|). Se o prefixo come\u00e7ar com $, ser\u00e1 considerado uma declara\u00e7\u00e3o de espa\u00e7o de nomes padr\u00e3o.
NS_MAP_LABEL=Prefixo para Mapa de Espa\u00e7o de Nomes
SCHEMA_URL_DESC=Defina o local de esquema usado para fins de exibi\u00e7\u00e3o somente.
SCHEMA_URL_LABEL=Local de Esquema XSD
OMIT_ON_REDING_DESC=A primeira declara\u00e7\u00e3o XML (se houver) ser\u00e1 sempre reconhecida, mas qualquer outra ser\u00e1 ignorada.
OMIT_ON_REDING_LABEL=Ignorar declara\u00e7\u00f5es XML repetidas ao ler
OMIT_ON_WRITING_DESC=Quando marcado, o analisador n\u00e3o gravar\u00e1 nenhuma declara\u00e7\u00e3o XML na sa\u00edda. Isso \u00e9 \u00fatil quando voc\u00ea tem alguns conte\u00fados XML (j\u00e1 contendo declara\u00e7\u00e3o XML) e deseja anexar alguns dados XML a eles.
OMIT_ON_WRITING_LABEL=Omitir declara\u00e7\u00e3o XML ao gravar.
CHARSET_DESC=Codifica\u00e7\u00e3o de caractere para uso ao gravar ou ler
CHARSET_LABEL=Codifica\u00e7\u00e3o de Caractere
COALESCING_DESC=Se verdadeiro, o analisador unir\u00e1 as se\u00e7\u00f5es de dados de caracteres adjacentes.
COALESCING_LABEL=Unindo
STANDALONE_ROOT_DESC=Quando marcado, cada entrada transmitida ao Analisador XML ser\u00e1 gravada na(s) tag(s) de raiz configurada. Isso criar\u00e1 um documento de v\u00e1rias ra\u00edzes se mais de uma entrada for transmitida ao Analisador durante a execu\u00e7\u00e3o da AL.
STANDALONE_ROOT_LABEL=Documento de v\u00e1rias ra\u00edzes
STATIC_DECL_DESC=Use para declarar atributos e prefixos. Eles ser\u00e3o gravados com elementos est\u00e1ticos especificados pelo par\u00e2metro xpath.expr.
STATIC_DECL_LABEL=Declara\u00e7\u00f5es de Atributo Est\u00e1tico
INDENT_DECL=Se esse campo estiver marcado, a sa\u00edda ser\u00e1 recuada.
INDENT_LABEL=Recuar Sa\u00edda
Advanced=Avan\u00e7ado
ENTRY_TAG_DESC=Este \u00e9 o nome do elemento que quebrar\u00e1 cada entrada na sa\u00edda. Pode ser usado com um prefixo, que j\u00e1 est\u00e1 definido para o contexto do elemento espec\u00edfico.
ENTRY_TAG_LABEL=Guia de Entrada
VALUE_TAG_DESC=Este \u00e9 o nome do elemento que ser\u00e1 usado para quebrar cada valor de um atributo de multivalores. Se um atributo tiver um valor \u00fanico, esse valor n\u00e3o ser\u00e1 quebrado. Pode ser usado com um prefixo que j\u00e1 est\u00e1 definido para o contexto do elemento espec\u00edfico.
VALUE_TAG_LABEL=Guia de Valor
INVALID_XML_CHAR_LABEL=Permitir caracteres XML inv\u00e1lidos quando gravar.
INVALID_XML_CHAR_DESC=Quando marcado, os caracteres XML inv\u00e1lidos, de acordo com a especifica\u00e7\u00e3o XML, s\u00e3o inclu\u00eddos nas tags XML e uma exce\u00e7\u00e3o ser\u00e1 emitida se eles forem desmarcados ao gravar o XML.
