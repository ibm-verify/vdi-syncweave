# Generic (Common) resource strings
######################################################
# NLS_MESSAGEFORMAT_NONE
# NLS_ENCODING=UNICODE
TITLE=Interpr\u00e9teur XML
DESC=Interpr\u00e9teur XML
XPATH_EXPR_DESC=D\u00e9finit l'expression XPath simple utilis\u00e9e pour rechercher des entr\u00e9es. Egalement utilis\u00e9 pour d\u00e9crire la structure du document XML lors de l'\u00e9criture. (Exemple de valeur, /root/entry | /elm1/pref2:elm2/elm3)
XPATH_EXPR_LABEL=XPath simple
NS_MAP_DESC=Mappages entre <prefix>=<namespace> s\u00e9par\u00e9s par une barre verticale (|). Si le pr\u00e9fixe commence par $, il est consid\u00e9r\u00e9 comme une d\u00e9claration d'espace de nom par d\u00e9faut.
NS_MAP_LABEL=Pr\u00e9fixe de la mappe d'espace de nom
SCHEMA_URL_DESC=D\u00e9finit l'emplacement de sch\u00e9ma utilis\u00e9 \u00e0 des fins d'affichage uniquement.
SCHEMA_URL_LABEL=Emplacement de sch\u00e9ma XSD
OMIT_ON_REDING_DESC=La premi\u00e8re d\u00e9claration XML (le cas \u00e9ch\u00e9ant) est toujours accept\u00e9e, mais toute autre d\u00e9claration sera refus\u00e9e.
OMIT_ON_REDING_LABEL=Ignorer la r\u00e9p\u00e9tition des d\u00e9clarations XML lors de la lecture
OMIT_ON_WRITING_DESC=Lorsque cette option est s\u00e9lectionn\u00e9e, l'interpr\u00e9teur n'\u00e9crit aucune d\u00e9claration XML sur la sortie. Cela est utile lorsqu'on souhaite ajouter certaines donn\u00e9es XML \u00e0 du contenu XML disponible (contenant d\u00e9j\u00e0 une d\u00e9claration XML).
OMIT_ON_WRITING_LABEL=Omettre la d\u00e9claration XML lors de l'\u00e9criture
CHARSET_DESC=Codage de caract\u00e8res \u00e0 utiliser lors de la lecture ou de l'\u00e9criture.
CHARSET_LABEL=Codage de caract\u00e8res
COALESCING_DESC=Si cette option est d\u00e9finie sur TRUE, l'interpr\u00e9teur combine des sections de donn\u00e9es de caract\u00e8res adjacentes.
COALESCING_LABEL=Coalescence
STANDALONE_ROOT_DESC=Lorsque cette option est s\u00e9lectionn\u00e9e, chaque entr\u00e9e transmise \u00e0 l'interpr\u00e9teur XML est \u00e9crite \u00e0 l'int\u00e9rieur de la (des) cible(s) racine configur\u00e9e(s). Un document multiracine est alors cr\u00e9\u00e9 si plusieurs entr\u00e9es sont transmises \u00e0 l'interpr\u00e9teur lors de l'ex\u00e9cution AL.
STANDALONE_ROOT_LABEL=Document multiracine
STATIC_DECL_DESC=Cette option permet de d\u00e9clarer des attributs et des pr\u00e9fixes. Ceux-ci seront \u00e9crits avec les \u00e9l\u00e9ments statiques indiqu\u00e9s par le param\u00e8tre xpath.expr.
STATIC_DECL_LABEL=D\u00e9clarations d'attributs statiques
INDENT_DECL=Si cette option est s\u00e9lectionn\u00e9e, la sortie est mise en retrait.
INDENT_LABEL=Mettre la sortie en retrait
Advanced=Avanc\u00e9
ENTRY_TAG_DESC=Nom de l'\u00e9l\u00e9ment qui ins\u00e9rera chaque entr\u00e9e lors de la sortie. Utilisation possible d'un pr\u00e9fixe, d\u00e9j\u00e0 d\u00e9fini pour le contexte sp\u00e9cifique de l'\u00e9l\u00e9ment.
ENTRY_TAG_LABEL=Balise d'entr\u00e9e
VALUE_TAG_DESC=Nom de l'\u00e9l\u00e9ment qui permettra d'ins\u00e9rer chaque valeur d'un attribut \u00e0 valeurs multiples. Si l'attribut ne poss\u00e8de qu'une seule valeur, celle-ci ne sera pas ins\u00e9r\u00e9e. Utilisation possible d'un pr\u00e9fixe, d\u00e9j\u00e0 d\u00e9fini pour le contexte sp\u00e9cifique de l'\u00e9l\u00e9ment.
VALUE_TAG_LABEL=Balise de valeur
INVALID_XML_CHAR_LABEL=Autoriser les caract\u00e8res XML non valides lors de l'\u00e9criture
INVALID_XML_CHAR_DESC=Lorsque cette case est coch\u00e9e, les caract\u00e8res XML non valides, conform\u00e9ment \u00e0 la sp\u00e9cification XML, sont inclus dans les balises XML ; lorsque cette case est d\u00e9coch\u00e9e, une exception est \u00e9mise lors de l'\u00e9criture du code XML.
