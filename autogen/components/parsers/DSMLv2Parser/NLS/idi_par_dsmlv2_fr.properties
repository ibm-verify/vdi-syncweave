PAR_DESC=Interpr\u00e9teur DSMLv2
BA_LBL=Attributs binaires
BA_DESC=Attributs binaires d\u00e9finis par l'utilisateur, d\u00e9limit\u00e9s par des ",".\nCes attributs seront d\u00e9cod\u00e9s en base 64 lors de l'analyse des messages DSML.
MODE_LBL=Mode
MODE_DESC=Sp\u00e9cifier le mode Serveur ou Client. En mode Serveur, les demandes sont lues et les r\u00e9ponses sont \u00e9crites.\nEn mode Client, les demandes sont \u00e9crites et les r\u00e9ponses sont lues.
ONERR_LBL=En cas d'erreur
ONERR_DESC=D\u00e9finit la valeur de l'attribut DSML "onError" pour les demandes de traitement par lots.
PROC_LBL=Traitement
PROC_DESC=D\u00e9finit la valeur de l'attribut DSML "processing" pour les demandes de traitement par lots.
RESPORD_LBL=Ordre de r\u00e9ponse
RESPORD_DESC=D\u00e9finit la valeur de l'attribut DSML "responseOrder" pour les demandes de traitement par lots.
INDOUT_LBL=Indenter la sortie
INDOUT_DESC=Indente le document XML en sortie
OMITXML_LBL=Omettre la d\u00e9claration XML
OMITXML_DESC=Omettre l'en-t\u00eate de d\u00e9claration XML dans le flot de sortie
SOAP_LBL=Liaison SOAP
SOAP_DESC=Ce param\u00e8tre active la compatibilit\u00e9 de l'interpr\u00e9teur avec le protocole SOAP. \nLorsque la liaison SOAP est activ\u00e9e, l'interpr\u00e9teur traite le document XML comme un message SOAP. \nDans le cas contraire, le fichier XML est trait\u00e9 comme un message DSML ordinaire.
