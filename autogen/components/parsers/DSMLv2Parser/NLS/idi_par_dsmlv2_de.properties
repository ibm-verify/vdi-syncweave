PAR_DESC=DSMLv2-Parser
BA_LBL=Bin\u00e4re Attribute
BA_DESC=Benutzerdefinierte bin\u00e4re Attribute, durch "," begrenzt.\nDiese Attribute werden bei der Syntaxanalyse von DSML-Nachrichten mit Base64 decodiert.
MODE_LBL=Modus
MODE_DESC=Server- oder Clientmodus angeben. Im Servermodus werden Anforderungen gelesen und Antworten geschrieben.\nIm Clientmodus werden Anforderungen geschrieben und Antworten gelesen.
ONERR_LBL=Bei Fehler
ONERR_DESC=Legt den Wert des DSML-Attributs "onError" (bei Fehler) f\u00fcr Stapelanforderungen fest.
PROC_LBL=Verarbeitung
PROC_DESC=Legt den Wert des DSML-Attributs "processing" (Verarbeitung) f\u00fcr Stapelanforderungen fest.
RESPORD_LBL=Antwortreihenfolge
RESPORD_DESC=Legt den Wert des DSML-Attributs "responseOrder" (Antwortreihenfolge) f\u00fcr Stapelanforderungen fest.
INDOUT_LBL=Ausgabe einr\u00fccken
INDOUT_DESC=R\u00fcckt XML bei der Ausgabe ein
OMITXML_LBL=XML-Deklaration \u00fcbergehen
OMITXML_DESC=Wenn diese Option aktiviert ist, wird der XML-Deklarationsheader im Ausgabedatenstrom \u00fcbergangen.
SOAP_LBL=SOAP-Bindung
SOAP_DESC=Dieser Parameter aktiviert die Parserkompatibilit\u00e4t mit dem SOAP-Protokoll. \nWenn die SOAP-Bindung aktiviert wird, verarbeitet der Parser XML wie eine SOAP-Nachricht. \nWenn die SOAP-Bindung inaktiviert wird, wird XML wie eine normale DSML-Nachricht verarbeitet.
