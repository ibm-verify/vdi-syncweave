SOAP_LBL=V\u00ednculo SOAP
SOAP_DESC=Este par\u00e1metro habilita la compatibilidad del analizador con el protocolo SOAP. \nCuando se activa el v\u00ednculo SOAP, el analizador procesa el XML como un mensaje SOAP. \nCuando se desactiva el v\u00ednculo SOAP, el XML se procesa como un mensaje DSML habitual.
