BA_DESC=Atributos binarios definidos por el usuario delimitados por ",".\nEstos atributos se decodificar\u00e1n en Base64 al analizar mensajes DSML.
MODE_LBL=Modalidad
MODE_DESC=Especifique la modalidad de servidor o de cliente. En la modalidad de servidor, las solicitudes se leen y las respuestas se escriben.\nEn la modalidad de cliente, las solicitudes se escriben y las respuestas se leen.
