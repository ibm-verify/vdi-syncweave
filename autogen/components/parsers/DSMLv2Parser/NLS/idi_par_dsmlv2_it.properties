PAR_DESC=Parser DSMLv2
BA_LBL=Attributi binari
BA_DESC=Attributi definiti dall'utente delimitati da ",".\nTali attributi verranno decodificati in Base64, quando si analizzano messaggi DSML.
MODE_LBL=Modalit\u00e0
MODE_DESC=Specificare la modalit\u00e0 server o client. Nella modalit\u00e0 server le richieste vengono lette e le risposte vengono scritte.\nNella modalit\u00e0 client le richieste vengono scritte e le risposte vengono lette.
ONERR_LBL=Errore
ONERR_DESC=Imposta il valore dell'attributo DSML "onError" per le richieste batch.
PROC_LBL=Elaborazione
PROC_DESC=Imposta il valore dell'attributo DSML "processing" per le richieste batch.
RESPORD_LBL=Ordine risposta
RESPORD_DESC=Imposta il valore dell'attributo DSML "responseOrder" per le richieste batch.
INDOUT_LBL=Esegui rientro output
INDOUT_DESC=Rientra XML sull'output
OMITXML_LBL=Ometti dichiarazione XML
OMITXML_DESC=Omettere l'intestazione della dichiarazione XML nel flusso di output
SOAP_LBL=Associazione Soap
SOAP_DESC=Questo parametro abilita la compatibilit\u00e0 del parser con il protocollo SOAP. \nQuando "soapbinding" \u00e8 attivato - il parser elabora XML come un messaggio SOAP. \nQuando "soapbinding" \u00e8 disattivato, XML verr\u00e0 elaborato come un messaggio DSML ordinario.
