FC_DESC = El componente de funci\u00F3n de la l\u00EDnea de mandatos remota conecta con una m\u00E1quina de destino remota y ejecuta un mandato.
FC_TITLE = Componente de funci\u00F3n de l\u00EDnea de mandatos remota
HOST_LBL = Nombre del sistema principal de destino
HOST_DESC = Nombre del sistema principal de la m\u00E1quina de destino remota
USER_LBL = Usuario remoto
USER_DESC = ID de usuario de inicio de sesi\u00F3n de destino
PASSWD_LBL = Contrase\u00F1a
PASSWD_DESC = Contrase\u00F1a de usuario de destino
KS_LBL = V\u00EDa de acceso de archivo de claves
KS_DESC = V\u00EDa de acceso al archivo de claves privadas OpenSSH
PHRASE_LBL = Expresi\u00F3n de paso
PHRASE_DESC = Expresi\u00F3n de paso que protege la clave privada
CONNECT_LBL = Protocolo de conexi\u00F3n
CONNECT_DESC = Permite al usuario seleccionar el protocolo que se debe utilizar al conectar con la m\u00E1quina remota.
Localized.CONNECT_OPT1 = Cualquiera
Localized.CONNECT_OPT2 = SSH
Localized.CONNECT_OPT3 = rsh
Localized.CONNECT_OPT4 = rexec
Localized.CONNECT_OPT5 = AS400
Localized.CONNECT_OPT6 = WIN
CMD_LBL = Mandato
CMD_DESC = Mandato que se debe ejecutar en el destino
PORT_LBL = Puerto
PORT_DESC = Puerto que se debe utilizar al conectar con el destino
SRC_LBL = Archivo de origen Stdin (local)
SRC_DESC = V\u00EDa de acceso al archivo local que contiene la entrada est\u00E1ndar para el mandato
DEST_LBL = Directorio de destino de Stdin (remoto)
DEST_DESC = V\u00EDa de acceso al archivo remoto donde debe almacenarse la entrada est\u00E1ndar
TIME_LBL = Tiempo de espera de ejecuci\u00F3n (ms)
TIME_DESC = Duraci\u00F3n del tiempo de espera para la ejecuci\u00F3n del mandato
AS400SSL_LBL = \u00BFHabilitar SSL para AS400?
AS400SSL_DESC = Si se selecciona, se intentar\u00E1 una conexi\u00F3n SSL hacia el destino AS400 (SSL debe estar instalado y configurado en el destino AS400)
AS400PROX_LBL = Nombre del servidor proxy AS400
AS400PROX_DESC = Si es necesario, el nombre de host o direcci\u00F3n IP de un servidor proxy AS400
AS400RPROG_LBL = \u00BFEjecutar programa AS400?
AS400RPROG_DESC = Mecanismo secundario para ejecutar programas AS400
AS400ARGENC_LBL = Codificaci\u00F3n de caracteres de argumentos de l\u00EDnea de mandatos AS400
AS400ARGENC_DESC = Codificaci\u00F3n de caracteres que se utilizar\u00E1 con los argumentos de l\u00EDnea de mandatos AS400. Si no se especifica, se utilizar\u00E1 a codificaci\u00F3n de caracteres predeterminada jvm.
RXALOG_LBL = \u00BFHabilitar registro interno RXA?
RXALOG_DESC = Si se selecciona, el registro interno de RXA se dirigir\u00E1 al registro de Security Verify Directory Integrator.
Advanced = Avanzada
HANDLE_AS_TEXT_FILE_DESC = Si se selecciona, el archivo de origen Stdin se convertir\u00E1 al juego de caracteres del sistema de destino; de lo contrario, se mantendr\u00E1 la codificaci\u00F3n actual del archivo.
HANDLE_AS_TEXT_FILE_LBL = Convertir archivo de origen Stdin al juego de caracteres del sistema de destino
CONN_TIME_DESC = Duraci\u00F3n del tiempo de espera de la conexi\u00F3n inicial al sistema de destino.
CONN_TIME_LBL = Tiempo de espera de la conexi\u00F3n inicial (ms)
