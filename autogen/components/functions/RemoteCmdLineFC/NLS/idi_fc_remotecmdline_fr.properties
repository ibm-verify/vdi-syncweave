AS400ARGENC_DESC = Codage de caract\u00E8res \u00E0 utiliser pour les arguments de ligne de commande AS400. Si ce codage n'est pas sp\u00E9cifi\u00E9, le codage de caract\u00E8res par d\u00E9faut de JVM est utilis\u00E9.
RXALOG_LBL = Activer la consignation interne RXA ?
RXALOG_DESC = Si cette case est coch\u00E9e, la journalisation interne RXA sera dirig\u00E9e vers le journal Security Verify Directory Integrator.
Advanced = Avanc\u00E9
HANDLE_AS_TEXT_FILE_DESC = Si cette case est coch\u00E9e, le fichier source Stdin sera converti dans le jeu de caract\u00E8res du syst\u00E8me cible ; sinon, le codage actuel du fichier sera maintenu.
