AS400SSL_LBL = Activer SSL for AS400 ?
AS400SSL_DESC = Si cette case est coch\u00E9e, le programme tente d'\u00E9tablir une connexion SSL \u00E0 la cible AS400. SSL doit \u00EAtre configur\u00E9 sur cette cible.
AS400PROX_LBL = Nom du serveur proxy AS400
AS400PROX_DESC = Le cas \u00E9ch\u00E9ant, nom d'h\u00F4te ou adresse IP d'un serveur proxy AS400
