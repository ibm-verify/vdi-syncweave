FC_DESC = Le composant de ligne de commande distante se connecte \u00E0 une machine cible distante et ex\u00E9cute une commande.
FC_TITLE = Composant de ligne de commande distante
HOST_LBL = Nom d'h\u00F4te de la machine cible
HOST_DESC = Nom d'h\u00F4te de la machine cible distante
USER_LBL = Utilisateur distant
USER_DESC = ID utilisateur indiqu\u00E9 pour la connexion cible
PASSWD_LBL = Mot de passe
PASSWD_DESC = Mot de passe utilisateur cible
KS_LBL = Chemin du fichier de cl\u00E9s
KS_DESC = Chemin d'acc\u00E8s au fichier de cl\u00E9s priv\u00E9es OpenSSH
PHRASE_LBL = Mot de passe compos\u00E9
PHRASE_DESC = Mot de passe compos\u00E9 qui prot\u00E8ge la cl\u00E9 priv\u00E9e
CONNECT_LBL = Protocole de connexion
CONNECT_DESC = Permet \u00E0 l'utilisateur de s\u00E9lectionner le protocole \u00E0 mettre en oeuvre pour se connecter \u00E0 la machine distante
Localized.CONNECT_OPT1 = TOUT
Localized.CONNECT_OPT2 = Secure Shell
Localized.CONNECT_OPT3 = rsh
Localized.CONNECT_OPT4 = rexec
Localized.CONNECT_OPT5 = AS400
Localized.CONNECT_OPT6 = win
CMD_LBL = Commande
CMD_DESC = Commande \u00E0 ex\u00E9cuter sur le syst\u00E8me cible
PORT_LBL = Port\u00A0
PORT_DESC = Port \u00E0 utiliser pour la connexion au syst\u00E8me cible
SRC_LBL = Fichier source Stdin (local)
