FC_DESC = Die Funktionskomponente f\u00FCr die ferne Befehlszeile stellt eine Verbindung zu einer fernen Zielmaschine her und f\u00FChrt einen Befehl aus.
FC_TITLE = Funktionskomponente f\u00FCr die ferne Befehlszeile
HOST_LBL = Hostname der Zielmaschine
HOST_DESC = Hostname der fernen Zielmaschine
USER_LBL = Ferner Benutzer
USER_DESC = Anmelde-ID des Zielbenutzers
PASSWD_LBL = Kennwort
PASSWD_DESC = Kennwort des Zielbenutzers
KS_LBL = Schl\u00FCsseldateipfad
KS_DESC = Pfad zu der Datei mit dem privaten OpenSSH-Schl\u00FCssel
PHRASE_LBL = Kennphrase
PHRASE_DESC = Kennphrase, die den privaten Schl\u00FCssel sch\u00FCtzt
CONNECT_LBL = Verbindungsprotokoll
CONNECT_DESC = Erm\u00F6glicht es dem Benutzer, das Protokoll auszuw\u00E4hlen, das beim Herstellen der Verbindung zur fernen Maschine verwendet werden soll.
Localized.CONNECT_OPT1 = ALLE
Localized.CONNECT_OPT2 = Secure Shell (SSH)
Localized.CONNECT_OPT3 = rsh
Localized.CONNECT_OPT4 = rexec
Localized.CONNECT_OPT5 = AS400
Localized.CONNECT_OPT6 = WIN
CMD_LBL = Befehl
CMD_DESC = F\u00FCr das Ziel auszuf\u00FChrender Befehl
PORT_LBL = Portierung
PORT_DESC = F\u00FCr die Herstellung der Verbindung zum Ziel zu verwendender Port
SRC_LBL = Quellendatei f\u00FCr die Standardeingabe (lokal)
SRC_DESC = Pfad der lokalen Datei, die die Standardeingabe f\u00FCr den Befehl enth\u00E4lt
DEST_LBL = Zielverzeichnis f\u00FCr die Standardeingabe (fern)
DEST_DESC = Pfad der fernen Datei, in der die Standardeingabe gespeichert werden soll
TIME_LBL = Ausf\u00FChrungszeitlimit (ms)
TIME_DESC = Dauer des Zeitlimits f\u00FCr die Befehlsausf\u00FChrung
AS400SSL_LBL = SSL f\u00FCr AS400 aktivieren?
AS400SSL_DESC = Bei Auswahl dieser Option wird versucht, eine SSL-Verbindung zum AS400-Ziel herzustellen (SSL muss auf dem AS400-Ziel installiert und konfiguriert sein)
AS400PROX_LBL = Name des AS400-Proxy-Servers
AS400PROX_DESC = Hostname oder IP-Adresse des AS400-Proxy-Servers, falls erforderlich
AS400RPROG_LBL = AS400-Programm ausf\u00FChren?
AS400RPROG_DESC = Sekund\u00E4rer Mechanismus f\u00FCr die Ausf\u00FChrung von AS400-Programmen
AS400ARGENC_LBL = Zeichencodierung f\u00FCr AS400-Befehlszeilenparameter
AS400ARGENC_DESC = Die f\u00FCr AS400-Befehlszeilenparameter zu verwendende Zeichencodierung. Die Standardzeichencodierung von jvm wird verwendet, wenn keine Angabe gemacht wird.
RXALOG_LBL = Interne RXA-Protokollierung aktivieren?
RXALOG_DESC = Wenn diese Option ausgew\u00E4hlt ist, wird die interne RXA-Protokollierung an das Security Verify Directory Integrator-Protokoll weitergeleitet.
Advanced = Erweitert
HANDLE_AS_TEXT_FILE_DESC = Bei Auswahl dieser Option wird die Quellendatei f\u00FCr die Standardeingabe in den Zeichensatz des Zielsystems konvertiert. Andernfalls bleibt die aktuelle Codierung der Datei erhalten.
HANDLE_AS_TEXT_FILE_LBL = Quellendatei f\u00FCr Standardeingabe in Zeichensatz des Zielsystems konvertieren
CONN_TIME_DESC = Gibt die Dauer des Zeitlimits f\u00FCr die Anfangsverbindung zum Zielsystem an.
CONN_TIME_LBL = Zeitlimit f\u00FCr Anfangsverbindung (ms)
