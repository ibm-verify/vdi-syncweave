FC_DESC = O Componente da Fun\u00E7\u00E3o da Linha de Comandos Remota se conecta a uma m\u00E1quina de destino remoto e executa um comando.
FC_TITLE = Componente da Fun\u00E7\u00E3o da Linha de Comandos Remota
HOST_LBL = Nome do Host da M\u00E1quina de Destino
HOST_DESC = Nome do host da m\u00E1quina de destino remota
USER_LBL = Usu\u00E1rio Remoto
USER_DESC = ID do usu\u00E1rio de login de destino
PASSWD_LBL = Senha
PASSWD_DESC = Senha do Usu\u00E1rio de Destino
KS_LBL = Caminho do Arquivo-Chave
KS_DESC = Caminho para o arquivo chave OpenSSH Privado
PHRASE_LBL = Passphrase
PHRASE_DESC = Passphrase que proteger a chave privada
CONNECT_LBL = Protocolo de Conex\u00E3o
CONNECT_DESC = Permite que o usu\u00E1rio selecione o protocolo a ser utilizado ao se conectar \u00E0 m\u00E1quina remota
Localized.CONNECT_OPT1 = NENHUM
Localized.CONNECT_OPT2 = SSH
Localized.CONNECT_OPT3 = RSH
Localized.CONNECT_OPT4 = rexec
Localized.CONNECT_OPT5 = AS400
Localized.CONNECT_OPT6 = WIN
CMD_LBL = Comando
CMD_DESC = O comando a ser executado no destino
PORT_LBL = Porta
PORT_DESC = A porta a ser utilizada ao se conectar ao destino
SRC_LBL = Arquivo de origem Stdin (local)
SRC_DESC = O caminho ao arquivo local que cont\u00E9m a entrada padr\u00E3o para o comando
DEST_LBL = Diret\u00F3rio de destino Stdin (remoto)
