AS400SSL_LBL = Ativar SSL para AS400 ?
AS400SSL_DESC = Se marcado, ser\u00E1 feita uma tentativa de conex\u00E3o SSL com o destino AS400 (o SSL deve ser instalado e configurado no destino AS400)
AS400PROX_LBL = Nome do Servidor Proxy AS400
AS400PROX_DESC = Se necess\u00E1rio, o nome do host ou endere\u00E7o IP de um servidor proxy AS400
AS400RPROG_LBL = Executar o Programa AS400 ?
AS400RPROG_DESC = Mecanismo secund\u00E1rio para executar Programas AS400
AS400ARGENC_LBL = Codifica\u00E7\u00E3o de Caracteres de Argumentos da Linha de Comandos do AS400
AS400ARGENC_DESC = A codifica\u00E7\u00E3o de caracteres para uso em argumentos da linha de comandos do AS400. A codifica\u00E7\u00E3o de caracteres padr\u00E3o da jvm ser\u00E1 utilizada se n\u00E3o for especificada.
RXALOG_LBL = Ativar Cria\u00E7\u00E3o de Logs Internos do RXA ?
RXALOG_DESC = Se marcada, a cria\u00E7\u00E3o de log interna do RXA ser\u00E1 direcionada para o Log do Security Verify Directory Integrator.
Advanced = Avan\u00E7ado
HANDLE_AS_TEXT_FILE_DESC = Se estiver marcado, o arquivo de origem Stdin ser\u00E1 convertido para o conjunto de caracteres do sistema de destino; do contr\u00E1rio, a codifica\u00E7\u00E3o atual do arquivo ser\u00E1 mantida.
HANDLE_AS_TEXT_FILE_LBL = Converter o arquivo de origem Stdin para o conjunto de caracteres do sistema de destino
CONN_TIME_DESC = A dura\u00E7\u00E3o do tempo limite para a conex\u00E3o inicial no sistema de destino.
CONN_TIME_LBL = Tempo limite de conex\u00E3o inicial (ms)
