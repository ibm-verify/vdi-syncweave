FC_DESC = Il componente della funzione della riga comandi remoto si connette ad una macchina di destinazione remota ed esegue un comando.
FC_TITLE = Componente funzione della riga comandi remoto
HOST_LBL = Nome host macchina di destinazione
HOST_DESC = Nome host della macchina di destinazione remota
USER_LBL = Utente remoto
USER_DESC = ID utente accesso di destinazione
PASSWD_LBL = Password
PASSWD_DESC = Password utente di destinazione
KS_LBL = Percorso file chiave
KS_DESC = Percorso del file chiave privata OpenSSH
PHRASE_LBL = Frase password
PHRASE_DESC = Frase che protegge la chiave privata
CONNECT_LBL = Protocollo di connessione
CONNECT_DESC = Consente all'utente di scegliere il protocollo da utilizzare quando ci si connette alla macchina remota
Localized.CONNECT_OPT1 = QUALSIASI
Localized.CONNECT_OPT2 = SSH
Localized.CONNECT_OPT3 = RSH
Localized.CONNECT_OPT4 = REXEC
Localized.CONNECT_OPT5 = AS400
Localized.CONNECT_OPT6 = WIN
CMD_LBL = Comando
CMD_DESC = Il comando da eseguire sulla destinazione
PORT_LBL = Porta
PORT_DESC = Porta da utilizzare quando ci si connette alla destinazione
SRC_LBL = File sorgente stdin (locale)
SRC_DESC = Il percorso al file locale contenente l'input standard per il comando
DEST_LBL = Directory di destinazione stdin (remota)
DEST_DESC = Il percorso al file remoto dove memorizzare l'input standard
TIME_LBL = Timeout di esecuzione (ms)
TIME_DESC = Durata timeout per l'esecuzione del comando
AS400SSL_LBL = Abilitare SSL per AS400?
AS400SSL_DESC = Se questa opzione \u00E8 selezionata, si tenter\u00E0 una connessione SSL alla destinazione AS400 (SSL deve essere installato e configurazione sulla destinazione AS400)
AS400PROX_LBL = Nome server proxy AS400
AS400PROX_DESC = Se richiesto, il nome host o l'indirizzo IP di un server proxy AS400
AS400RPROG_LBL = Eseguire programma AS400?
AS400RPROG_DESC = Meccanismo secondario per l'esecuzione di programmi AS400
AS400ARGENC_LBL = Codifica caratteri argomenti riga comandi AS400
AS400ARGENC_DESC = La codifica caratteri da utilizzare per gli argomenti della riga comandi AS400. Se non viene specificato un valore, viene utilizzata la codifica caratteri predefinita di jvm.
RXALOG_LBL = Abilitare la registrazione interna RXA?
RXALOG_DESC = Se selezionato, la registrazione interna RXA verr\u00E0 indirizzata al log di Security Verify Directory Integrator.
Advanced = Avanzate
HANDLE_AS_TEXT_FILE_DESC = Se l'opzione \u00E8 selezionata, il file di origine Stdin viene convertito nella serie di caratteri del sistema di destinazione; in caso contrario, viene conservata la codifica corrente del file.
HANDLE_AS_TEXT_FILE_LBL = Converti file di origine Stdin nella serie di caratteri del sistema di destinazione
CONN_TIME_DESC = Durata del timeout per la connessione iniziale al sistema di destinazione.
CONN_TIME_LBL = Timeout connessione iniziale (ms)
