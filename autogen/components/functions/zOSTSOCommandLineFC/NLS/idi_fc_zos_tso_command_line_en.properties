FC_TITLE = z/OS TSO/E Command Line Function Component
FUNCTION_DESC = This Function Component addresses the need to be able to issue privileged z/OS commands, including RACF, ACF2 and TopSecret commands
WU_LBL = Partner TP Name
WU_DESC = The Partner TP Name as specified in the APPC TP Profile
DLU_LBL = Destination LU Name
DLU_DESC = Destination LU name as specified in the APPC configuration file
SLU_LBL = Source LU Name
SLU_DESC = Source LU name as specified in the APPC configuration file
MOD_LBL = APPC mode
MOD_DESC = Specifies the mode of the APPC conversation
UID_LBL = User Name
UID_DESC = The user under whose identity the conversation will be held
UPW_LBL = User Password
UPW_DESC = The password of the user under whose identity the conversation will be held
