OPEN_IDML_FC_TITLE=Componente funzione Apri IdML
FUNCTION_DESC=Il componente funzione Apri IdML apre un book IdML, come file oppure come frammento in memoria. Ci\u00f2 consente agli altri componenti IdML nella suite di utilizzarlo.
OPEN_IDML_FC_STOREIDML_DESC=Determina il meccanismo di archiviazione per il book aperto da questo componente funzione.
OPEN_IDML_FC_STOREIDML_LABEL=Archivio IdML
OPEN_IDML_FC_ASFILE=Come file
OPEN_IDML_FC_INMEMORY=In memoria
OPEN_IDML_FC_DIR_DESC=Il nome della directory in cui verr\u00e0 memorizzato il book IdML. Importante solo se il book verr\u00e0 memorizzato come file.
OPEN_IDML_FC_DIR_LABEL=Nome directory
OPEN_IDML_FC_BOOK_DESC=Il nome del book IdML che verr\u00e0 aperto da questo componente. Se lasciato vuoto, verr\u00e0 aperto il book IdML predefinito.
OPEN_IDML_FC_BOOK_LABEL=Nome book
OPEN_IDML_FC_REFRESH_DESC=Determina se si tratta di un IdML delta o di aggiornamento.
OPEN_IDML_FC_REFRESH_LABEL=Aggiorna
OPEN_IDML_FC_VALIDATE_DESC=Abilita l'utilizzo di uno strumento di convalida per l'output IdML generato.
OPEN_IDML_FC_VALIDATE_LABEL=Convalida
OPEN_IDML_FC_APPLCODE_DESC=Il codice applicazione di MSS registrato all'inizio di IdML. Pu\u00f2 essere anche fornito nella Mappa di output del componente (in questo caso, questo valore sar\u00e0 sostituito).
OPEN_IDML_FC_APPLCODE_LABEL=Codice applicazione
OPEN_IDML_FC_HOSTNAME_DESC=Il nome host di MSS registrato all'inizio di IdML. Pu\u00f2 essere anche fornito nella Mappa di output del componente (in questo caso, questo valore sar\u00e0 sostituito).
OPEN_IDML_FC_HOSTNAME_LABEL=Nome host
OPEN_IDML_FC_CDM_DESC=La versione CDM (Common Data Model) utilizzata da IdML. Il formato \u00e8 <versione>.<release>.<modificatore>.
OPEN_IDML_FC_CDM_LABEL=Versione CDM
OPEN_IDML_FC_QUERYDB_SCRIPT_LABEL=Verifica connessione
OPEN_IDML_FC_QUERYDB_SCRIPT_HELP=Verifica se \u00e8 possibile accedere al registro IT utilizzando i parametri forniti.
OPEN_IDML_FC_USEITREGISTRYCDM_DESC=Determina se il componente funzione si basa su un registro IT per i metadati CDM.
OPEN_IDML_FC_USEITREGISTRYCDM_LABEL=Utilizza registro IT per CDM
OPEN_IDML_FC_JDBCURL_DESC=URL JDBC utilizzato per la connessione al registro IT.
OPEN_IDML_FC_JDBCURL_LABEL=URL JDBC
OPEN_IDML_FC_JDBCDRIVER_DESC=Driver del database utilizzato per la connessione al registro IT. 
OPEN_IDML_FC_JDBCDRIVER_LABEL=Driver JDBC
OPEN_IDML_FC_DBUSERNAME_DESC=Nome utente utilizzato durante la connessione al registro IT.
OPEN_IDML_FC_DBUSERNAME_LABEL=Nome utente
OPEN_IDML_FC_DBPASSWORD_DESC=Password utilizzata durante la connessione al registro IT.
OPEN_IDML_FC_DBPASSWORD_LABEL=Password
OPEN_IDML_FC_CHECKCDM_SCRIPT_LABEL=Ottieni versione CDM 
OPEN_IDML_FC_CHECKCDM_SCRIPT_DESC=Controlla la versione di CDM fornita dal registro IT o come file JAR
Advanced=Avanzate
