OPEN_IDML_FC_TITLE=Composant de fonction Ouverture IdML
FUNCTION_DESC=Le composant de fonction Ouverture IdML ouvre un livre IdML, soit en tant que fichier, soit en tant que fragment en m\u00e9moire. Cette action permet aux autres composants IdML de la suite de l'utiliser.
OPEN_IDML_FC_STOREIDML_DESC=D\u00e9termine le m\u00e9canisme de stockage pour le livre ouvert par ce composant de fonction.
OPEN_IDML_FC_STOREIDML_LABEL=Stocker IdML
OPEN_IDML_FC_ASFILE=En tant que fichier
OPEN_IDML_FC_INMEMORY=En m\u00e9moire
OPEN_IDML_FC_DIR_DESC=Nom du r\u00e9pertoire o\u00f9 le livre IdML sera stock\u00e9. Pertinent uniquement si le livre sera stock\u00e9 en tant que fichier.
OPEN_IDML_FC_DIR_LABEL=Nom du r\u00e9pertoire
OPEN_IDML_FC_BOOK_DESC=Nom du livre IdML que ce composant ouvrira. Si la zone n'est pas remplie, le livre IdML par d\u00e9faut sera ouvert.
OPEN_IDML_FC_BOOK_LABEL=Nom du livre
OPEN_IDML_FC_REFRESH_DESC=D\u00e9termine s'il s'agira d'une r\u00e9g\u00e9n\u00e9ration ou d'un IdML delta.
OPEN_IDML_FC_REFRESH_LABEL=R\u00e9g\u00e9n\u00e9rer
OPEN_IDML_FC_VALIDATE_DESC=Active l'utilisation d'un outil de validation pour la sortie IdML g\u00e9n\u00e9r\u00e9e.
OPEN_IDML_FC_VALIDATE_LABEL=Valider
OPEN_IDML_FC_APPLCODE_DESC=Code d'application du MSS enregistr\u00e9 au d\u00e9but de l'IdML. Il peut \u00e9galement \u00eatre fourni dans la mappe de sortie du composant (dans ce cas, cette valeur sera remplac\u00e9e).
OPEN_IDML_FC_APPLCODE_LABEL=Code d'application
OPEN_IDML_FC_HOSTNAME_DESC=Nom d'h\u00f4te du MSS enregistr\u00e9 au d\u00e9but de l'IdML. Il peut \u00e9galement \u00eatre fourni dans la mappe de sortie du composant (dans ce cas, cette valeur sera remplac\u00e9e).
OPEN_IDML_FC_HOSTNAME_LABEL=Nom h\u00f4te
OPEN_IDML_FC_CDM_DESC=Version de Common Data Model utilis\u00e9e par l'IdML. Son format est <version>.<\u00e9dition>.<modificateur>.
OPEN_IDML_FC_CDM_LABEL=Version de CDM
OPEN_IDML_FC_QUERYDB_SCRIPT_LABEL=Tester la connexion
OPEN_IDML_FC_QUERYDB_SCRIPT_HELP=Tester si IT Registry est accessible avec les param\u00e8tres fournis.
OPEN_IDML_FC_USEITREGISTRYCDM_DESC=D\u00e9termine si le composant de fonction se basera sur IT Registry pour les m\u00e9tadonn\u00e9es CDM.
OPEN_IDML_FC_USEITREGISTRYCDM_LABEL=Utiliser IT Registry pour CDM
OPEN_IDML_FC_JDBCURL_DESC=Adresse URL JDBC utilis\u00e9e pour la connexion \u00e0 IT Registry.
OPEN_IDML_FC_JDBCURL_LABEL=Adresse URL JDBC
OPEN_IDML_FC_JDBCDRIVER_DESC=Pilote de base de donn\u00e9es utilis\u00e9 pour la connexion \u00e0 IT Registry. 
