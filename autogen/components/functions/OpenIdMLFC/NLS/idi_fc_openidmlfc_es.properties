OPEN_IDML_FC_TITLE=Componente de funci\u00f3n Abrir IdML
FUNCTION_DESC=El componente de funci\u00f3n Abrir IdML abre un libro IdML, como archivo o como fragmento de c\u00f3digo en memoria. Esto permite que otros componentes IdML de la suite puedan utilizarlo.
OPEN_IDML_FC_STOREIDML_DESC=Determina el mecanismo de almacenamiento del libro que este componente de funci\u00f3n abre.
OPEN_IDML_FC_STOREIDML_LABEL=Almacenar IdML
OPEN_IDML_FC_ASFILE=Como archivo
OPEN_IDML_FC_INMEMORY=En memoria
OPEN_IDML_FC_DIR_DESC=Nombre del directorio donde se almacenar\u00e1 el libro IdML. S\u00f3lo es importante si el libro se almacena como archivo.
OPEN_IDML_FC_DIR_LABEL=Nombre de directorio
OPEN_IDML_FC_BOOK_DESC=Nombre del libro IdML que abrir\u00e1 este componente. Si se deja en blanco, se abrir\u00e1 el libro IdML predeterminado.
OPEN_IDML_FC_BOOK_LABEL=Nombre de libro
OPEN_IDML_FC_REFRESH_DESC=Determina si el libro IdML es un IdML renovado o delta.
OPEN_IDML_FC_REFRESH_LABEL=Renovar
OPEN_IDML_FC_VALIDATE_DESC=Permite el uso de una herramienta de validaci\u00f3n para la salida de IdML generada.
OPEN_IDML_FC_VALIDATE_LABEL=Validar
OPEN_IDML_FC_APPLCODE_DESC=C\u00f3digo de aplicaci\u00f3n de MSS registrado al principio de IdML. Tambi\u00e9n puede proporcionarse en la Correlaci\u00f3n de salida del componente (en cuyo caso este valor se sustituir\u00e1).
OPEN_IDML_FC_APPLCODE_LABEL=C\u00f3digo de aplicaci\u00f3n
OPEN_IDML_FC_HOSTNAME_DESC=Nombre de sistema principal de MSS registrado al principio de IdML. Tambi\u00e9n puede proporcionarse en la Correlaci\u00f3n de salida del componente (en cuyo caso este valor se sustituir\u00e1).
OPEN_IDML_FC_HOSTNAME_LABEL=Nombre de host
OPEN_IDML_FC_CDM_DESC=Versi\u00f3n del modelo de datos com\u00fan que utiliza IdML. Su formato es <versi\u00f3n>.<release>.<modificador>.
OPEN_IDML_FC_CDM_LABEL=Versi\u00f3n del modelo de datos com\u00fan.
OPEN_IDML_FC_QUERYDB_SCRIPT_LABEL=Probar conexi\u00f3n
