OPEN_IDML_FC_USEITREGISTRYCDM_DESC=Determina si el componente de funci\u00f3n conf\u00eda en un registro IT para los metadatos del modelo de datos com\u00fan.
OPEN_IDML_FC_USEITREGISTRYCDM_LABEL=Utilizar registro IT para el modelo de datos com\u00fan
