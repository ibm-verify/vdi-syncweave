OPEN_IDML_FC_TITLE=Funktionskomponente zum \u00d6ffnen von IdML
FUNCTION_DESC=Die Funktionskomponente zum \u00d6ffnen von IdML ein IdML-Buch als Datei oder als speicherinternes Snippet. Auf diese Weise kann es von anderen IdML-Komponenten in der Suite verwendet werden.
OPEN_IDML_FC_STOREIDML_DESC=Legt den Speichermechanismus f\u00fcr das von dieser Funktionskomponente ge\u00f6ffnete Buch fest.
OPEN_IDML_FC_STOREIDML_LABEL=IdML speichern
OPEN_IDML_FC_ASFILE=Als Datei
OPEN_IDML_FC_INMEMORY=Im Speicher
OPEN_IDML_FC_DIR_DESC=Der Name des Verzeichnisses, in dem das IdML-Buch gespeichert wird. Nur relevant, wenn das Buch als Datei gespeichert wird.
OPEN_IDML_FC_DIR_LABEL=Verzeichnisname
OPEN_IDML_FC_BOOK_DESC=Der Name des IdML-Buchs, das von dieser Komponente ge\u00f6ffnet wird. Wenn keine Angabe gemacht wird, wird das Standard-IdML-Buch ge\u00f6ffnet.
OPEN_IDML_FC_BOOK_LABEL=Buchname
OPEN_IDML_FC_REFRESH_DESC=Bestimmt, ob es sich um Aktualisierungs- oder Delta-IdML handelt.
OPEN_IDML_FC_REFRESH_LABEL=Neuanzeige
OPEN_IDML_FC_VALIDATE_DESC=Erm\u00f6glicht die Verwendung eines Validierungstools f\u00fcr die generierte IdML-Ausgabe.
OPEN_IDML_FC_VALIDATE_LABEL=Validieren
OPEN_IDML_FC_APPLCODE_DESC=Der Anwendungscode des am Anfang der IdML-Ausgabe registrierten MSS. Er kann auch in der Ausgabezuordnung der Komponente angegeben werden (in diesem Fall wird dieser Wert \u00fcberschrieben).
OPEN_IDML_FC_APPLCODE_LABEL=Anwendungscode
OPEN_IDML_FC_HOSTNAME_DESC=Der Hostname des am Anfang der IdML-Ausgabe registrierten MSS. Er kann auch in der Ausgabezuordnung der Komponente angegeben werden (in diesem Fall wird dieser Wert \u00fcberschrieben).
OPEN_IDML_FC_HOSTNAME_LABEL=Hostname
OPEN_IDML_FC_CDM_DESC=Die von der IdML-Ausgabe verwendete CDM-Version (CDM = Common Data Model). Das Format lautet <version>.<release>.<modifikation>.
OPEN_IDML_FC_CDM_LABEL=CDM-Version
OPEN_IDML_FC_QUERYDB_SCRIPT_LABEL=Verbindung testen
OPEN_IDML_FC_QUERYDB_SCRIPT_HELP=Testen, ob auf die IT-Registry mit den angegebenen Parametern zugegriffen werden kann.
OPEN_IDML_FC_USEITREGISTRYCDM_DESC=Legt fest, ob die Funktionskomponente die CDM-Metadaten \u00fcber eine IT-Registry abruft.
OPEN_IDML_FC_USEITREGISTRYCDM_LABEL=IT-Registry f\u00fcr CDM verwenden
OPEN_IDML_FC_JDBCURL_DESC=Die JDBC-URL, die f\u00fcr die Herstellung einer Verbindung zur IT-Registry verwendet wird.
OPEN_IDML_FC_JDBCURL_LABEL=JDBC-URL
OPEN_IDML_FC_JDBCDRIVER_DESC=Der Datenbanktreiber, der f\u00fcr die Herstellung einer Verbindung zur IT-Registry verwendet wird. 
OPEN_IDML_FC_JDBCDRIVER_LABEL=JDBC-Treiber
OPEN_IDML_FC_DBUSERNAME_DESC=Der Benutzername, der f\u00fcr die Herstellung einer Verbindung zur IT-Registry verwendet wird.
OPEN_IDML_FC_DBUSERNAME_LABEL=Benutzername
OPEN_IDML_FC_DBPASSWORD_DESC=Das Kennwort, das f\u00fcr die Herstellung einer Verbindung zur IT-Registry verwendet wird.
OPEN_IDML_FC_DBPASSWORD_LABEL=Kennwort
OPEN_IDML_FC_CHECKCDM_SCRIPT_LABEL=CDM-Version abrufen 
OPEN_IDML_FC_CHECKCDM_SCRIPT_DESC=Von der IT-Registry oder als JAR-Datei bereitgestellte CDM-Version pr\u00fcfen.
Advanced=Erweitert
