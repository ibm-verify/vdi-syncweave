OPEN_IDML_FC_TITLE = Open IdML Function Component
FUNCTION_DESC = The Open IdML FC opens an IdML book, either as a file or as an in-memory snippet. This permits the other IdML Components in the suite to use it.
OPEN_IDML_FC_STOREIDML_DESC = Determines the storage mechanism for the book opened by this FC.
OPEN_IDML_FC_STOREIDML_LABEL = Store IdML
OPEN_IDML_FC_ASFILE = As file
OPEN_IDML_FC_INMEMORY = In memory
OPEN_IDML_FC_DIR_DESC = The name of the directory where the IdML book will be stored. Only relevant if the book will be stored as a file.
OPEN_IDML_FC_DIR_LABEL = Directory Name
OPEN_IDML_FC_BOOK_DESC = The name of the IdML book that this Component will open. If left blank, the default IdML book will be opened.
OPEN_IDML_FC_BOOK_LABEL = Book Name
OPEN_IDML_FC_REFRESH_DESC = Determines whether this will be a refresh or delta IdML.
OPEN_IDML_FC_REFRESH_LABEL = Refresh
OPEN_IDML_FC_VALIDATE_DESC = Enables the usage of a validation tool for the generated IdML output.
OPEN_IDML_FC_VALIDATE_LABEL = Validate
OPEN_IDML_FC_APPLCODE_DESC = The Application Code of the MSS registered at the beginning of the IdML. It can also be provided in the Output Map of the Component (in which case this value will be overridden).
OPEN_IDML_FC_APPLCODE_LABEL = Application Code
OPEN_IDML_FC_HOSTNAME_DESC = The Hostname of the MSS registered at the beginning of the IdML. It can also be provided in the Output Map of the Component (in which case this value will be overridden).
OPEN_IDML_FC_HOSTNAME_LABEL = Hostname
OPEN_IDML_FC_CDM_DESC = The Common Data Model version used by the IdML. Its format is <version>.<release>.<modifier>.
OPEN_IDML_FC_CDM_LABEL = CDM version
OPEN_IDML_FC_QUERYDB_SCRIPT_LABEL = Test Connection
OPEN_IDML_FC_QUERYDB_SCRIPT_HELP = Test whether the IT registry is accessible using the supplied parameters.
OPEN_IDML_FC_USEITREGISTRYCDM_DESC = Determines whether the FC will rely on an IT registry for the CDM meta data.
OPEN_IDML_FC_USEITREGISTRYCDM_LABEL = Use IT registry for CDM
OPEN_IDML_FC_JDBCURL_DESC = The JDBC URL used for connecting to the IT registry.
OPEN_IDML_FC_JDBCURL_LABEL = JDBC URL
OPEN_IDML_FC_JDBCDRIVER_DESC = The database driver used for connecting to the IT registry. 
OPEN_IDML_FC_JDBCDRIVER_LABEL = JDBC Driver
OPEN_IDML_FC_DBUSERNAME_DESC = The username used when connecting to the IT registry.
OPEN_IDML_FC_DBUSERNAME_LABEL = Username
OPEN_IDML_FC_DBPASSWORD_DESC = The password used when connecting to the IT registry.
OPEN_IDML_FC_DBPASSWORD_LABEL = Password
OPEN_IDML_FC_CHECKCDM_SCRIPT_LABEL = Get CDM version 
OPEN_IDML_FC_CHECKCDM_SCRIPT_DESC = Check the version of the CDM provided by the IT registry or as a JAR file
Advanced = Advanced
