CLOSE_IDML_FC_TITLE = Close IdML Function Component
FUNCTION_DESC = The Close IdML FC closes an IdML book and removes it, so it is no longer shared between the IdML Components.
CLOSE_IDML_FC_BOOK_DESC = The name of the IdML book that this Component will close. If left blank, the default IdML book will be closed.
CLOSE_IDML_FC_BOOK_LABEL = Book Name
Advanced = Advanced
