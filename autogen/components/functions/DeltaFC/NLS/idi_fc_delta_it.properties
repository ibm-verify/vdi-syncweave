DELTA_ROW_LOCKING_LABEL=Blocco delle righe
DELTA_ROW_LOCKING_DESC=Questo parametro indica la necessit\u00e0 del blocco delle righe in una tabella Archivio Delta quando pi\u00f9 client DB accedono \nagli stessi dati, impostando un 'Livello di isolamento della transazione'. Impostando un livello di isolamento pi\u00f9 elevato, le anomalie della transazione\nnote come 'dirty read', 'non-repeatable reads' e 'phantom reads' vengono ridotte utilizzando blocchi di righe e tabelle.
DELTA_FAST_LABEL=Algoritmo pi\u00f9 veloce
