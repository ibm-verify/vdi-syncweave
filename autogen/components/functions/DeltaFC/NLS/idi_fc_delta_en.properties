FC_TITLE = Delta Function Component
FC_DESC = Function Component that computes entry changes using Delta Store \
    table.
DELTA_UNIQ_ATTRIB_LABEL = Unique Attribute Name
DELTA_UNIQ_ATTRIB_DESC = Attribute(s) used as primary key in the Delta Store \
    table.
DELTA_DB_PATH_LABEL = Delta Store
DELTA_DB_PATH_DESC = A Delta Table Identifier
DELTA_DB_SCR_LABEL = Delete
DELTA_DB_SCR_HELP = Delete this Delta Store table
DELTA_READ_DEL_LABEL = Read Deleted
DELTA_READ_DEL_DESC = Return all deleted entries from Delta Store at end of \
    primary iteration
DELTA_RM_DEL_LABEL = Remove Deleted
DELTA_RM_DEL_DESC = Remove deleted entries after reading them (if Read \
    Deleted \= true)
DELTA_RET_UNCHANGED_LABEL = Return Unchanged
DELTA_RET_UNCHANGED_DESC = Return unchanged entries, in addition to the new \
    and modified entries
DELTA_COMMIT_LABEL = Commit
DELTA_COMMIT_DESC = Specify when to commit Delta Store operation
DELTA_ROW_LOCKING_LABEL = Row Locking
DELTA_ROW_LOCKING_DESC = This parameter addresses the need for row locking in \
    a Delta Store table when multiple DB Clients access the\nsame data, by \
    setting a 'Transaction Isolation Level'.Setting a higher isolation level \
    reduces the transaction\nanomalies known as 'dirty reads', '\
    non-repeatable reads' and 'phantom reads' by using row and table locks.
DELTA_FAST_LABEL = Faster algorithm
DELTA_FAST_DESC = Do not write unchanged entries to Delta database, instead \
    remember keys in memory if Read Deleted \= true
DELTA_DUPLICATE_DELTA_LABEL = Allow duplicate Delta keys
DELTA_DUPLICATE_DELTA_DESC = Allow duplicate keys to be handled. This may be \
    useful e.g. for AssemblyLines that use Changelog Connectors with Delta \
    storing enabled.
Localized.AfterEveryDatabaseOperation = After every database operation
Localized.AfterEndOfALcycle = On end of AL cycle
Localized.OnConnectorClose = On Connector close
Localized.NoAutocommit = No autocommit
Localized.ReadUncommited = Read uncommitted
Localized.ReadCommited = Read committed
Localized.RepeatableRead = Repeatable read
Localized.Serializable = Serializable
DELTA_CHANGE_DETECTION_MODE__DESC = Specify whether to detected or ignore \
    changes in Attributes listed in 'Attribute List' parameter.
DELTA_CHANGE_DETECTION_MODE_LABEL = Change Detection Mode
Localized.IgnoreAttributes = Ignore changes for the following Attributes
Localized.DetectAttributes = Detect changes for the following Attributes
Localized.DetectAll = Use all Attributes for change detection
DELTA_ATTRIBUTE_LIST_DESC = List of comma separated Attributes whose changes \
    will be detected or ignored based on the value of 'Change Detection Mode' \
    parameter.
DELTA_ATTRIBUTE_LIST_LABEL = Attribute List
