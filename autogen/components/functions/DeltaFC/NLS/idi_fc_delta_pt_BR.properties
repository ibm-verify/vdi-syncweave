DELTA_DUPLICATE_DELTA_LABEL=Permitir chaves Delta duplicadas
DELTA_DUPLICATE_DELTA_DESC=Permitir manipula\u00e7\u00e3o de chaves duplicadas. Isso pode ser \u00fatil, por exemplo, para AssemblyLines que usam Conectores Changelog com o armazenamento Delta ativado.
