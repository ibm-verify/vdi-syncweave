DELTA_ROW_LOCKING_LABEL=Bloqueio de Linha
DELTA_ROW_LOCKING_DESC=Este par\u00e2metro aborda a necessidade de bloqueio de linha em uma tabela de Armazenamento Delta quando v\u00e1rios Clientes de BD acessam os\nmesmo dados, configurando um 'N\u00edvel de Isolamento de Transa\u00e7\u00e3o'. A configura\u00e7\u00e3o de um n\u00edvel de isolamento superior reduz anomalias na\ntransa\u00e7\u00e3o conhecidas como 'leituras sujas', 'leituras n\u00e3o repet\u00edveis' e 'leituras fantasmas' atrav\u00e9s do uso de bloqueios de linha e tabela.
DELTA_FAST_LABEL=Algoritmo Mais R\u00e1pido
