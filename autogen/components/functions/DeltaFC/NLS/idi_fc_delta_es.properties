FC_TITLE=Componente de funci\u00f3n delta
FC_DESC=Componente de funci\u00f3n que calcula los cambios de entradas con la tabla de almac\u00e9n Delta.
DELTA_UNIQ_ATTRIB_LABEL=Nombre de atributo exclusivo
DELTA_UNIQ_ATTRIB_DESC=Atributos usados como clave primaria en la tabla de almac\u00e9n Delta.
DELTA_DB_PATH_LABEL=Almac\u00e9n Delta
DELTA_DB_PATH_DESC=Un identificador de tabla Delta
DELTA_DB_SCR_LABEL=Suprimir
DELTA_DB_SCR_HELP=Suprimir esta tabla de almac\u00e9n Delta
DELTA_READ_DEL_LABEL=Leer entradas suprimidas
DELTA_READ_DEL_DESC=Devolver todas las entradas suprimidas del almac\u00e9n Delta al final de la primera iteraci\u00f3n
DELTA_RM_DEL_LABEL=Eliminar entradas suprimidas
DELTA_RM_DEL_DESC=Eliminar las entradas suprimidas despu\u00e9s de leerlas (si Leer entradas suprimidas = true)
DELTA_RET_UNCHANGED_LABEL=Devolver las entradas sin cambios
DELTA_RET_UNCHANGED_DESC=Devolver las entradas sin cambios, adem\u00e1s de las nuevas y modificadas
DELTA_COMMIT_LABEL=Comprometer
DELTA_COMMIT_DESC=Especifica cu\u00e1ndo se debe comprometer la operaci\u00f3n del almac\u00e9n Delta
DELTA_ROW_LOCKING_LABEL=Bloqueo de fila
DELTA_ROW_LOCKING_DESC=Este par\u00e1metro cubre la necesidad de bloqueo de fila en una tabla de almac\u00e9n Delta cuando varios clientes de la base de datos acceden a\n los mismos datos, al establecer un 'nivel de aislamiento de transacci\u00f3n'. Si se establece un nivel de aislamiento mayor, se reducen las anomal\u00edas de transacci\u00f3n conocidas como\n 'lecturas incorrectas', 'lecturas no repetibles' y 'lecturas fantasma' mediante el uso de bloqueos de fila y tabla.
DELTA_FAST_LABEL=Algoritmo m\u00e1s r\u00e1pido
DELTA_FAST_DESC=No grabar les entradas sin cambios en la base de datos Delta, sino recordar las claves en la memoria si Leer entradas suprimidas = true
DELTA_DUPLICATE_DELTA_LABEL=Permitir claves Delta duplicadas
DELTA_DUPLICATE_DELTA_DESC=Permite manejar claves duplicadas. Esto puede ser \u00fatil, por ejemplo, para las l\u00edneas de ensamblaje que utilizan conectores de registros de cambios con el almacenamiento Delta habilitado.
Localized.AfterEveryDatabaseOperation=Despu\u00e9s de cada operaci\u00f3n de base de datos
Localized.AfterEndOfALcycle=Al final del ciclo de la LE
Localized.OnConnectorClose=Al cerrarse el conector
Localized.NoAutocommit=Sin compromiso autom\u00e1tico
Localized.ReadUncommited=Lectura no confirmada
Localized.ReadCommited=Lectura confirmada
Localized.RepeatableRead=Lectura repetible
Localized.Serializable=Serializable
DELTA_CHANGE_DETECTION_MODE__DESC=Especificar si se van a detectar o ignorar los cambios de los atributos listados en el par\u00e1metro 'Lista de atributos'.
DELTA_CHANGE_DETECTION_MODE_LABEL=Cambiar modalidad de detecci\u00f3n
Localized.IgnoreAttributes=Ignorar cambios de los atributos siguientes
Localized.DetectAttributes=Detectar cambios de los atributos siguientes
Localized.DetectAll=Usar todos los atributos para la detecci\u00f3n de cambios
DELTA_ATTRIBUTE_LIST_DESC=Lista de atributos separados por comas cuyos cambios se detectar\u00e1n o ignorar\u00e1n en funci\u00f3n del valor del par\u00e1metro 'Cambiar modalidad de detecci\u00f3n'.
