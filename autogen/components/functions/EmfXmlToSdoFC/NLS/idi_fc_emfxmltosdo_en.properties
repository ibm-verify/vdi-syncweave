FC_DESC = Function Component for converting XML to EMF Service Data Objects
FC_TITLE = EMF XMLToSDO Function Component
XF_LBL = XSD File URI
XF_DESC = XML Schema File (XSD) in URI format. Example\: file\:///c\:/tdi/shiporder.xsd
UN_LBL = Use Namespaces
UN_DESC = If checked the Function Component prefixes the attribute names with a namespace prefix or a namespace URI
NM_LBL = Namespace Map
NM_DESC = Namespace prefix to namespace URI Map
IXT_LBL = Input XML as
IXT_DESC = specifies the input XML type
ENC_LBL = Encoding
ENC_DESC = Specify the charset to use for encoding converting to and from XML. If left blank the default system charset is used.
Localized.String = String
Localized.DOMElement = DOMElement
Advanced = Advanced
