FC_DESC = Function Component that converts EMF Service Data Objects to XML
FC_TITLE = EMF SDOToXML Function Component
XF_LBL = XSD File URI
XF_DESC = XML Schema File (XSD) in URI format. Example\: file\:///c\:/tdi/shiporder.xsd
UN_LBL = Use Namespaces on Schema Discovery
UN_DESC = If checked the schema discovery prefixes the attribute names with a namespace prefix or a namespace URI
NM_LBL = Namespace Map
NM_DESC = Namespace prefix to namespace URI map
RXT_LBL = Return XML as
RXT_DESC = specifies the return XML type
ENC_LBL = Encoding
ENC_DESC = Specify the charset to use for encoding converting to and from XML. If left blank the default system charset is used.
Localized.String = String
Localized.DOMElement = DOMElement
Advanced = Advanced
