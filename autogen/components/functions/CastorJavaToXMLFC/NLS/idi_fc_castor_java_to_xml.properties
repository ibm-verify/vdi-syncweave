FC_TITLE = Castor Java-to-XML Function Component
FUNCTION_DESC = Convert an Entry or a general Java object to an XML document
MF_LBL = Castor Mapping File
MF_DESC = an XML Mapping File (as defined by the Castor syntax) that defines \
    how Java objects are serialized into XML
REN_LBL = XML Root Element
REN_DESC = the name of the root element of the generated XML; if left empty \
    the root element is named "Entry"
UAN_LBL = Use Attribute Names
UAN__DESC = if this flag is set to true, the names of the Attributes are used \
    as XML element names, otherwise the XML elements are named as specified \
    in the Mapping File
RXT_LBL = Return XML as
RXT_DESC = specifies the return type - DOM Element or String
Localized.String = String
Localized.DOMElement = DOMElement
Advanced = Advanced
