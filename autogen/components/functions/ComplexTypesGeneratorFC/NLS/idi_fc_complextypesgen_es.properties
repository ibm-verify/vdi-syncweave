FC_TITLE=Componente de funci\u00f3n del generador de tipos complejos
FUNCTION_DESC=Se utiliza para generar un archivo JAR, que contiene los archivos de clases Java que implementan los tipos de datos complejos que se definen en un esquema interno de un WSDL o al que \u00e9ste hace referencia.
WU_LBL=Direcci\u00f3n URL de WSDL
WU_DESC=Puede ser una v\u00eda de acceso de sistema de archivos (absoluta o relativa) o una direcci\u00f3n URL.
WU_SLBL=Seleccionar...
WU_SHLP=Examina el sistema de archivos
WTJO_LBL=Opciones de WSDL2Java
WTJO_DESC=Las opciones que se escriban aqu\u00ed se pasar\u00e1n al programa de utilidad WSDL2Java.
JF_LBL=Nombre del archivo JAR
JF_DESC=Nombre del archivo JAR (puede ser relativo o absoluto)
JP_LBL=V\u00eda de acceso del JDK
JP_DESC=V\u00eda de acceso de instalaci\u00f3n del Java Development Kit. Si se deja en blanco, el programa de utilidad presupone que el compilador Java "javac" y las herramientas "jar" est\u00e1n en la v\u00eda de acceso ejecutable del sistema.
AGJSF_LBL=Generar archivos de origen Java
AGJSF_DESC=Si se establece en TRUE, WSDL2Java se ejecutar\u00e1 para generar los archivos de origen Java a partir del WSDL proporcionado. Puede establecer este par\u00e1metro en FALSE si desea ejecutar este programa de utilidad en archivos de origen Java editados manualmente o escritos.
RSB_SLBL=Generar tipos complejos
RSB_SHLP=Generar tipos complejos
WUMNBE=La direcci\u00f3n URL del WSDL no debe estar vac\u00eda.
JFMNBE=El nombre de archivo JAR no debe estar vac\u00edo.
JFSG=El archivo JAR se ha generado correctamente.
Advanced=Avanzada
