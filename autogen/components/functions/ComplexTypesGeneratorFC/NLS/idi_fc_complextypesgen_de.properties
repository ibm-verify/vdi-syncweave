# NLS_MESSAGEFORMAT_NONE
# NLS_ENCODING=UNICODE
FC_TITLE=Funktionskomponente f\u00fcr den Generator f\u00fcr komplexe Typen
FUNCTION_DESC=Diese Funktionskomponente wird dazu verwendet, eine JAR-Datei zu erstellen. Diese enth\u00e4lt die Java-Klassendateien, mit denen die komplexen Datentypen implementiert werden, die in einem Schema definiert sind, das entweder in ein WSDL-Dokument integriert ist oder von diesem referenziert wird.
WU_LBL=WSDL-URL
WU_DESC=Kann entweder ein Dateisystempfad (absolut oder relativ) oder eine URL-Adresse sein.
WU_SLBL=Ausw\u00e4hlen...
WU_SHLP=Dateisystem durchsuchen
WTJO_LBL=WSDL2Java-Optionen
WTJO_DESC=Die hier eingegebenen Optionen werden an das Dienstprogramm WSDL2Java \u00fcbergeben.
JF_LBL=JAR-Dateiname
JF_DESC=JAR-Dateiname (relativ oder absolut)
JP_LBL=JDK-Pfad
JP_DESC=Der Pfad f\u00fcr eine JDK-Installation (JDK = Java Development Kit). Wird dieser leer gelassen, setzt das Dienstprogramm voraus, dass sich der Java-Compiler "javac" und die JAR-Tools in dem ausf\u00fchrbaren Systempfad befinden.
AGJSF_LBL=Java-Quellendateien generieren
AGJSF_DESC=Wenn der Wert auf TRUE gesetzt ist, wird WSDL2Java ausgef\u00fchrt, um Java-Quellendateien aus der bereitgestellten WSDL zu generieren. Dieser Parameter kann auf FALSE gesetzt werden, wenn dieses Dienstprogramm mit manuell bearbeiteten oder geschriebenen Java-Quellendateien ausgef\u00fchrt werden soll.
RSB_SLBL=Komplexe Typen generieren
RSB_SHLP=Komplexe Typen generieren
WUMNBE=WSDL-URL darf nicht leer sein!
JFMNBE=JAR-Dateiname darf nicht leer sein!
JFSG=JAR-Datei erfolgreich generiert.
Advanced=Erweitert
