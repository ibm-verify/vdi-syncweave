INIT_ITREGISTRY_FC_TITLE = Init IT registry Function Component
INIT_ITREGISTRY_FC_DESC = The Init IT registry FC registers a MSS to the IT registry database and returns its GUID
INIT_ITREGISTRY_FC_CDM_DESC = The Common Data Model version used by IT registry. Its format is <version>.<release>.<modifier>.
INIT_ITREGISTRY_FC_CDM_LABEL = CDM version
INIT_ITREGISTRY_FC_BOOKNAME_DESC = The name of IT registry book which is shared statically between the IT registry Components. If left blank, the default book name will be shared.
INIT_ITREGISTRY_FC_BOOKNAME_LABEL = Book Name
INIT_ITREGISTRY_FC_REFRESH_DESC = Determines whether this will be a refresh or delta IdML.
INIT_ITREGISTRY_FC_REFRESH_LABEL = Refresh
INIT_ITREGISTRY_FC_QUERYDB_SCRIPT_LABEL = Test Connection
INIT_ITREGISTRY_FC_QUERYDB_SCRIPT_HELP = Test whether the IT registry database is accessible using the supplied parameters.
INIT_ITREGISTRY_FC_USEITREGISTRYCDM_DESC = Determines whether the FC will rely on IT registry for the CDM meta data.
INIT_ITREGISTRY_FC_USEITREGISTRYCDM_LABEL = Use IT registry for CDM
INIT_ITREGISTRY_FC_JDBCURL_DESC = The JDBC URL used for connecting to the IT registry database.
INIT_ITREGISTRY_FC_JDBCURL_LABEL = JDBC URL
INIT_ITREGISTRY_FC_JDBCDRIVER_DESC = The database driver used for connecting to the IT registry database. 
INIT_ITREGISTRY_FC_JDBCDRIVER_LABEL = JDBC Driver
INIT_ITREGISTRY_FC_DBUSERNAME_DESC = The username used when connecting to the IT registry database.
INIT_ITREGISTRY_FC_DBUSERNAME_LABEL = Username
INIT_ITREGISTRY_FC_DBPASSWORD_DESC = The password used when connecting to the IT registry database.
INIT_ITREGISTRY_FC_DBPASSWORD_LABEL = Password
INIT_ITREGISTRY_FC_CHECKCDM_SCRIPT_LABEL = Get CDM version
INIT_ITREGISTRY_FC_CHECKCDM_SCRIPT_DESC = Check the version of the CDM provided by IT registry or as a JAR file
