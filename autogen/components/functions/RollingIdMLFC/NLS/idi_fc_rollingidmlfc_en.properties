ROLLING_IDML_FC_TITLE = Rolling IdML Function Component
FUNCTION_DESC = The Rolling IdML FC allows splitting the generated IdML file into several files, based on either size or artifact count.
ROLLING_IDML_FC_ARTIFACTCOUNT_DESC = Determines the maximum number of artifacts to be stored in one IdML file (0 is considered unlimited). 
ROLLING_IDML_FC_ARTIFACTCOUNT_LABEL = Artifact Count
ROLLING_IDML_FC_FILESIZE_DESC = Determines the maximum number of kilobytes to be written to one IdML file (0 is considered unlimited).
ROLLING_IDML_FC_FILESIZE_LABEL = File Size (KB)
ROLLING_IDML_FC_BOOK_DESC = The name of the IdML book that this Component will roll. If left blank, the default IdML book will be used.
ROLLING_IDML_FC_BOOK_LABEL = Book Name
Advanced = Advanced
