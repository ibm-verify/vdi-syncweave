ROLLING_IDML_FC_TITLE=Funktionskomponente f\u00fcr IdML-Ausgabe in mehreren Dateien
FUNCTION_DESC=Die Funktionskomponente f\u00fcr die IdML-Ausgabe in mehreren Dateien erm\u00f6glicht die Aufteilung der generierten IdML-Datei in mehrere Dateien auf der Basis der Gr\u00f6\u00dfe oder der Artefaktanzahl.
