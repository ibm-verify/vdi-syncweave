ROLLING_IDML_FC_TITLE=Componente funzione Esegui rolling del file IdML
FUNCTION_DESC=Il componente funzione Esegui rolling del file IdML consente di suddividere il file IdML generato in diversi file, in base alla dimensione o al conteggio degli elementi.
ROLLING_IDML_FC_ARTIFACTCOUNT_DESC=Determina il numero massimo di elementi da archiviare in un file IdML (il valore 0 indica illimitato). 
ROLLING_IDML_FC_ARTIFACTCOUNT_LABEL=Conteggio elementi
ROLLING_IDML_FC_FILESIZE_DESC=Determina il numero massimo di kilobyte da scrivere in un file IdML (il valore 0 indica illimitato).
ROLLING_IDML_FC_FILESIZE_LABEL=Dimensione file (KB)
ROLLING_IDML_FC_BOOK_DESC=Il nome del book IdML di cui questo componente eseguir\u00e0 il rolling. Se lasciato vuoto, verr\u00e0 utilizzato il book IdML predefinito.
