ASSEMBLYLINEFC_TITLE = AssemblyLine Function Component
FUNCTION_DESC = The AssemblyLine FC wraps the calling of another AssemblyLine into a Component, with some controls on how the other AssemblyLine is executed and what to do with a possible result.
ALFC_AL_LAB = AssemblyLine/Sequence
ALFC_AL_DESC = The AssemblyLine or Sequence to run
ALFC_AL_SC_LAB = Query
ALFC_AL_SC_HELP = Query the server for available AssemblyLines/Sequences
ALFC_SERVER_LAB = Server
ALFC_SERVER_DESC = Use "local"/blank for internal server or hostname[\:port] for remote server
ALFC_CONFIG_LAB = Config Instance
ALFC_CONFIG_DESC = Specify the config instance when using a remote server
ALFC_CONFIG_SC_LAB = Query
ALFC_CONFIG_SC_HELP = Query the server for available configuration instances
ALFC_MODE_LAB = Execution Mode
ALFC_MODE_DESC = Specify type of execution
ALFC_MODE_0 = Run and wait for result
ALFC_MODE_1 = Run in background
ALFC_MODE_2 = Manual (cycle mode)
CUSTOM_SEC_DESC = Check to use the "api.remote.server." java properties instead of standard "javax.net.ssl." properties for keystore configuration
CUSTOM_SEC_LABEL = Custom Keystores
USE_TCB_LABEL = Use TCB Attributes
USE_TCB_DESC = When checked the FC will interpret attributes with a "$tcb." prefix as parameters to the TCB and remove them from the entry 
OPERATION_DESC = AssemblyLine Operation
OPERATION_LABEL = Operation
OPERATION_SC_LABEL = Query
OPERATION_SC_HELP = Query the AL for available operations
OPERATION_INIT_LABEL = AssemblyLine Parameters
OPERATION_INIT_DESC = Parameters for the AssemblyLine (called before operation is called) 
SHARE_LOG_LABEL = Share Logging
SHARE_LOG_DESC = If set, the called AssemblyLine will use the same logging as this Component/AssemblyLine
SIMULATE_LABEL = Simulate
SIMULATE_DESC = If set, the called AssemblyLine will make use of its Simulation Config when interacting with external systems.
Advanced = Advanced
