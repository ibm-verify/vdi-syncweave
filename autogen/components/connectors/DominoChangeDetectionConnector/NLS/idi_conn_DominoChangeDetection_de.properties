CONN_DESC = Connector zum Ermitteln und Abrufen von \u00C4nderungen in einer Domino-Datenbank
CONN_TITLE = Domino-\u00C4nderungserkennungsconnector
SESSIONTYPE_DESC = Gibt an, ob der Connector eine IIOP-Sitzung erstellt oder lokale Clients aufruft.
SESSIONTYPE_LBL = Sitzungstyp
DOMINOSERVERIP_DESC = Die IP-Adresse (oder der Hostname) des Domino-Servers, auf dem sich die Datenbank befindet, die f\u00FCr \u00C4nderungen aufgerufen wird.
DOMINOSERVERIP_LBL = IP-Adresse des Domino-Servers
IOR_DESC = F\u00FCr die Erstellung der IIOP-Sitzung erforderliche IOR-Zeichenfolge. Dieser Parameter kann wahlweise verwendet werden, anstatt diesen Wert vom Domino-Server abzurufen.
IOR_LBL = IOR-Folge
HTTPPORT_DESC = Der Port, auf dem die HTTP-Task des Domino-Servers gerade ausgef\u00FChrt wird.
HTTPPORT_LBL = HTTP-Port
USERNAME_DESC = Benutzername f\u00FCr die Sitzungsauthentifizierung. Dieser muss mit dem ersten Wert im Benutzernamensfeld des Personendokuments des jeweiligen Benutzers \u00FCbereinstimmen.
USERNAME_LBL = Benutzername
INTERNETPASSWORD_DESC = Benutzerkennwort f\u00FCr die Sitzungsauthentifizierung. Das Kennwort muss mit dem Internetkennwortfeld des Personendokuments des Benutzers \u00FCbereinstimmen.
INTERNETPASSWORD_LBL = Kennwort
DATABASE_DESC = Der Dateiname der Domino-Datenbank, die f\u00FCr \u00C4nderungen aufgerufen wird, z. B. "names.nsf".
DATABASE_LBL = Datenbank
SYSTEMSTOREKEY_DESC = Ein Schl\u00FCssel (der eindeutig sein muss), der dazu verwendet wird, die zuletzt durch diesen Connector verarbeitete \u00C4nderung zu verfolgen.
SYSTEMSTOREKEY_LBL = Schl\u00FCssel f\u00FCr Iteratorstatus
SYSTEMSTOREKEY_SCR_LBL = L\u00F6schen
SYSTEMSTOREKEY_SCR_HELP = L\u00F6scht Iteratorstatusinformationen
STARTAT_DESC = Art der Startbedingung. Dieser Parameter wird nur dann ber\u00FCcksichtigt, wenn der persistente Parameter, der in "Schl\u00FCssel f\u00FCr Iteratorstatus" angegeben wurde, leer ist oder nicht im Systemspeicher gefunden wird.
STARTAT_LBL = Startpunkt
STARTDATE_DESC = Startdatum und -zeit. Der Connector ruft Dokumente ab, die an diesem Tag oder zu dieser Uhrzeit oder danach ge\u00E4ndert wurden.\nDieser Parameter unterst\u00FCtzt die folgenden Datums-/Zeitformate\:\n   yyyy-MM-dd HH\:mm\:ss.SSS\n   yyyy-MM-dd HH\:mm\:ss\n   yyyy-MM-dd\nDieser Parameter wird nur dann ber\u00FCcksichtigt, wenn der persistente Parameter, der in "Schl\u00FCssel f\u00FCr Iteratorstatus"\nangegeben wurde, im Systemspeicher nicht gefunden wird und der Startpunktparameter auf ein spezifisches Datum gesetzt wird.
STARTDATE_LBL = Startdatum (JJJJ-MM-TT HH\:mm\:ss)
TIMEOUT_DESC = Gibt den maximalen Zeitraum in Sekunden an, w\u00E4hrend dessen der Connector auf das n\u00E4chste ge\u00E4nderte Dokument wartet.\nBei der Angabe 0 f\u00FCr diesen Parameter ist der Wartezeitraum unbegrenzt.
TIMEOUT_LBL = Zeitlimit
SLEEP_DESC = Gibt den Zeitraum in Sekunden an, w\u00E4hrend dessen sich der Connector zwischen aufeinander folgenden Sendeaufrufen zur Ermittlung von \u00C4nderungen im Ruhestatus befindet.
SLEEP_LBL = Ruheintervall
ssl_label = SSL verwenden
ssl_desc = Erm\u00F6glicht die verschl\u00FCsselte Kommunikation mit dem Domino-Server
Localized.Start.Of.Data = Datenanfang
Localized.End.Of.Data = Datenende
Localized.Specific.date = Spezifisches Datum
STATE_KEY_PERSIST_LBL = Statusschl\u00FCsselpersistenz
STATE_KEY_PERSIST_DESC = Bestimmt, wann der Iteratorstatus gespeichert wird. Die empfohlene Einstellung lautet 'Zyklusende'.
Localized.After.read = Nach dem Lesevorgang
Localized.End.of.cycle = Zyklusende
Localized.Manual = Manuell
Localized.IIOP = IIOP
Localized.LocalClient = Lokaler Client
sort_label = Sortierte \u00DCbergabe
sort_desc = Wenn diese Option aktiviert ist, werden die ge\u00E4nderten Dokumente nach dem Datum ihrer letzten \u00C4nderung sortiert zugestellt. Andernfalls werden die ge\u00E4nderten Dokumente in zuf\u00E4lliger Reihenfolge zugestellt.\n Wenn die Anzahl der ge\u00E4nderten Dokumente hoch ist, kann die Sortierung die Leistung von IBM Security Verify Directory Integrator beeintr\u00E4chtigen.
Advanced = Erweitert
