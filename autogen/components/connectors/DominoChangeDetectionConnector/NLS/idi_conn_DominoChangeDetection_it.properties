CONN_DESC = Connettore per il rilevamento e il richiamo delle modifiche in un database Domino
CONN_TITLE = Connettore di rilevamento modifiche Domino
SESSIONTYPE_DESC = Specifica se il connettore creer\u00E0 la sessione IIOP o eseguir\u00E0 delle chiamate del client locale
SESSIONTYPE_LBL = Tipo di sessione
DOMINOSERVERIP_DESC = L'indirizzo IP (o il nome host) del server Domino in cui si trova il database di cui verr\u00E0 eseguito il polling per le modifiche.
DOMINOSERVERIP_LBL = Indirizzo IP del server Domino
IOR_DESC = La stringa IOR utilizzata per creare la sessione IIOP. \u00C8 possibile, facoltativamente, utilizzare questo parametro invece di richiedere questo valore dal server Domino.
IOR_LBL = Stringa IOR
HTTPPORT_DESC = La porta in cui \u00E8 in esecuzione l'attivit\u00E0 HTTP del server Domino
HTTPPORT_LBL = Porta HTTP
USERNAME_DESC = Nome utente per l'autenticazione della sessione. Deve corrispondere al primo valore del campo "Nome utente" del documento Persona dell'utente.
USERNAME_LBL = Nome utente
INTERNETPASSWORD_DESC = Password utente per l'autenticazione della sessione. Deve corrispondere al campo "Password Internet" del documento Persona dell'utente.
INTERNETPASSWORD_LBL = Password
DATABASE_DESC = Il nome file del database Domino di cui verr\u00E0 eseguita l'interrogazione per le modifiche, ad esempio "names.nsf".
DATABASE_LBL = Database
SYSTEMSTOREKEY_DESC = Una chiave (che deve essere univoca) utilizzata per tenere traccia dell'ultima modifica elaborata da questo connettore.
SYSTEMSTOREKEY_LBL = Chiave di stato iteratore
SYSTEMSTOREKEY_SCR_LBL = Elimina
SYSTEMSTOREKEY_SCR_HELP = Elimina le informazioni sullo stato dell'iteratore
STARTAT_DESC = Il tipo di condizione di avvio. Questo parametro viene tenuto presente solo quando il parametro permanente specificato da "Chiave stato iteratore" \u00E8 vuoto o non viene trovato nell'Archivio di sistema.
STARTAT_LBL = Avvia su
STARTDATE_DESC = La data e l'ora "Da". Il Connettore richiamer\u00E0 i documenti modificati in/dopo quella data/ora specificata. \nQuesto parametro accetta i seguenti formati di data/ora\:\n  aaaa-MM-gg HH\:mm\:ss.SSS\n  aaaa-MM-gg HH\:mm\:ss\n  aaaa-MM-gg\nViene preso in considerazione solo quando il parametro permanente specificato da "Chiave di stato iteratore"\nnon viene trovato nell'Archivio di sistema e il parametro "Avvia a" \u00E8 impostato su "Data specifica".
STARTDATE_LBL = Data di Inizio (aaaa-MM-gg HH\:mm\:ss)
TIMEOUT_DESC = Specifica il numero massimo di secondi di attesa del Connettore per il successivo documento modificato.\nSe il parametro \u00E8 0, il connettore attende illimitatamente.
TIMEOUT_LBL = Scaduta
SLEEP_DESC = Specifica il numero di secondi in cui il Connettore \u00E8 inattivo tra le interrogazioni successive per le modifiche.
SLEEP_LBL = Intervallo inattivit\u00E0
ssl_label = Utilizza SSL
ssl_desc = Abilita le comunicazioni codificate con il server domino
Localized.Start.Of.Data = Data di inizio
Localized.End.Of.Data = Data di fine
Localized.Specific.date = Data specifica
STATE_KEY_PERSIST_LBL = Persistenza chiave stato
STATE_KEY_PERSIST_DESC = Determina quando viene salvato lo stato dell'iteratore. L'impostazione consigliata \u00E8 Fine del ciclo.
Localized.After.read = Dopo la lettura
Localized.End.of.cycle = Fine del ciclo
Localized.Manual = Manuale
Localized.IIOP = IIOP
Localized.LocalClient = Client locale
sort_label = Consegna ordinata
sort_desc = Se selezionato, i documenti modificati vengono consegnati ordinati in base alla data dell'ultima modifica; in caso contrario, i documenti modificati vengono consegnati in ordine casuale.\n Se il numero di documenti modificati \u00E8 elevato, l'ordinamento potrebbe rallentare le prestazioni di SyncWeave .
Advanced = Avanzate
