CONN_DESC = Connecteur de d\u00E9tection et d'extraction des changements dans une base de donn\u00E9es Domino
CONN_TITLE = Connecteur de d\u00E9tection des changements Domino
SESSIONTYPE_DESC = Indique si le connecteur va cr\u00E9er une session IIOP ou effectuer des appels de client local.
SESSIONTYPE_LBL = Type de session
DOMINOSERVERIP_DESC = Adresse IP (ou nom d'h\u00F4te) du serveur Domino qui h\u00E9berge la base de donn\u00E9es o\u00F9 les changements seront recherch\u00E9es.
DOMINOSERVERIP_LBL = Adresse IP du serveur Domino
IOR_DESC = Cha\u00EEne IOR utilis\u00E9e pour cr\u00E9er la session IIOP. Ce param\u00E8tre peut \u00E9ventuellement \u00EAtre utilis\u00E9 au lieu de demander cette valeur au serveur Domino.
IOR_LBL = Cha\u00EEne IOR
HTTPPORT_DESC = Port sur lequel la t\u00E2che HTTP du serveur Domino est en cours d'ex\u00E9cution
HTTPPORT_LBL = Port HTTP
USERNAME_DESC = Nom d'utilisateur pour l'authentification de la session. Celui-ci doit correspondre \u00E0 la premi\u00E8re valeur de la zone "Nom d'utilisateur" du document Personne de l'utilisateur.
USERNAME_LBL = Nom d'utilisateur
INTERNETPASSWORD_DESC = Mot de passe utilisateur pour l'authentification de la session. Celui-ci doit correspondre \u00E0 la zone "Mot de passe Internet" du document Personne de l'utilisateur.
INTERNETPASSWORD_LBL = Mot de passe
DATABASE_DESC = Nom du fichier de la base de donn\u00E9es Domino o\u00F9 rechercher les changements (par exemple, names.nsf).
DATABASE_LBL = Base de donn\u00E9es
SYSTEMSTOREKEY_DESC = Cl\u00E9 (devant \u00EAtre unique) utilis\u00E9e pour rester inform\u00E9 du dernier changement trait\u00E9 par ce connecteur.
SYSTEMSTOREKEY_LBL = Cl\u00E9 d'\u00E9tat d'it\u00E9rateur
SYSTEMSTOREKEY_SCR_LBL = Supprimer
SYSTEMSTOREKEY_SCR_HELP = Supprime les informations d'\u00E9tat d'it\u00E9rateur
STARTAT_DESC = Type de condition de d\u00E9marrage. Ce param\u00E8tre est pris en compte uniquement lorsque le param\u00E8tre persistant indiqu\u00E9 par l'option "Cl\u00E9 d'\u00E9tat d'it\u00E9rateur" est vide ou introuvable dans le magasin syst\u00E8me.
STARTAT_LBL = Commencer \u00E0
STARTDATE_DESC = Date et heure de r\u00E9f\u00E9rence. Le connecteur extrait les documents modifi\u00E9s \u00E0 ou apr\u00E8s cette date/heure.\nCe param\u00E8tre accepte les formats de date/heure suivants \:\n  aaaa-MM-jj HH\:mm\:ss.SSS\n  aaaa-MM-jj HH\:mm\:ss\n  aaaa-MM-jj\nIl est pris en compte uniquement lorsque le param\u00E8tre persistant indiqu\u00E9 par l'option "Cl\u00E9 d'\u00E9tat d'it\u00E9rateur "\nest introuvable dans le magasin syst\u00E8me et le param\u00E8tre "Commencer \u00E0" est d\u00E9fini sur "Date sp\u00E9cifique".
STARTDATE_LBL = Date de d\u00E9but (aaaa-MM-jj HH\:mm\:ss)
TIMEOUT_DESC = Dur\u00E9e maximale en secondes pendant laquelle le connecteur attend le prochain document modifi\u00E9.\nSi ce param\u00E8tre a la valeur 0, le connecteur attend ind\u00E9finiment.
TIMEOUT_LBL = D\u00E9lai d'expiration
SLEEP_DESC = Dur\u00E9e en secondes pendant laquelle le connecteur est en veille entre deux interrogations pour des changements.
SLEEP_LBL = Intervalle de mise en veille
ssl_label = Utilisation de SSL
ssl_desc = Permet d'\u00E9tablir des communications chiffr\u00E9es avec le serveur Domino
Localized.Start.Of.Data = D\u00E9but des donn\u00E9es
Localized.End.Of.Data = Fin des donn\u00E9es
Localized.Specific.date = Date sp\u00E9cifique
STATE_KEY_PERSIST_LBL = Persistance des cl\u00E9s d'\u00E9tat
STATE_KEY_PERSIST_DESC = D\u00E9termine le moment o\u00F9 l'\u00E9tat d'it\u00E9rateur est sauvegard\u00E9. Le param\u00E8tre recommand\u00E9 est Fin de cycle.
Localized.After.read = Apr\u00E8s lecture
Localized.End.of.cycle = Fin de cycle
Localized.Manual = Manuelle
Localized.IIOP = protocole IIOP
Localized.LocalClient = Client local
sort_label = Distribution tri\u00E9e
sort_desc = Si cette case est coch\u00E9e, les documents modifi\u00E9s sont distribu\u00E9s tri\u00E9s en fonction de la date de leur derni\u00E8re modification ; dans le cas contraire, les documents modifi\u00E9s sont distribu\u00E9s dans un ordre al\u00E9atoire.\n Si le nombre de documents modifi\u00E9s est \u00E9lev\u00E9, le tri peut ralentir les performances d' IBM Security Verify Directory Integrator .
Advanced = Avanc\u00E9
