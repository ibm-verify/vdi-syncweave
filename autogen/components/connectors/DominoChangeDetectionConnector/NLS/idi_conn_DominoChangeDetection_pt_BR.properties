CONN_DESC = Conector para detectar e recuperar altera\u00E7\u00F5es em um banco de dados Domino.
CONN_TITLE = Conector Domino Change Detection
SESSIONTYPE_DESC = Especifica se o Conector criar\u00E1 uma sess\u00E3o IIOP ou executar\u00E1 chamadas do Cliente Local
SESSIONTYPE_LBL = Tipo de Sess\u00E3o
DOMINOSERVERIP_DESC = O endere\u00E7o IP (ou nome do host) do Servidor Domino no qual reside o banco de dados que ser\u00E1 sondado em busca de altera\u00E7\u00F5es.
DOMINOSERVERIP_LBL = Endere\u00E7o IP do Servidor Domino
IOR_DESC = A cadeia IOR utilizada para criar a sess\u00E3o IIOP. Esse par\u00E2metro pode opcionalmente ser utilizado no lugar de solicitar esse valor do servidor Domino.
IOR_LBL = Cadeia IOR
HTTPPORT_DESC = A porta na qual a tarefa HTTP do Servidor Domino est\u00E1 sendo executada.
HTTPPORT_LBL = Porta HTTP
USERNAME_DESC = Nome de usu\u00E1rio para autentica\u00E7\u00E3o de sess\u00E3o. Este deve corresponder ao primeiro valor do campo "Nome do Usu\u00E1rio" do documento Pessoa desse usu\u00E1rio.
USERNAME_LBL = Nome de usu\u00E1rio
INTERNETPASSWORD_DESC = Senha do usu\u00E1rio para autentica\u00E7\u00E3o de sess\u00E3o. Esta deve corresponder ao campo "Senha da Internet" do documento Pessoa do usu\u00E1rio.
INTERNETPASSWORD_LBL = Senha
DATABASE_DESC = Nome de Arquivo do banco de dados Domino no qual ser\u00E1 efetuado poll de altera\u00E7\u00F5es, por exemplo "names.nsf".
DATABASE_LBL = Banco de Dados
SYSTEMSTOREKEY_DESC = Uma chave (que deve ser exclusiva) utilizada para manter controle da \u00FAltima altera\u00E7\u00E3o processada por este Conector.
SYSTEMSTOREKEY_LBL = Chave de Estado do Iterador
SYSTEMSTOREKEY_SCR_LBL = Excluir
SYSTEMSTOREKEY_SCR_HELP = Exclui informa\u00E7\u00F5es de Estado do Agente Iterativo
STARTAT_DESC = Tipo de condi\u00E7\u00E3o de in\u00EDcio. Esse par\u00E2metro s\u00F3 \u00E9 levado em conta quando o par\u00E2metro persistente especificado por "Chave de Estado do Agente Iterativo" est\u00E1 em branco ou n\u00E3o foi encontrado no Armazenamento do Sistema.
STARTAT_LBL = Iniciar em
STARTDATE_DESC = A dada de hora "desde". O Conector ir\u00E1 recuperar os documentos que foram alterados nesta data/hora ou ap\u00F3s.\nEste par\u00E2metro aceita os seguintes formatos de data/hora\:\n   yyyy-MM-dd HH\:mm\:ss.SSS\n   yyyy-MM-dd HH\:mm\:ss\n   yyyy-MM-dd\n\u00C9 considerado apenas quando o par\u00E2metro persistente especificado por "Iterator State Key"\nn\u00E3o for encontrado no Armazenamento do Sistema e o par\u00E2metro "Start At" for definido para "Specific date".
STARTDATE_LBL = Data Inicial (dd-MM-aaaa HH\:mm\:ss)
TIMEOUT_DESC = Especifica o n\u00FAmero m\u00E1ximo de segundos que o Conector aguarda pelo pr\u00F3ximo documento alterado.\nSe este par\u00E2metro for 0, o Conector aguarda continuamente.
TIMEOUT_LBL = Tempo Limite
SLEEP_DESC = Especifica por quantos segundos o conector fica inativo entre polls sucessivos de altera\u00E7\u00F5es.
SLEEP_LBL = Intervalo Inativo
ssl_label = Usar SSL
ssl_desc = Permite comunica\u00E7\u00F5es criptografadas com o servidor Domino
Localized.Start.Of.Data = In\u00EDcio dos Dados
Localized.End.Of.Data = Fim dos Dados
Localized.Specific.date = Data Espec\u00EDfica
STATE_KEY_PERSIST_LBL = Persist\u00EAncia de Chave de Estado
STATE_KEY_PERSIST_DESC = Determina quando o Estado do Agente Iterativo \u00E9 salvo. A configura\u00E7\u00E3o recomendada \u00E9 Fim do Ciclo.
Localized.After.read = Ap\u00F3s leitura
Localized.End.of.cycle = Final do ciclo
Localized.Manual = Manual
Localized.IIOP = IIOP
Localized.LocalClient = LocalClient
sort_label = Entregar Classificados
sort_desc = Se marcado, os documentos alterados ser\u00E3o entregues classificados pela data em que foram modificados pela \u00FAltima vez; caso contr\u00E1rio, os documentos alterados ser\u00E3o entregues em ordem aleat\u00F3ria..\n Se o n\u00FAmero de documentos alterados for grande, a classifica\u00E7\u00E3o poder\u00E1 reduzir o desempenho do SyncWeave .
Advanced = Avan\u00E7ado
