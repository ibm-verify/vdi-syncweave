CONN_DESC = Connector para detectar y recuperar los cambios en una base de datos Domino
CONN_TITLE = Conector de detecci\u00F3n de cambios de Domino
SESSIONTYPE_DESC = Especifica si el conector crear\u00E1 una sesi\u00F3n IIOP o realizar\u00E1 llamadas de cliente local
SESSIONTYPE_LBL = Tipo de sesi\u00F3n
DOMINOSERVERIP_DESC = Direcci\u00F3n IP (o nombre de host) del servidor Domino donde reside la base de datos que se sondear\u00E1 para comprobar si existen cambios.
DOMINOSERVERIP_LBL = Direcci\u00F3n IP del servidor Domino
IOR_DESC = La serie de IOR utilizada para crear la sesi\u00F3n de IIOP. Este par\u00E1metro se puede utilizar de forma opcional en lugar de solicitar este valor al servidor de Domino.
IOR_LBL = Serie de IOR
HTTPPORT_DESC = El puerto en el cual se ejecuta la tarea HTTP del servidor Domino
HTTPPORT_LBL = Puerto de HTTP
USERNAME_DESC = Nombre de usuario para la sesi\u00F3n de autenticaci\u00F3n. Debe coincidir con el primer valor del campo "Nombre de usuario" del documento de persona de ese usuario.
USERNAME_LBL = Nombre de usuario
INTERNETPASSWORD_DESC = Contrase\u00F1a de usuario para la sesi\u00F3n de autenticaci\u00F3n. Debe coincidir con el campo "Contrase\u00F1a de internet" del documento de persona del usuario.
INTERNETPASSWORD_LBL = Contrase\u00F1a
DATABASE_DESC = Nombre de archivo de la base de datos que se sondear\u00E1 para comprobar si existen cambios, por ejemplo "names.nsf".
DATABASE_LBL = Base de datos
SYSTEMSTOREKEY_DESC = Una clave (que deber\u00EDa ser exclusiva) utilizada para realizar el seguimiento del \u00FAltimo cambio procesado por este conector.
SYSTEMSTOREKEY_LBL = Clave de estado de iterador
SYSTEMSTOREKEY_SCR_LBL = Suprimir
SYSTEMSTOREKEY_SCR_HELP = Suprime la informaci\u00F3n de estado del iterador
STARTAT_DESC = Tipo de condici\u00F3n de inicio. Este par\u00E1metro solo se tiene en cuenta cuando el par\u00E1metro persistente especificado por "Clave de estado de iterador" est\u00E1 en blanco o no se encuentra en el almac\u00E9n del sistema.
STARTAT_LBL = Comenzar en
STARTDATE_DESC = Fecha y hora de inicio. El conector recuperar\u00E1 los documentos que se hayan cambiado en o a partir de esa fecha/hora.\nEste par\u00E1metro acepta los siguientes formatos de fecha/hora\:\n  yyyy-MM-dd HH\:mm\:ss.SSS\n  yyyy-MM-dd HH\:mm\:ss\n  yyyy-MM-dd\nSolo se tiene en cuenta cuando el par\u00E1metro especificado por "Clave de estado de iterador" est\u00E1 en blanco \no no se encuentra en el almac\u00E9n del sistema y el par\u00E1metro "Start At" se establece en "Fecha espec\u00EDfica".
STARTDATE_LBL = Fecha de inicio (aaaa-MM-dd HH\:mm\:ss)
TIMEOUT_DESC = Especifica el n\u00FAmero m\u00E1ximo de segundos que el conector espera al siguiente documento cambiado.\nSi este par\u00E1metro es 0, entonces el Conector espera siempre.
TIMEOUT_LBL = Tiempo de espera
SLEEP_DESC = Especificar el n\u00FAmero de segundos que el conector pasar\u00E1 inactivo entre sondeos sucesivos de cambios
SLEEP_LBL = Intervalo de inactividad
ssl_label = Utilizar SSL
ssl_desc = Habilita las comunicaciones cifradas con el servidor Domino
Localized.Start.Of.Data = Inicio de los datos
Localized.End.Of.Data = Fin de los datos
Localized.Specific.date = Fecha espec\u00EDfica
STATE_KEY_PERSIST_LBL = Permanencia de las claves de estado
STATE_KEY_PERSIST_DESC = Determina cuando se guarda el estado del iterador. El valor recomendado es Fin del ciclo.
Localized.After.read = Tras la lectura
Localized.End.of.cycle = Fin del ciclo
Localized.Manual = Manuales
Localized.IIOP = IIOP
Localized.LocalClient = Cliente local
sort_label = Entregar Ordenados
sort_desc = Si se selecciona, los documentos cambiados se entregan ordenados por la fecha en la que se modificaron por \u00FAltima vez; de lo contrario, los documentos cambiados se entregan en orden aleatorio.\n Si el n\u00FAmero de documentos cambiados es grande, la ordenaci\u00F3n podr\u00EDa ralentizar el rendimiento de SyncWeave .
Advanced = Avanzada
