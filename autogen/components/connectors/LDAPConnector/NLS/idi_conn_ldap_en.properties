RETURN_ATTRIB_DESC = List of attributes to return (one attribute per line). Empty  all
RETURN_ATTRIB_LABEL = Return attributes
SCRPT_TEST_LABEL = Test Script
SEARCH_BASE_DESC = Search base in directory. This parameter is only used in Iterator,Lookup,Update and Delete mode,\n but is visible in all modes to help with schema discovery.
