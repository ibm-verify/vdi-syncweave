PAGE_SIZE_DESC = When paging is used, the LDAP server will return a large data set as a sequence of smaller pieces called pages.\nThe page size specifies how many LDAP entries comprise a single page.\nSet the page size to zero to disable paging.\nNote that some LDAP servers do not support paging and will report an error if paging is enabled.
