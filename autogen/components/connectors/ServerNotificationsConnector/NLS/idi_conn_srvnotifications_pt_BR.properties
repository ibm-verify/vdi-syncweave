SNL_DI_AL_ALL_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.al.*'.
SNL_DI_AL_ALL_LABEL = Receber Todos os Eventos de Linha de Montagem
SNL_DI_AL_START_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.al.start'.
SNL_DI_AL_START_LABEL = Receber Eventos de In\u00EDcio da Linha de Montagem
SNL_DI_AL_STOP_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.al.stop'.
SNL_DI_AL_STOP_LABEL = Receber Eventos de Parada de Linha de Montagem
SNL_DI_SERVER_STOP_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.server.stop'.
