CONN_DESC = Um Conector capaz de atender ou emitir notifica\u00E7\u00F5es locais ou remotas da API do Servidor
SNL_CONN_TYPE_DESC = Especifica se o Conector atender\u00E1 ou emitir\u00E1 notifica\u00E7\u00F5es locais ou remotas da API do Servidor.
SNL_CONN_TYPE_LABEL = Tipo de Conex\u00E3o
SNL_URL_DESC = A URL usada para se conectar ao sistema remoto do Security Verify Directory Integrator Server (relevante apenas para ConnectionTyperemoto).
SNL_URL_LABEL = URL RMI
SNL_USERNAME_DESC = O nome do usu\u00E1rio que o Conector usa para autenticar no servidor Security Verify Directory Integrator.
SNL_USERNAME_LABEL = Nome de usu\u00E1rio
SNL_PASSWORD_DESC = A senha que o Conector usa para autenticar no servidor do Security Verify Directory Integrator.
SNL_PASSWORD_LABEL = Senha
SNL_CONFIG_INSTANCE_ID_DESC = Se especificado, o Conector relatar\u00E1 as notifica\u00E7\u00F5es que possuem o ID de Inst\u00E2ncia da Configura\u00E7\u00E3o especificada.
SNL_CONFIG_INSTANCE_ID_LABEL = ID da Inst\u00E2ncia de Configura\u00E7\u00E3o do Filtro
SNL_NOTIFICATION_ID_DESC = Se especificado, o Conector relatar\u00E1 as notifica\u00E7\u00F5es que possuem o ID de notifica\u00E7\u00E3o especificado.
SNL_NOTIFICATION_ID_LABEL = ID de Notifica\u00E7\u00E3o do Filtro
SNL_TIMEOUT_DESC = N\u00FAmero m\u00E1ximo de segundos para esperar que uma nova notifica\u00E7\u00E3o seja recebida (0 \= Aguardar para Sempre).
SNL_TIMEOUT_LABEL = Tempo Limite (segundos)
SNL_DI_ALL_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.*'.
SNL_DI_ALL_LABEL = Receber Todos os Eventos de API do Servidor
SNL_DI_CI_ALL_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.ci.*'.
SNL_DI_CI_ALL_LABEL = Receber Todos os Eventos de Inst\u00E2ncia de Configura\u00E7\u00E3o
SNL_DI_CI_START_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es de eventos 'di.ci.start'.
