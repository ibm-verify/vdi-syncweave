SNL_HAS_CUSTOM_NOTIFICATIONS_DESC = Se marcado, o Conector receber\u00E1 notifica\u00E7\u00F5es adicionais/customizadas especificadas no par\u00E2metro 'Custom Notification types'.
SNL_HAS_CUSTOM_NOTIFICATIONS_LABEL = Usar Notifica\u00E7\u00E3o Customizada
