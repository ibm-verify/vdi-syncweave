CONN_DESC = Un Connettore in grado di ascoltare o emettere notifiche API del server remoto o locale.
SNL_CONN_TYPE_DESC = Specifica se il Connettore ascolter\u00E0 o emetter\u00E0 le notifiche API del server locale o remoto.
SNL_CONN_TYPE_LABEL = Tipo di connessione
SNL_URL_DESC = L'URL utilizzato per connettersi al server Security Verify Directory Integrator remoto (rilevante solo per ConnectionTyperemoto).
SNL_URL_LABEL = URL RMI
SNL_USERNAME_DESC = Il nome utente che il connettore utilizza per autenticare il server Security Verify Directory Integrator.
SNL_USERNAME_LABEL = Nome utente
SNL_PASSWORD_DESC = La password utilizzata dal connettore per l'autenticazione sul server Security Verify Directory Integrator.
SNL_PASSWORD_LABEL = Password
SNL_CONFIG_INSTANCE_ID_DESC = Se specificata, il Connettore riporter\u00E0 solo le notifiche con l'ID istanza di configurazione specificato.
SNL_CONFIG_INSTANCE_ID_LABEL = Filtra ID istanza configurazione
SNL_NOTIFICATION_ID_DESC = Se specificata, il Connettore riporter\u00E0 solo le notifiche con l'ID di notifica specificato.
SNL_NOTIFICATION_ID_LABEL = Filtra ID di notifica
SNL_TIMEOUT_DESC = Numero massimo di secondi di attesa di una nuova notifica da ricevere (0 \= Attesa illimitata).
SNL_TIMEOUT_LABEL = Timeout (secondi)
SNL_DI_ALL_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.*'.
SNL_DI_ALL_LABEL = Ricevi tutti gli eventi API del server
SNL_DI_CI_ALL_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.ci.*'.
SNL_DI_CI_ALL_LABEL = Ricevi tutti gli eventi dell'istanza di configurazione
SNL_DI_CI_START_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.ci.start'.
SNL_DI_CI_START_LABEL = Ricevi eventi di avvio dell'istanza di configurazione
SNL_DI_CI_STOP_DESC = Se selezionata, il Connettore ricever\u00F2 le notifiche eventi 'di.ci.stop'.
SNL_DI_CI_STOP_LABEL = Ricevi eventi di arresto istanza di configurazione
SNL_DI_CI_FILE_UPDATED_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.ci.file.updated'.
SNL_DI_CI_FILE_UPDATED_LABEL = Ricevi eventi aggiornati di configurazione
SNL_DI_AL_ALL_DESC = Se selezionata, il Connettore ricever\u00F2 le notifiche eventi 'di.al.*'.
SNL_DI_AL_ALL_LABEL = Ricevi tutti gli eventi AssemblyLine
SNL_DI_AL_START_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.al.start'.
SNL_DI_AL_START_LABEL = Ricevi gli eventi di avvio AssemblyLine
SNL_DI_AL_STOP_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche eventi 'di.al.stop'.
SNL_DI_AL_STOP_LABEL = Ricevi gli eventi di arresto AssemblyLine
SNL_DI_SERVER_STOP_DESC = Se selezionata, il Connettore ricever\u00F2 le notifiche eventi 'di.server.stop'.
SNL_DI_SERVER_STOP_LABEL = Ricevi l'evento di chiusura del server
SNL_HAS_CUSTOM_NOTIFICATIONS_DESC = Se selezionata, il Connettore ricever\u00E0 le notifiche aggiuntive/personalizzate specificate nel parametro 'Tipi di notifica personalizzati'.
SNL_HAS_CUSTOM_NOTIFICATIONS_LABEL = Utilizza notifica personalizzata
SNL_CUSTOM_NOTIFICATIONS_DESC = I tipi di notifiche API del server aggiuntivi/personalizzati che il Connettore ascolter\u00E0. Ciascun tipo di notifica deve essere immessa in una riga a parte.
SNL_CUSTOM_NOTIFICATIONS_LABEL = Tipi di notifica personalizzata
