time_desc=En mode It\u00e9rateur, ce param\u00e8tre commande la dur\u00e9e d'attente du connecteur avant l'apparition de nouvelles lignes une fois la fin du fichier atteinte.\nEn outre, il indique la dur\u00e9e de tentative de verrouillage du fichier par le connecteur (si un verrouillage est sp\u00e9cifi\u00e9). Une valeur inf\u00e9rieure ou \u00e9gale \u00e0 z\u00e9ro (<= 0) signifie "Attente illimit\u00e9e".
