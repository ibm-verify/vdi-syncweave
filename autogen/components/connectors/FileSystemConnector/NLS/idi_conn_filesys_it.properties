time_desc=Per la modalit\u00e0 Iteratore, questo parametro controlla per quanto tempo il connettore attender\u00e0 che compaiano delle nuove righe dopo che \u00e8 stata raggiunta la EOF (end-of-file).\nEsso specifica inoltre per quanto tempo il connettore prover\u00e0 a bloccare il file (se \u00e8 specificato il blocco). Un valore minore di o uguale a zero (<= 0) significa "Attesa illimitata".
time_label=Timeout (in secondi)
append_desc=Accoda il file durante la scrittura, altrimenti sovrascrive.
