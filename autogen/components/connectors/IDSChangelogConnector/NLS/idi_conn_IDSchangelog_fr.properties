TIMEOUT_DESC=Nombre maximal de secondes avant la fin de fichier (0 = Attente illimit\u00e9e, sinon cette valeur doit \u00eatre sup\u00e9rieure \u00e0 l'intervalle de mise en veille). Notez \u00e9galement que si l'option Utiliser les notifications est s\u00e9lectionn\u00e9e, ce param\u00e8tre est ignor\u00e9.
