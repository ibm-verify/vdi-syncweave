CONN_TITLE=Connettore Changelog IBM Directory Server
CONN_DESC=Connettore Changelog IBM Directory Server
LDAPURL_DESC=URL al server LDAP con il nome host (o l'indirizzo IP) e la porta.
LDAPURL_LBL=URL
USERNAME_DESC=DN (Distinguished Name) per l'accesso (lasciare vuoto per l'accesso anonimo)
USERNAME_LBL=Nome utente di accesso
PASS_DESC=Password associata al nome utente di accesso
PASS_LBL=Password di accesso
AUTH_METHOD_DESC=Tipo di autenticazione LDAP
AUTH_METHOD_LBL=Metodo autenticazione
SSL_DESC=Utilizza layer di socket protetti per le comunicazioni con il server LDAP
SSL_LBL=Utilizza SSL
SEARCH_BASE_DESC=DN (Distinguished Name) per Changelog Base
SEARCH_BASE_LBL=Changelog Base
SEARCH_BASE_BTN_LBL=Esegui query
SEARCH_BASE_BTN_HLP=Esegue la query del server per individuare Changelog Base
EXTRA_PARAMS_DESC=Parametri provider JNDI aggiuntivi (nome:valore, uno per ciascuna riga)
EXTRA_PARAMS_LBL=Parametri provider extra
STATE_KEY_LBL=Chiave di stato iteratore
STATE_KEY_DESC=Una chiave (che deve essere univoca) utilizzata per tenere traccia dell'ultima modifica elaborata da questo connettore.
STATE_KEY_BTN_LBL=Elimina
STATE_KEY_BTN_HLP=Elimina le informazioni sullo stato dell'iteratore
CNUMBER_DESC=Si tratta del numero modifica per avviare la lettura, EOD indica la posizione alla fine del log modifica. Utilizzato solo quando lo stato dell'iteratore \u00e8 vuoto o non \u00e8 salvato.
CNUMBER_LBL=Avvia su
CNUMBER_BTN_LBL=Esegui query
CNUMBER_BTN_HLP=Esegue la query del server per individuare il primo e l'ultimo numero modifica.
STATE_KEY_PERSIST_LBL=Persistenza chiave stato
STATE_KEY_PERSIST_DESC=Determina quando viene salvato lo stato dell'iteratore. L'impostazione consigliata \u00e8 Fine del ciclo.
MERGE_MODE_DESC=Funzione utilizzata per controllare o migliorare il comportamento dell'unione dei connettori Changelog.
MERGE_MODE_LABEL=Modalit\u00e0 di unione
USE_NOTIFICATIONS_DESC=Selezionare per abilitare la notifica in tempo reale delle modifiche invece del polling. Se questa opzione \u00e8 abilitata, i parametri di intervallo di inattivit\u00e0 e di timeout vengono ignorati.
USE_NOTIFICATIONS_LBL=Utilizza notifiche
BATCH_DESC=Selezionare questa opzione per eseguire una ricerca o un richiamo impaginati delle modifiche (insieme al parametro Dimensione pagina); in caso contrario, le informazioni verranno richiamate in modo incrementale.
BATCH_LBL=Recupero del batch
PAGE_SIZE_LBL=Dimensioni pagina
PAGE_SIZE_DESC=Questo parametro specifica la dimensione delle pagina IDS in cui saranno restituite le voci (il valore predefinito \u00e8 500)
SLEEP_INTERVAL_DESC=Il numero di secondi tra ciascun poll. Nota: questo valore deve essere inferiore a quello dell'impostazione Timeout. Notare anche che se \u00e8 selezionata l'impostazione Utilizza notifiche, questo parametro viene ignorato.
SLEEP_INTERVAL_LBL=Intervallo inattivit\u00e0
TIMEOUT_DESC=Numero massimo di secondi prima della restituzione di EOF (0 = Attesa illimitata, altrimenti questo valore deve essere maggiore di Intervallo inattivit\u00e0). Notare anche che se \u00e8 selezionata l'impostazione Utilizza notifiche, questo parametro viene ignorato.
TIMEOUT_LBL=Timeout
