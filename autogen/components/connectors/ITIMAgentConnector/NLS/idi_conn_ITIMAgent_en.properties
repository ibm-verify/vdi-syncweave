CONN_DESC = Connector for interaction with ITIM Agents
CONN_TITLE = ITIM Agent Connector
AGENTURL_DESC = The URL used to connect to the ITIM Agent
AGENTURL_LBL = Agent URL
USERNAME_DESC = The username specified in the ITIM Agent configuration - used by the Connector to authenticate to the ITIM Agent
USERNAME_LBL = UserName
PASSWORD_DESC = The password specified in the ITIM Agent configuration - used by the Connector to authenticate to the ITM Agent
PASWORD_LBL = Password
CONNRETRYCOUNT_DESC = Specifies how many times to retry a failed connection (including initial connection attempt). If no value is specified the ITIM JNDI driver uses a default value of 3
CONNRETRYCOUNT_LBL = Connection Retry Count
SEARCH_FILTER_DESC = filter expression to use in Iterator mode; if no value is specified a default filter of "(objectclass\=*)" is used to return all Entries
SEARCH_FILTER_LBL = Search Filter
Advanced = Advanced
SBASE_LBL = Search Base
SBASE_DESCR = The basename to be used for searching
