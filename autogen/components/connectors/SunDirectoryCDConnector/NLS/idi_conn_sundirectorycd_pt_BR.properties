STATE_KEY_DESC=Uma chave (que deve ser exclusiva) utilizada para manter controle da \u00faltima altera\u00e7\u00e3o processada por este Conector.
STATE_KEY_BTN_LBL=Excluir
STATE_KEY_BTN_HLP=Exclui informa\u00e7\u00f5es de Estado do Agente Iterativo
CNUMBER_DESC=Este \u00e9 o changenumber para in\u00edcio da leitura. EOD significa posi\u00e7\u00e3o no fim do changelog. Utilizado somente quando o Estado do Agente Iterativo est\u00e1 em branco ou n\u00e3o foi salvo.
CNUMBER_LBL=Iniciar em
CNUMBER_BTN_LBL=Consulta
CNUMBER_BTN_HLP=Consulte o servidor para obter o primeiro e o \u00faltimo n\u00famero de altera\u00e7\u00e3o.
STATE_KEY_PERSIST_LBL=Persist\u00eancia de Chave de Estado
STATE_KEY_PERSIST_DESC=Determina quando o Estado do Agente Iterativo \u00e9 salvo. A configura\u00e7\u00e3o recomendada \u00e9 Fim do Ciclo.
MERGE_MODE_DESC=Recurso utilizado para controlar ou aprimorar o comportamento de mesclagem dos Conectores de Log de Mudan\u00e7as.
MERGE_MODE_LABEL=Modo de Mesclagem
USE_NOTIFICATIONS_DESC=Marque para ativar a notifica\u00e7\u00e3o das altera\u00e7\u00f5es em tempo real, em vez da sondagem. Se ativada, os par\u00e2metros de intervalo de espera e tempo limite ser\u00e3o ignorados.
USE_NOTIFICATIONS_LBL=Utilizar Notifica\u00e7\u00f5es
BATCH_DESC=Marque para executar procura/recupera\u00e7\u00e3o paginada de altera\u00e7\u00f5es (em conjunto com o par\u00e2metro Tamanho de P\u00e1gina); caso contr\u00e1rio, as informa\u00e7\u00f5es ser\u00e3o recuperadas de forma incremental.
BATCH_LBL=Recupera\u00e7\u00e3o em Batch
PAGE_SIZE_LBL=Tamanho da P\u00e1gina
PAGE_SIZE_DESC=Este par\u00e2metro especifica o tamanho das p\u00e1ginas IDS que retornar\u00e3o as entradas (o valor padr\u00e3o \u00e9 500)
SLEEP_INTERVAL_DESC=Tempo em segundos entre cada poll. Observe que este dever\u00e1 ser inferior \u00e0 configura\u00e7\u00e3o de Tempo Limite. Observe tamb\u00e9m que se Utilizar Notifica\u00e7\u00f5es estiver selecionado, esse par\u00e2metro ser\u00e1 ignorado.
SLEEP_INTERVAL_LBL=Intervalo Inativo
TIMEOUT_DESC=N\u00famero m\u00e1ximo de segundos antes de retornar o EOF (0 = Aguardar Indefinidamente; caso contr\u00e1rio, esse valor dever\u00e1 ser superior ao Intervalo de Espera). Observe tamb\u00e9m que se Utilizar Notifica\u00e7\u00f5es estiver selecionado, esse par\u00e2metro ser\u00e1 ignorado.
TIMEOUT_LBL=Tempo Limite
EVT_BASE_BTN_LBL=Contextos
EVT_BASE_BTN_HLP=Consultar servidor LDAP para obter uma lista de contextos de nomenclatura (se o servidor suportar)
