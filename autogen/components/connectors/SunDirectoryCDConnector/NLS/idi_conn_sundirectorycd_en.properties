CONN_TITLE = Sun Directory Change Detection Connector
CONN_DESC = Sun Directory Change Detection Connector
LDAPURL_DESC = The LDAP server host/port
LDAPURL_LBL = LDAP URL
USERNAME_DESC = Distinguished name for login (leave blank for anonymous)
USERNAME_LBL = Login username
PASS_DESC = Password associated with Login username
PASS_LBL = Login password
AUTH_METHOD_DESC = Type of LDAP authentication
AUTH_METHOD_LBL = Authentication Method
SSL_DESC = Check to use secure sockets layer for communication with LDAP server.
SSL_LBL = Use SSL
SEARCH_BASE_DESC = Distinguished name for changelog base or Notification Context for 'Realtime' Delivery mode
SEARCH_BASE_LBL = Changelog/Notifications Base
EXTRA_PARAMS_DESC = Additional JNDI provider parameters (name\:value one for each line)
EXTRA_PARAMS_LBL = Extra Provider Parameters
STATE_KEY_LBL = Iterator State Key
STATE_KEY_DESC = A key (which should be unique) used to keep track of the last change processed by this Connector.
STATE_KEY_BTN_LBL = Delete
STATE_KEY_BTN_HLP = Deletes Iterator State information
CNUMBER_DESC = This is the changenumber to start reading at, EOD means position at end of changelog. Only used when the Iterator State is blank or not saved.
CNUMBER_LBL = Start at
CNUMBER_BTN_LBL = Query
CNUMBER_BTN_HLP = Query server for the first and last change numbers.
STATE_KEY_PERSIST_LBL = State Key Persistence
STATE_KEY_PERSIST_DESC = Determines when Iterator State is saved. The recommended setting is End of Cycle.
MERGE_MODE_DESC = Feature used to control or enhance the Changelog Connectors merge behavior.
MERGE_MODE_LABEL = Merge mode
USE_NOTIFICATIONS_DESC = Check to enable real-time notification of changes instead of polling. If enabled then the sleep interval and timeout parameters are ignored.
USE_NOTIFICATIONS_LBL = Use Notifications
BATCH_DESC = Check to perform paged search/retrieval of changes (in conjunction with the Page Size parameter); Otherwise information is retrieved incrementally.
BATCH_LBL = Batch retrieval
PAGE_SIZE_LBL = Page Size
PAGE_SIZE_DESC = This parameter specifies the size of the pages IDS will return entries on (default value is 500)
SLEEP_INTERVAL_DESC = Number of seconds between each poll. Note that this should be less than the Timeout setting. Note also that if Use Notifications is selected, then this parameter is ignored.
SLEEP_INTERVAL_LBL = Sleep Interval
TIMEOUT_DESC = Max number of seconds before returning EOF (0 \= Wait Forever, otherwise this value should be greater than the Sleep Interval). Note also that if Use Notifications is selected, then this parameter is ignored.
TIMEOUT_LBL = Timeout
EVT_BASE_BTN_LBL = Contexts
EVT_BASE_BTN_HLP = Query LDAP server for a list of naming contexts (if server supports it)
DELIVERY_MODE_DESC = Specifies whether to use changelog or notifications entries
DELIVERY_MODE_LBL = Delivery Mode
Localized.After.read = After read
Localized.End.of.cycle = End of cycle
Localized.Manual = Manual
Localized.Anonymous = Anonymous
Localized.Simple = Simple
Localized.CRAM-MD5 = CRAM-MD5
Localized.SASL = SASL
Localized.EOD = EOD
Localized.Changelog = Changelog
Localized.Realtime = Realtime
Localized.DefaultMerge = Merge changelog and changed data
Localized.OnlyChanges = Return only changed data
Localized.BothSeparated = Return both
Advanced = Advanced
