STATE_KEY_BTN_LBL=Suprimir
STATE_KEY_BTN_HLP=Suprime la informaci\u00f3n de estado del iterador
CNUMBER_DESC=Es es el n\u00famero de cambio en el que se empezar\u00e1 a leer, EOD significa la posici\u00f3n al final del registro de cambios. Solo se utiliza cuando el estado del iterador est\u00e1 en blanco o no se ha guardado.
