USE_NOTIFICATIONS_DESC=Seleccione esta opci\u00f3n para habilitar la notificaci\u00f3n de cambios en tiempo real en vez del sondeo. Si se habilita, los par\u00e1metros intervalo de inactividad y tiempo de espera se ignorar\u00e1n.
