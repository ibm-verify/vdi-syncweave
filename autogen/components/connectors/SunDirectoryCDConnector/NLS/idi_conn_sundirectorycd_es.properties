BATCH_DESC=Selecci\u00f3nelo para realizar la b\u00fasqueda/recuperaci\u00f3n paginada de modificaciones (en conjunci\u00f3n con el par\u00e1metro Page Size); si no se selecciona, la informaci\u00f3n se recupera de forma incremental.
BATCH_LBL=Recuperaci\u00f3n de lotes
PAGE_SIZE_LBL=Tama\u00f1o de p\u00e1gina
PAGE_SIZE_DESC=Tama\u00f1o de las p\u00e1ginas sobre las que IDS devolver\u00e1 entradas (el valor predeterminado es 500).
SLEEP_INTERVAL_DESC=N\u00famero de segundos entre cada sondeo. Tenga en cuenta que este valor debe ser inferior al valor del Tiempo de espera. Tenga en cuenta que, si la opci\u00f3n Utilizar notificaciones est\u00e1 seleccionada, este par\u00e1metro se ignorar\u00e1.
SLEEP_INTERVAL_LBL=Intervalo de inactividad
TIMEOUT_DESC=M\u00e1ximo de segundos para devolver el c\u00f3digo EOF (0 = esperar indefinidamente, de lo contrario, este valor debe ser mayor que el intervalo de inactividad) Tenga en cuenta que, si la opci\u00f3n Utilizar notificaciones est\u00e1 seleccionada, este par\u00e1metro se ignorar\u00e1.
TIMEOUT_LBL=Tiempo de espera
