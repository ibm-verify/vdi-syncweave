startat_desc=Especificar un valor de USN de inicio; "EOD" significa que s\u00f3lo se notifican los cambios nuevos.\nS\u00f3lo se tiene en cuenta cuando el par\u00e1metro especificado por "Clave de estado de iterador" est\u00e1 en blanco \no no se encuentra en el almac\u00e9n del sistema. 
