timeout_label=Tiempo de espera
timeout_desc=M\u00e1ximo de segundos para devolver el c\u00f3digo EOF (0 = esperar indefinidamente, de lo contrario, este valor debe ser mayor que el intervalo de inactividad). Tenga en cuenta que, si la opci\u00f3n Utilizar notificaciones est\u00e1 seleccionada, este par\u00e1metro se ignorar\u00e1.
sleep_label=Intervalo de inactividad
sleep_desc=N\u00famero de segundos entre cada sondeo. Tenga en cuenta que este valor debe ser inferior al valor del Tiempo de espera. Tenga en cuenta que, si la opci\u00f3n Utilizar notificaciones est\u00e1 seleccionada, este par\u00e1metro se ignorar\u00e1.
