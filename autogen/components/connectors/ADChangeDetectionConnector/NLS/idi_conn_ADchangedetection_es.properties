pagesize_label=Tama\u00f1o de p\u00e1gina
pagesize_desc=Especifica el n\u00famero de entradas por p\u00e1gina que devolver\u00e1 esta solicitud (el valor predeterminado es 500).
isk_label=Clave de estado de iterador
