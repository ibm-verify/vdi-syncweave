sleep_label=Intervalo Inativo
sleep_desc=Tempo em segundos entre cada poll. Observe que este dever\u00e1 ser inferior \u00e0 configura\u00e7\u00e3o de Tempo Limite. Observe tamb\u00e9m que se Utilizar Notifica\u00e7\u00f5es estiver selecionado, esse par\u00e2metro ser\u00e1 ignorado.
