CONN_DESC=Connettore di rilevamento modifiche per Microsoft Active Directory mediante LDAP
CONN_TITLE=Connettore di rilevamento modifiche Active Directory
auth_desc=Tipo di autenticazione LDAP
auth_label=Metodo autenticazione
pass_desc=Password associata al nome utente di accesso
pass_label=Password di accesso
url_desc=URL al servizio LDAP per Active Directory (nome host AD o indirizzo IP, seguito dalla porta LDAP)
url_label=URL
user_desc=DN (Distinguished Name) LDAP per l'accesso (lasciare vuoto per l'accesso anonimo)
user_label=Nome utente di accesso
search_label=Base ricerca LDAP
search_desc=Collegamento alla directory per eseguire il polling per le modifiche (vale a dire, "dc=yourdomain,dc=com"). Deve essere un contesto di denominazione.
search_script_help=Esegue la query di Active Directory per individuare i contesti di denominazione
search_script_label=Esegui query
pagesize_label=Dimensioni pagina
pagesize_desc=Specifica il numero di voci per pagina restituito da questa richiesta (il valore predefinito \u00e8 500).
isk_label=Chiave di stato iteratore
isk_desc=Una chiave (che deve essere univoca) utilizzata per tenere traccia dell'ultima modifica elaborata da questo connettore.
isk_script_label=Elimina
isk_script_help=Elimina le informazioni sullo stato dell'iteratore
startat_label=Avvia su
startat_desc=Specificare un valore USN di avvio; "EOD" significa che viene effettuato un report solo delle nuove modifiche.\nTenuto presente solo quando il parametro specificato da "Chiave di stato iteratore" \u00e8 vuoto o non viene trovato\nnell'Archivio di sistema. 
usessl_desc=Assicurarsi di utilizzare Secure Sockets Layer per la comunicazione con Active Directory
usessl_label=Utilizza SSL
timeout_label=Timeout
timeout_desc=Numero massimo di secondi prima della restituzione di EOF (0 = Attesa illimitata, altrimenti questo valore deve essere maggiore di Intervallo inattivit\u00e0). Notare anche che se \u00e8 selezionata l'impostazione Utilizza notifiche, questo parametro viene ignorato.
sleep_label=Intervallo inattivit\u00e0
sleep_desc=Il numero di secondi tra ciascun poll. Nota: questo valore deve essere inferiore a quello dell'impostazione Timeout. Notare anche che se \u00e8 selezionata l'impostazione Utilizza notifiche, questo parametro viene ignorato.
Localized.Simple=Semplice
Localized.Anonymous=Anonimo
Localized.SASL=SASL
Localized.EOD=EOD
JNDI_XTRA_PROVIDER_DESC=Parametri provider JNDI aggiuntivi (nome:valore, uno per ciascuna riga)
JNDI_XTRA_PROVIDER_LABEL=Parametri provider extra
BIN_ATTRIB_DESC=Elenco di attributi considerati come binari (un attributo per riga)
BIN_ATTRIB_LABEL=Attributi binari
STATE_KEY_PERSIST_LBL=Persistenza chiave stato
STATE_KEY_PERSIST_DESCR=Determina quando viene salvato lo stato dell'iteratore. L'impostazione consigliata \u00e8 Fine del ciclo.
USE_NOTIFICATIONS_DESC=Selezionare per abilitare la notifica in tempo reale delle modifiche invece del polling. Se questa opzione \u00e8 abilitata, i parametri di intervallo di inattivit\u00e0 e di timeout vengono ignorati.
USE_NOTIFICATIONS_LBL=Utilizza notifiche
Localized.After.read=Dopo la lettura
Localized.End.of.cycle=Fine del ciclo
Localized.Manual=Manuale
Advanced=Avanzate
