CONN_DESC=Connector, der f\u00fcr lokale oder ferne JMX-Benachrichtigungen empfangsbereit ist und diese berichten kann (entsprechend der JMX Remote API 1.0-Spezifikation)
JMX_MODE_DESC=Gibt an, ob der Connector f\u00fcr lokale oder ferne JMX-Benachrichtigungen empfangsbereit ist und diese berichten kann (entsprechend der JMX Remote API 1.0-Spezifikation).
JMX_MODE_LABEL=Modus
JMX_URL_DESC=F\u00fcr die Herstellung der Verbindung zum fernen JMX-System verwendete URL. Diese URL wird beim Start vom fernen MBeanServer registriert.
JMX_URL_LABEL=URL f\u00fcr fernes JMX
JMX_ALLMBEANS_DESC=Wenn diese Option ausgew\u00e4hlt wird, ist der Connector f\u00fcr Benachrichtigungen empfangsbereit, die von einer beliebigen registrierten MBean ausgegeben werden.
JMX_ALLMBEANS_LABEL=F\u00fcr alle MBeans empfangsbereit
JMX_MBEANTYPES_DESC=Eine Liste mit Namen von MBean-Objekten, die die MBeans angeben, f\u00fcr die der Connector eine Registrierung durchf\u00fchrt, um Benachrichtigungen zu empfangen. Die vollst\u00e4ndig qualifizierten Namen der MBean-Objekte sind erforderlich. Geben Sie jeden MBean-Objektnamen in einer separaten Zeile ein.
JMX_MBEANTYPES_LABEL=MBeans, f\u00fcr die der Connector empfangsbereit sein soll
JMX_EVENTTYPES_DESC=Die JMX-Benachrichtigungstypen, f\u00fcr die der JMX-Connector empfangsbereit sein soll. Benachrichtigungen, deren Typ nicht angegeben wird, werden vom Connector nicht gemeldet. Jeder Benachrichtigungstyp muss in einer separaten Zeile eingegeben werden.
JMX_EVENTTYPES_LABEL=Benachrichtigungstypen
CONN_TITLE=JMX-Connector
