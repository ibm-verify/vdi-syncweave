CONN_DESC=Un Connettore capace di ascoltare ed eseguire il report delle notifiche JMX locali o remote (come per la specifica JMX Remote API 1.0)
JMX_MODE_DESC=Specifica se il Connettore ascolta le notifiche JMX locali o remote (come per la specifica JMX Remote API 1.0).
JMX_MODE_LABEL=Modalit\u00e0
JMX_URL_DESC=L'URL utilizzato per connettersi al sistema JMX remoto. Questo URL \u00e8 registrato dal MBeanServer all'avvio.
JMX_URL_LABEL=URL JMX remoto
JMX_ALLMBEANS_DESC=Se selezionata, il Connettore ascolta le notifiche emesse da qualunque MBean registrato.
JMX_ALLMBEANS_LABEL=Ascolta tutti gli MBean
JMX_MBEANTYPES_DESC=Un elenco di nomi degli oggetti MBean, che specifica l'MBeans che il Connettore registrer\u00e0 per le notifiche. Sono richiesti i nomi completi dell'oggetto MBean. Immettere ciascun nome dell'oggetto MBean in una riga a parte.
JMX_MBEANTYPES_LABEL=MBean che ascoltano
JMX_EVENTTYPES_DESC=I tipi di notifiche JMX ascoltate dal Connettore JMX. Le notifiche i cui tipi non sono specificati, non verranno riportate dal Connettore. Ciascun tipo di notifica deve essere immessa in una riga a parte.
JMX_EVENTTYPES_LABEL=Tipi di notifica
CONN_TITLE=Connettore JMX
