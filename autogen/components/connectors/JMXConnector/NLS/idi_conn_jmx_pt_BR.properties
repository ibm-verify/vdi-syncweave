CONN_DESC=Um Conector capaz de atender e relatar notifica\u00e7\u00f5es JMX locais ou remotas (conforme especifica\u00e7\u00e3o API 1.0 JMX Remota)
JMX_MODE_DESC=Especifica se o Conector atender\u00e1 as notifica\u00e7\u00f5es JMX locais ou remotas (confirma especifica\u00e7\u00e3o API 1.0 JMX Remota).
JMX_MODE_LABEL=Modo
JMX_URL_DESC=A URL utilizada para se conectar ao sistema JMX remoto. Essa URL \u00e9 registrada pelo MBeanServer remoto na inicializa\u00e7\u00e3o.
JMX_URL_LABEL=JMX URL Remota
JMX_ALLMBEANS_DESC=Se marcado, o Conector atender\u00e1 as notifica\u00e7\u00f5es emitidas por qualquer MBean registrado.
JMX_ALLMBEANS_LABEL=Atender a todos os MBeans
JMX_MBEANTYPES_DESC=Uma lista de nomes de objetos de MBean, que especificam os MBeans que o Conector registrar\u00e1 para notifica\u00e7\u00f5es. Os nomes de objetos MBean completos s\u00e3o requeridos. Digite cada nome de objeto MBean em uma linha separada.
JMX_MBEANTYPES_LABEL=MBeans aos quais atender
JMX_EVENTTYPES_DESC=Os tipos de notifica\u00e7\u00f5es JMX que o Conector JMX atender\u00e1. As notifica\u00e7\u00f5es cujos tipos n\u00e3o s\u00e3o especificados n\u00e3o ser\u00e3o relatados pelo Conector. Cada tipo de notifica\u00e7\u00e3o deve ser digitado em uma linha separada.
JMX_EVENTTYPES_LABEL=Tipos de Notifica\u00e7\u00e3o
CONN_TITLE=Conector JMX
