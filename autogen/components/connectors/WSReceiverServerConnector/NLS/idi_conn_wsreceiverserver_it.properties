CONN_DESC = Connettore server del destinatario servizio Web
CONN_TITLE = Connettore server del destinatario servizio Web
TP_DESC = Il numero di porta su cui \u00E8 in esecuzione (in ascolto) il server
TP_LBL = Porta TCP
IT_LBL = Immetti messaggio SOAP come
IT_DESC = Specifica il tipo dell'input del messaggio di richiesta SOAP a AssemblyLine
RXT_LBL = Restituisci messaggio SOAP come
RXT_DESC = Specifica il tipo di output del messaggio di risposta SOAP da AssemblyLine
US_DESC = Se selezionato, il server accetter\u00E0 solo connessioni SSL (https)
US_LBL = Utilizza SSL
WTGFN_LBL = Output WSDL a Nomefile
WTGFN_DESC = Il nome del file WSDL da generare quando si fa clic sul pulsante "Genera WSDL"
WSL_LBL = URL provider del servizio Web
WSL_DESC = L'indirizzo su cui i client del server Web inviano le richieste del servizio Web
RGWSB_SCRLBL = Genera WSDL
RGWSB_SCRHLP = Se si fa clic su questo pulsante, il programma di utilit\u00E0 genera un file WSDL.
ALERT_WFGS = File WSDL generato correttamente.
Localized.String = Stringa
Localized.DOMElement = Elemento DOM
REQUIRE_CLIENT_AUTHENTICATION = Richiedi autenticazione client
