CONN_DESC=Connector f\u00fcr die Verarbeitung ankommender E-Mails
MAIL_SERVER_DESC=Adresse des POP/IMAP-Mail-Servers (z. B. Hostname oder IP-Adresse)
MAIL_SERVER_LABEL=Mail-Server
MAIL_USESSL_DESC=Wenn diese Option ausgew\u00e4hlt wird, verwendet der Connector SSL-Verbindungen. Andernfalls verwendet der Connector Nicht-SSL-Verbindungen.
MAIL_USESSL_LABEL=SSL verwenden
MAIL_USER_DESC=Der Benutzername, den der Connector f\u00fcr die Authentifizierung beim Mail-Server verwendet.
MAIL_USER_LABEL=Benutzername
MAIL_PASSWORD_DESC=Das Kennwort, das der Connector f\u00fcr die Authentifizierung beim Mail-Server verwendet.
MAIL_PASSWORD_LABEL=Kennwort
MAIL_FOLDER_DESC=Der Name des Mailordners des Benutzers auf dem Mail-Server. F\u00fcr POP3 ist nur INBOX zul\u00e4ssig. F\u00fcr IMAP kann ein beliebiger, auf dem Mail-Server vorhandener Mailordner verwendet werden.
MAIL_FOLDER_LABEL=Mailordner
MAIL_CREATE_FOLDER_DESC=Automatische Erstellung des angegebenen Ordners im AddOnly-Modus, falls er nicht bereits vorhanden ist.
MAIL_CREATE_FOLDER_LABEL=Ordner erstellen
MAIL_GET_SUBFOLDER_DESC=Legt fest, ob der Connector die Unterordner des angegebenen Ordners durchl\u00e4uft.
MAIL_GET_SUBFOLDER_LABEL=Unterordner verwenden
MAIL_EXCLUDE_FOLDER_DESC=Durch Kommas getrennte Liste mit Ordnern, die beim Durchlaufen der Mailbox ausgeschlossen werden. Hinweis: Ein Ordner, der als Wert f\u00fcr den Parameter 'mailFolder' angegeben ist, kann nicht ausgeschlossen werden.
MAIL_EXCLUDE_FOLDER_LABEL=Ordner ausschlie\u00dfen
MAIL_PROTOCOL_DESC=Das E-Mail-Protokoll, das zur Kommunikation mit dem Mail-Server verwendet werden soll.
MAIL_PROTOCOL_LABEL=W-Mail-Protokoll
MAIL_POLLINTERVAL_DESC=Zeitraum in Sekunden, w\u00e4hrend dessen der Connector inaktiv ist, bevor er einen Sendeaufruf zur Abfrage neuer E-Mail-Nachrichten an den Mail-Server absetzt. Den Wert -1 angeben, wenn Sie m\u00f6chten, dass der Connector die Mailbox durchgeht und beendet wird, ohne einen erneuten Sendeaufruf abzusetzen.
MAIL_POLLINTERVAL_LABEL=Sendeaufrufintervall (Sekunden)
CONN_TITLE=Mailbox-Connector
