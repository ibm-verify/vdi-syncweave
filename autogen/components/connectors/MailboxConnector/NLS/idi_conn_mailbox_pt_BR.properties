CONN_DESC=Um Conector para processar e-mails de entrada
MAIL_SERVER_DESC=O endere\u00e7o do servidor de correio pop/imap (por exemplo, nome do host ou endere\u00e7o ip)
MAIL_SERVER_LABEL=Servidor de Correio
MAIL_USESSL_DESC=Quando marcado, o Conector utiliza conex\u00f5es SSL. Quando desmarcado, o Conector utiliza conex\u00f5es n\u00e3o-SSL.
MAIL_USESSL_LABEL=Usar SSL
MAIL_USER_DESC=O nome do usu\u00e1rio que o Conector utiliza para se autenticar ao servidor de correio.
MAIL_USER_LABEL=Nome de usu\u00e1rio
MAIL_PASSWORD_DESC=A senha que o Conector utiliza para se autenticar ao servidor de correio.
MAIL_PASSWORD_LABEL=Senha
MAIL_FOLDER_DESC=O nome da pasta de correio do usu\u00e1rio no servidor de correio. Para POP3 apenas INBOX \u00e9 permitido. Para IMAP, escolha qualquer pasta de correio existente no servidor de correio.
MAIL_FOLDER_LABEL=Pasta de Correio
MAIL_CREATE_FOLDER_DESC=Criar automaticamente pasta especificada no modo Addonly, caso ela n\u00e3o exista.
MAIL_CREATE_FOLDER_LABEL=Criar Pasta
MAIL_GET_SUBFOLDER_DESC=Define se o Conector faz itera\u00e7\u00e3o por meio das subpastas da pasta especificada.
MAIL_GET_SUBFOLDER_LABEL=Obter subpastas
MAIL_EXCLUDE_FOLDER_DESC=Apresenta uma lista separada por v\u00edrgulas de pastas que \u00e9 exclu\u00edda ao iterar na caixa de correio. Nota: no caso de uma pasta ser especificada como um valor para o par\u00e2metro "mailFolder", ela n\u00e3o poder\u00e1 ser exclu\u00edda.
MAIL_EXCLUDE_FOLDER_LABEL=Excluir pastas
MAIL_PROTOCOL_DESC=O protocolo de correio a ser utilizado para comunica\u00e7\u00e3o com o servidor de correio.
MAIL_PROTOCOL_LABEL=Protocolo de Correio
MAIL_POLLINTERVAL_DESC=A quantidade de segundos na qual o Conector ficar\u00e1 em suspens\u00e3o antes do polling do servidor de correio para novas mensagens de correio. Configure como -1 se voc\u00ea precisar que o Conector percorra atrav\u00e9s da caixa de correios e termine sem executar o polling novamente.
MAIL_POLLINTERVAL_LABEL=Intervalo de Poll (segundos)
CONN_TITLE=Conector Mailbox
Localized.pop3=pop3
Localized.imap=imap
Advanced=Avan\u00e7ado
