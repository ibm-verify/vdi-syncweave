CONN_DESC=Un Connettore per l'elaborazione delle e-mail in entrata
MAIL_SERVER_DESC=L'indirizzo del server di posta pop/imap (ad es. nome host o indirizzo IP)
MAIL_SERVER_LABEL=Server di posta
MAIL_USESSL_DESC=Quando selezionata, il Connettore utilizza le connessioni SSL. Quando \u00e8 deselezionata, il Connettore utilizza connessioni non SSL.
MAIL_USESSL_LABEL=Utilizza SSL
MAIL_USER_DESC=Il nome utente che il Connettore utilizza per l'autenticazione con il server di posta.
MAIL_USER_LABEL=Nome utente
MAIL_PASSWORD_DESC=La password che il Connettore utilizza per l'autenticazione con il server di posta.
MAIL_PASSWORD_LABEL=Password
MAIL_FOLDER_DESC=Il nome della cartella di posta dell'utente sul server di posta. \u00c8 consentito solo per la casella di posta IN ARRIVO POP3. Per IMAP scegliere una cartella di posta esistente sul server di posta.
MAIL_FOLDER_LABEL=Cartella principale
MAIL_CREATE_FOLDER_DESC=Creare automaticamente la cartella specificata per la modalit\u00e0 Addonly, nel caso in cui non esista.
MAIL_CREATE_FOLDER_LABEL=Crea cartella
MAIL_GET_SUBFOLDER_DESC=Definisce se il connettore esegue l'iterazione attraverso le sottocartelle della cartella specificata.
MAIL_GET_SUBFOLDER_LABEL=Ottieni sottocartelle
MAIL_EXCLUDE_FOLDER_DESC=Presenta un elenco separato da virgole di cartelle escluse quando si esegue un'iterazione sulla casella postale. Nota: se una cartella viene specificata come un valore per il parametro "mailFolder", non \u00e8 possibile escluderla.
MAIL_EXCLUDE_FOLDER_LABEL=Escludi cartelle
MAIL_PROTOCOL_DESC=Il protocollo di posta da utilizzare per la comunicazione con il server di posta.
MAIL_PROTOCOL_LABEL=Protocollo di posta
MAIL_POLLINTERVAL_DESC=La quantit\u00e0 di secondi in cui il Connettore sar\u00e0 in attesa prima di eseguire il polling del server di posta per i nuovi messaggi di posta. Impostare su -1 se \u00e8 necessario che il Connettore passi attraverso la casella di posta e sia terminato senza eseguire di nuovo il polling.
MAIL_POLLINTERVAL_LABEL=Intervallo di polling (secondi)
CONN_TITLE=Connettore della casella di posta
Localized.pop3=pop3
Localized.imap=imap
Advanced=Avanzate
