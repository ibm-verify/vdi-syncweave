CONN_DESC=Connecteur charg\u00e9 de traiter les messages \u00e9lectroniques entrants
MAIL_SERVER_DESC=Adresse du serveur de courrier POP/IMAP (par exemple, nom d'h\u00f4te ou adresse IP)
MAIL_SERVER_LABEL=Serveur de courrier
MAIL_USESSL_DESC=Lorsque cette option est s\u00e9lectionn\u00e9e, le connecteur utilise les connexions SSL. Si cette option n'est pas s\u00e9lectionn\u00e9e, le connecteur utilise des connexions autres que SSL.
MAIL_USESSL_LABEL=Utilisation de SSL
MAIL_USER_DESC=Nom d'utilisateur que le connecteur utilise pour s'authentifier aupr\u00e8s du serveur de courrier.
MAIL_USER_LABEL=Nom d'utilisateur
MAIL_PASSWORD_DESC=Mot de passe que le connecteur utilise pour s'authentifier aupr\u00e8s du serveur de courrier.
MAIL_PASSWORD_LABEL=Mot de passe
MAIL_FOLDER_DESC=Nom du dossier de courrier de l'utilisateur sur le serveur de courrier. Pour POP3, seul INBOX est autoris\u00e9. Pour IMAP, s\u00e9lectionnez un dossier de courrier existant sur le serveur de courrier.
MAIL_FOLDER_LABEL=Dossier de courrier
MAIL_CREATE_FOLDER_DESC=Cr\u00e9e automatiquement le dossier sp\u00e9cifi\u00e9 pour le mode Ajout uniquement s'il n'existe pas.
MAIL_CREATE_FOLDER_LABEL=Cr\u00e9er un dossier
MAIL_GET_SUBFOLDER_DESC=Indique si le connecteur it\u00e8re via les sous-dossiers du dossier sp\u00e9cifi\u00e9.
MAIL_GET_SUBFOLDER_LABEL=Obtenir des sous-dossiers
MAIL_EXCLUDE_FOLDER_DESC=Pr\u00e9sente une liste de dossiers s\u00e9par\u00e9s par des virgules, exclus lors de l'it\u00e9ration sur la bo\u00eete aux lettres. Remarque : dans le cas o\u00f9 un dossier est sp\u00e9cifi\u00e9 en tant que valeur pour le param\u00e8tre "mailFolder", il ne peut pas \u00eatre exclu.
MAIL_EXCLUDE_FOLDER_LABEL=Exclure des dossiers
MAIL_PROTOCOL_DESC=Protocole de messagerie permettant de communiquer avec le serveur de courrier.
MAIL_PROTOCOL_LABEL=Protocole de messagerie
MAIL_POLLINTERVAL_DESC=Temps en secondes pendant lequel le connecteur se met en veille avant d'interroger le serveur de courrier pour obtenir les nouveaux messages \u00e9lectroniques. Indiquez la valeur -1 si vous souhaitez que le connecteur v\u00e9rifie la bo\u00eete aux lettres et s'arr\u00eate sans effectuer de nouvelle interrogation.
MAIL_POLLINTERVAL_LABEL=Intervalle d'interrogation (en secondes)
CONN_TITLE=Connecteur Bo\u00eete aux lettres
Localized.pop3=pop3
Localized.imap=imap
Advanced=Avanc\u00e9
