CONN_DESC=Conector para procesar correos electr\u00f3nicos de entrada
MAIL_SERVER_DESC=La direcci\u00f3n del servidor de correo pop/imap (por ejemplo, nombre_sistema_principal o direcci\u00f3n_ip)
MAIL_SERVER_LABEL=Servidor de correo
MAIL_USESSL_DESC=Cuando se selecciona esta opci\u00f3n, el conector utiliza conexiones SSL. Cuando no se selecciona, el conector utiliza conexiones no SSL.
MAIL_USESSL_LABEL=Utilizar SSL
MAIL_USER_DESC=Nombre de usuario que el conector utiliza para autenticarse en el servidor de correo.
MAIL_USER_LABEL=Nombre de usuario
MAIL_PASSWORD_DESC=Contrase\u00f1a que el conector utiliza para autenticarse en el servidor de correo.
MAIL_PASSWORD_LABEL=Contrase\u00f1a
MAIL_FOLDER_DESC=Nombre de la carpeta de correo del usuario en el servidor de correo. Para POP3 s\u00f3lo est\u00e1 permitido INBOX. Para IMAP, elija la carpeta de correo existente en el servidor de correo.
MAIL_FOLDER_LABEL=Carpeta de correo
MAIL_CREATE_FOLDER_DESC=Crear autom\u00e1ticamente la carpeta especificada para el modo Solo adici\u00f3n (Addonly), en caso de que no exista.
MAIL_CREATE_FOLDER_LABEL=Crear carpeta
MAIL_GET_SUBFOLDER_DESC=Define si el conector realiza una iteraci\u00f3n a trav\u00e9s de las subcarpetas de la carpeta especificada.
MAIL_GET_SUBFOLDER_LABEL=Obtener subcarpetas
MAIL_EXCLUDE_FOLDER_DESC=Presenta una lista separada por comas de carpetas que se excluye cuando se realiza la iteraci\u00f3n en el buz\u00f3n. Nota: In case a si se ha especificado una carpeta como un valor del par\u00e1metro "mailFolder", no se puede excluir.
MAIL_EXCLUDE_FOLDER_LABEL=Excluir carpetas
MAIL_PROTOCOL_DESC=Protocolo de correo que se debe utilizar para comunicar con el servidor de correo.
MAIL_PROTOCOL_LABEL=Protocolo de correo
MAIL_POLLINTERVAL_DESC=Segundos durante los que el conector estar\u00e1 inactivo antes de sondear al servidor de correo para comprobar si hay nuevos mensajes de correo. Establ\u00e9zcalo en -1 si necesita que el conector pase por el buz\u00f3n y acabe sin volver a realizar el sondeo.
MAIL_POLLINTERVAL_LABEL=Intervalo entre sondeos (segundos)
CONN_TITLE=Conector de buz\u00f3n
