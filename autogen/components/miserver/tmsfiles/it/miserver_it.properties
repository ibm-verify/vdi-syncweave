RS.USAGE.IBMDISERVER = Utilizzo\: ibmdisrv [OPTION]...\nLe opzioni consentite sono\:\n-c < file ...> File di configurazione. Il caricamento di più file richiede l'opzione -d.\n-d Eseguire in modalità daemon\n-d close Esegue in modalità daemon e chiude l'output standard e l'errore standard quando si è pronti ad accettare i comandi\n-e Avviare il Server in modalità sicura.\n-f <extProp1\=file1,extProp2\=file2 ...> File di proprietà esterni.\n-g Crea i file della directory della soluzione ed esce.\n-i Ignora il file delle proprietà globali e legge dal file delle proprietà della soluzione.\n-j < file> Leggi le informazioni sulla regressione AssemblyLine dal file indicato.\n-k Ignora la voce di lavoro durante la lettura o la scrittura delle informazioni di regressione.\n-l < file ...> Reindirizza l'output della Console al file di log specificato.\n-n < Codifica> Codifica da utilizzare durante la scrittura dei file di configurazione.\n-p Eseguire il dump delle proprietà java all'avvio.\n-\
    q < mode> mode\=1 Esegui in modalità di registrazione, mode\=2 Esegui in modalità di riproduzione, mode\=4 Esegui in modalità di simulazione\n-r < al ...> Elenco di nomi AssemblyLine da avviare. Per avviare AssemblyLine a e b, utilizzare il comando -r a b.\n-s < dir> Specifica la directory di lavoro in cui si trova la soluzione. Deve essere la prima opzione.\n-v Mostra le informazioni sulla versione ed esce. Viene registrato solo nel file di log.\n-w Attendere il completamento di ciascun AssemblyLine prima di avviare il successivo.\n-D Disabilita l'avvio degli AssemblyLinesavviati automaticamente.\n-J < file> Scrive le informazioni sulla regressione AssemblyLine nel file indicato.\n-M Non apportare modifiche ai sistemi esterni. (a.k.a. Modalità simulazione)\n-P < password> Password se il file di configurazione è codificato.\n-R Disabilitare l'API remota, ignorando l'impostazione in global.properties.\n-T Abilita registrazione delle prestazioni\n-W Non terminare mai il server\n-X \
    Avviare Derby Network Server e uscire\n-Y Arresta Derby Network Server ed esce\n-?            Questo messaggio\nDa -0 a -9 per i parametri definiti dall'utente\n
