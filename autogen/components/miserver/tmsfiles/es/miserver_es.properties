RS.USAGE.IBMDISERVER = Uso\: ibmdisrv [OPCIÓN]...\nLas opciones permitidas son\:\n-c < archivo ... > Archivos de configuración. La carga de varios archivos requiere la opción -d.\n-d Ejecutar en modalidad de daemon\n-d close Ejecutar en modalidad de daemon y cerrar salida estándar y error estándar cuando esté preparado para aceptar mandatos\n-e Iniciar el servidor en modo seguro.\n-f <extProp1\=file1,extProp2\=file2 ... > Archivos de propiedades externas.\n-g Crear archivos de directorio de solución y salir.\n-i Ignorar archivo de propiedades globales y leer del archivo de propiedades de la solución.\n-j < archivo> Leer la información de regresión AssemblyLine del archivo con nombre.\n-k Ignorar la entrada de trabajo al leer o escribir información de regresión.\n-l < archivo ... > Redirigir la salida de la consola al archivo de registro especificado.\n-n < encoding> Codificación que se utilizará al escribir archivos de configuración.\n-p Volcar propiedades java al iniciar.\n-q < \
    mode> mode\=1 Ejecutar en modalidad de registro, mode\=2 Ejecutar en modalidad de reproducción, mode\=4 Ejecutar en modalidad de simulación\n-r < al ... > Lista de nombres de AssemblyLine para iniciar. Para iniciar AssemblyLine a y b, utilice el mandato -r a b.\n-s < dir> Especifica el directorio de trabajo donde se encuentra la solución. Debe ser la primera opción.\n-v Mostrar información de versión y salir. Sólo se registra en el archivo de registro.\n-w Espere a que cada AssemblyLine se complete antes de iniciar la siguiente.\n-D Inhabilitar el inicio de AssemblyLinesde inicio automático.\n-J < file> Escribir la información de regresión AssemblyLine en el archivo con nombre.\n-M No hacer modificaciones en los sistemas externos. (a.k.a. Modo de simulación)\n-P < contraseña> Contraseña si el archivo de configuración está cifrado.\n-R Inhabilitar API remota, ignorando el valor en global.properties.\n-T Habilitar registro de rendimiento\n-W No terminar nunca el servidor\n-X \
    Iniciar Derby Network Server y salir\n-Y Detener Derby Network Server y salir\n-?            Este mensaje\n-0 a -9 para parámetros definidos por el usuario\n
