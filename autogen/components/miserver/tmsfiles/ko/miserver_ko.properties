RS.USAGE.IBMDISERVER = 사용법\: ibmdisrv [OPTION]...\n허용되는 옵션은 다음과 같습니다.\n-c <file ... > 구성 파일. 여러 파일을 로드하려면 -d 옵션이 필요합니다.\n-d 디먼 모드에서 실행\n-d 디먼 모드에서 실행을 닫고 명령을 승인할 준비가 되면 표준 출력 및 표준 오류 닫기\n-e 보안 모드에서 서버를 시작한다.\n-f <extProp1 \= file1,extProp2 \= file2 ... > 외부 특성 파일.\n-g 솔루션 디렉토리 파일을 작성하고 종료하십시오.\n-i 글로벌 특성 파일을 무시하고 솔루션 특성 파일에서 읽습니다.\n-j <file> 이름 지정된 파일에서 AssemblyLine 회귀 정보를 읽습니다.\n-k 회귀 정보를 읽거나 쓸 때 작업 항목을 무시합니다.\n-l <file ... > 콘솔 출력을 지정된 로그 파일로 재지정합니다.\n-n <encoding> 구성 파일을 작성할 때 사용되는 인코딩입니다.\n-p 시작 시 덤프 자바 특성.\n-q <mode> mode\= 1레코드 모드에서 실행, mode\= 2재생 모드에서 실행, mode\= 4시뮬레이션 모드에서 실행\n-r <al ... > 시작할 AssemblyLine 이름 목록입니다. a및 b AssemblyLine을 시작하려면 a b 명령을 사용한다.\n-s <dir> 솔루션이 있는 작업 디렉토리를 지정합니다. 첫 번째 옵션이어야 합니다.\n-v 버전 정보를 표시하고 종료합니다. 이는 로그 파일에만 로그됩니다.\n-다음에 시작하기 전에 각 AssemblyLine이 완료될 때까지 대기하십시오.\n-D 자동 시작된 AssemblyLines를 시작할 수 없습니다.\n-J <file> AssemblyLine 회귀 정보를 이름 지정된 파일에 기록합니다.\n-M 외부 시스템을 수정하지 않습니다. (a.k.a. 시뮬레이션 모드)\n-P <password> 구성 파일이 암호화된 경우 비밀번호입니다.\n-R global.properties의 \
    설정을 무시하고 원격 API를 사용하지 않는다.\n-T 성능 로깅 사용\n-W 서버를 종료하지 않음\n-X Derby Network Server 시작 및 종료\n-Y Derby Network Server 중지 및 종료\n-?            이 메시지\n -0--9 사용자 정의 매개변수에 대해
