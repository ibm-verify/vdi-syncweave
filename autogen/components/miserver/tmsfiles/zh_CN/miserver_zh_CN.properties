RS.USAGE.IBMDISERVER = 用法：ibmdisrv [OPTION]...\n允许的选项为\:\n-c 《文件 ...》配置文件。 装入多个文件需要 -d 选项。\n-d 以守护程序方式运行\n-d 关闭守护程序方式下的运行，并在准备好接受命令时关闭标准输出和标准错误\n-e 以安全方式启动服务器。\n-f <extProp1\=file1,extProp2\=file2 ...》外部属性文件。\n-g 创建解决方案目录文件并退出。\n-i 忽略全局属性文件并从解决方案属性文件中读取。\n-j <file> 从指定文件读取 AssemblyLine 回归信息。\n-k 在读取或写入回归信息时忽略工作项。\n-l 《文件 ...》将控制台输出重定向到指定的日志文件。\n-n <encoding> 编写配置文件时要使用的编码。\n-p 在启动时转储 Java 属性。\n-q <mode> mode\=1 以记录方式运行， mode\=2 在回放方式下运行， mode\=4 以模拟方式运行\n-r 《 al ...》要启动的 AssemblyLine 名称列表。 要启动 AssemblyLine a 和 b ，请使用命令 -r a b。\n-s <dir> 指定解决方案所在的工作目录。 必须是第一个选项。\n-v 显示版本信息并退出。 这仅记录在日志文件中。\n-w 等待每个组装流水线在启动下一步之前完成。\n-D 禁用自动启动的 AssemblyLine 的启动。\n-J <file> 将 AssemblyLine 回归信息写入指定的文件。\n-M 对外部系统不进行修改。 ( a.k.a . 模拟方式)\n-P <password> 密码 ( 如果配置文件已加密) 。\n-R 禁用远程 API，忽略 global.properties中的设置。\n-T 启用性能日志记录\n-W 从不终止服务器\n-X 启动 Derby Network Server 并退出\n-Y 停止 Derby 网络服务器并退出\n- ?            此消息\n-0 到 -9  用户定义的参数
