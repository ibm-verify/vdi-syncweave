RS.USAGE.IBMDISERVER = 使用法\: ibmdisrv [OPTION]...\n使用できるオプションは以下のとおりです。\n-c < file ...> 構成ファイル。 複数のファイルをロードするには、-d オプションが必要です。\n-d デーモン・モードで実行\n-d close デーモン・モードで実行し、コマンドを受け入れる準備ができたら標準出力および標準エラーをクローズします。\n-e セキュア・モードでサーバーを始動します。\n-f <extProp1\=file1,extProp2\=file2 ...> 外部プロパティー・ファイル。\n-g ソリューション・ディレクトリー・ファイルを作成して終了します。\n-i グローバル・プロパティー・ファイルを無視し、ソリューション・プロパティー・ファイルから読み取ります。\n-j < file> 指定されたファイルから AssemblyLine リグレッション情報を読み取ります。\n-k リグレッション情報の読み取りまたは書き込み時に作業項目を無視します。\n-l < file ...> コンソール出力を指定されたログ・ファイルにリダイレクトします。\n-n < encoding> 構成ファイルの書き込み時に使用されるエンコード。\n-p 始動時に Java プロパティーをダンプします。\n-q < mode> mode\=1 記録モードで実行、 mode\=2 再生モードで実行、 mode\=4 シミュレート・モードで実行\n-r < al ...> 開始する AssemblyLine 名のリスト。 AssemblyLine a および b を開始するには、コマンド -r a b を使用します。\n-s < dir> ソリューションが配置されている作業ディレクトリーを指定します。 最初のオプションでなければなりません。\n-v バージョン情報を表示して終了します。 これはログ・ファイルにのみ記録されます。\n-w 各 AssemblyLine が完了するのを待ってから、次の AssemblyLine を開始してください。\n-D 自動開始された AssemblyLinesの開始を無効にします。\n-J < file> 指定されたファイルに AssemblyLine リグレッション情報を\
    書き込みます。\n-M 外部システムに変更を加えません。 (a.k.a. シミュレーション・モード)\n-P < password> 構成ファイルが暗号化されている場合はパスワード。\n-R Remote API を無効にします。 global.propertiesの設定を無視します。\n-T パフォーマンス・ロギングを有効にする\n-W サーバーを終了しない\n-X Derby Network Server を開始して終了します\n-Y Derby ネットワーク・サーバーを停止して終了します\n-?            このメッセージは、\nユーザー定義パラメーターの場合は -0 から -9\n
