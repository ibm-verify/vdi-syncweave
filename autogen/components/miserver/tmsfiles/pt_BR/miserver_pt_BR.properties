RS.USAGE.IBMDISERVER = Uso\: ibmdisrv [OPTION]...\nAs opções permitidas são\:\n-c < file ...> Arquivos de Configuração Carregar vários arquivos requer a opção -d.\n-d Executar no modo daemon\n-d close Executar no modo daemon e fechar a saída padrão e o erro padrão quando pronto para aceitar comandos\n-e Iniciar o Servidor no modo seguro\n-f <extProp1\=file1,extProp2\=file2 ...> Arquivos de propriedades externas.\n-g Criar arquivos do diretório de solução e sair\n-i Ignorar o arquivo de propriedades globais e ler a partir do arquivo de propriedades da solução\n-j < file> Ler informações de regressão da AssemblyLine do arquivo nomeado.\n-k Ignore a entrada de trabalho ao ler ou gravar informações de regressão\n-l < file ...> Redirecionar a saída do Console para o arquivo de log especificado\n-n < encoding> A codificação a ser usada ao gravar arquivos de configuração..\n-p Propriedades Java de dump na inicialização.\n-q < mode> mode\=1 Executar no modo de registro, mode\=2 Executar no \
    modo de reprodução, mode\=4 Executar no modo de simulação\n-r < al ...> Lista de nomes de AssemblyLine para iniciar. Para iniciar a AssemblyLine a e b, use o comando -r a b.\n-s < dir> Especifica o diretório ativo onde a solução está localizada. Deve ser a primeira opção.\n-v Mostrar informações sobre a versão e sair Isso é registrado apenas no arquivo de log\n-w Aguarde a conclusão de cada AssemblyLine antes de iniciar o próximo.\n-D Desativar a inicialização de AssemblyLinesiniciadas automaticamente\n-J < file> Gravar informações de regressão AssemblyLine no arquivo nomeado.\n-M Não faça modificações nos sistemas externos. (a.k.a. Modo de simulação)\n-P < password> Senha, se o arquivo de configuração estiver criptografado\n-R Desativar API remota, ignorando a configuração em global.properties.\n-T Ativar criação de log de Desempenho\n-W Nunca finalizar o servidor\n-X Inicie o Derby Network Server e saia\n-Y Parar o Derby Network Server e sair\n-?            Esta mensagem\n-0 a \
    -9 para parâmetros definidos pelo usuário\n
