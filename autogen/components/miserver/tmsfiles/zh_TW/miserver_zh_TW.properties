RS.USAGE.IBMDISERVER = 用法：ibmdisrv [OPTION]...\n容許的選項為：\n-c  <file ...> Configuration files. 載入多個檔案需要 -d 選項。\n-d 在常駐程式模式下執行\n-d 關閉以常駐程式模式執行，並在準備好接受指令時關閉標準輸出和標準錯誤\n-e 在安全模式下啟動伺服器。\n-f <extProp1\=file1，extProp2\=file2 ...> 外部內容檔。\n-g 建立解決方案目錄檔案並結束。\n-i 忽略廣域內容檔，並從解決方案內容檔中讀取。\n-j <file> 從具名檔案讀取 AssemblyLine 迴歸資訊。\n-k 在讀取或寫入迴歸資訊時忽略工作項目。\n-l <file ...> Redirect Console output to specified log file.\n-n <encoding> 寫入配置檔時要使用的編碼。\n-p 啟動時傾出 java 內容。\n-q <mode> mode\=1 Run in record mode， mode\=2 Run in playback mode， mode\=4 Run in 模擬 mode\n-r <al ...> 要啟動的 AssemblyLine 名稱清單。 若要啟動 AssemblyLine a 及 b，請使用指令 -r a b。\n-s <dir> 指定解決方案所在的工作目錄。 必須是第一個選項。\n-v 顯示版本資訊並結束。 這僅記載在日誌檔中。\n-w 等待每一個 AssemblyLine 完成，然後再啟動下一個。\n-D 停用自動啟動 AssemblyLine 的啟動。\n-J <file> 將 AssemblyLine 迴歸資訊寫入至指定的檔案。\n-M 不修改外部系統。 （ a.k.a . Simulation Mode）\n-P <password> 如果配置檔已加密，則密碼。\n-R  停用遠端 API，忽略 global.properties 中的設定。\n-T  啟用效能記載\n-W  絕不終止伺服器\n-X  啟動 Derby 網路伺服器並結束\n-Y   停止 Derby 網路伺服器並結束\n- ?            此訊息\n-0   到 -9 代表使用者定義的參數\n
