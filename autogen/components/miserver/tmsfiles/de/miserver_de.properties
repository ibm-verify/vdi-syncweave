RS.USAGE.IBMDISERVER = Syntax\: ibmdisrv [OPTION]...\nZulässige Optionen\:\n-c < Datei ... > Konfigurationsdateien. Für das Laden mehrerer Dateien ist die Option -d erforderlich.\n-d Im Dämonmodus ausführen\n-d close Im Dämonmodus ausführen und Standardausgabe und Standardfehlerausgabe schließen, wenn Befehle akzeptiert werden\n-e Server im sicheren Modus starten.\n-f <extProp1\=file1,extProp2\=file2 ... > Externe Eigenschaftendateien.\n-g Lösungsverzeichnisdateien erstellen und beenden.\n-i Globale Eigenschaftendatei ignorieren und aus Lösungseigenschaftendatei lesen.\n-j < Datei> Lesen Sie die Informationen zur AssemblyLine -Regression aus der benannten Datei.\n-k Arbeitseintrag beim Lesen oder Schreiben von Regressionsinformationen ignorieren.\n-l < Datei ... > Umleiten der Konsolenausgabe an die angegebene Protokolldatei.\n-n < Codierung> Codierung, die beim Schreiben von Konfigurationsdateien verwendet werden soll.\n-p Speicherauszug der Java-Eigenschaften beim Start erstellen.\
    \n-q < Modus> mode\=1 Im Aufzeichnungsmodus ausführen, mode\=2 Im Wiedergabemodus ausführen, mode\=4 Im Simulationsmodus ausführen\n-r < al ... > Liste der Namen der zu startenden AssemblyLine . Verwenden Sie zum Starten der AssemblyLine a und b den Befehl -r a b.\n-s < Verzeichnis> Gibt das Arbeitsverzeichnis an, in dem sich die Lösung befindet Muss erste Option sein.\n-v Versionsinformationen anzeigen und beenden. Dies wird nur in der Protokolldatei protokolliert.\n-w Warten Sie, bis jede AssemblyLine abgeschlossen ist, bevor Sie die nächste Fertigungslinie starten.\n-D Start automatisch gestarteter AssemblyLinesinaktivieren.\n-J < Datei> AssemblyLine -Regressionsinformationen in die benannte Datei schreiben.\n-M Keine Änderungen an den externen Systemen vornehmen. (a.k.a. Simulationsmodus)\n-P < Kennwort> Kennwort, wenn die Konfigurationsdatei verschlüsselt ist.\n-R Remote API inaktivieren und die Einstellung in global.propertiesignorieren.\n-T Leistungsprotokollierung \
    aktivieren\n-W Server nie beenden\n-X Derby Network Server starten und beenden\n-Y Derby Network Server stoppen und beenden\n-?            Diese Nachricht\n-0 bis -9 für benutzerdefinierte Parameter\n
