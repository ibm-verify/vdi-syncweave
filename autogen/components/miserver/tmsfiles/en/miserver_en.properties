RS.USAGE.IBMDISERVER=Usage: ibmdisrv [OPTION]...\nAllowable options are:\n-c <file ...> Configuration files. Loading multiple files requires the -d option.\n-d            Run in daemon mode\n-d close      Run in daemon mode, and close standard output and standard error when ready to accept commands\n-e            Start the Server in secure mode.\n-f <extProp1=file1,extProp2=file2 ...> External property files.\n-g            Create solution directory files and exit.\n-i            Ignore global properties file and read from solution properties file.\n-j <file>     Read AssemblyLine regression info from the named file.\n-k            Ignore the work Entry when reading or writing regression info.\n-l <file ...> Redirect Console output to specified log file.\n-n <encoding> Encoding to be used when writing configuration files.\n-p            Dump java properties on startup.\n-q <mode>     mode=1 Run in record mode, mode=2 Run in playback mode, mode=4 Run in simulate mode\n-r <al ...>   List of AssemblyLine names to start. To start AssemblyLine a and b, use the command -r a b.\n-s <dir>      Specifies the working directory where the solution is located. Must be first option.\n-v            Show version information and exit. This is logged only in the logfile.\n-w            Wait for each AssemblyLine to complete before starting the next.\n-D            Disable startup of auto-started AssemblyLines.\n-J <file>     Write AssemblyLine regression info to the named file.\n-M            Make no modifications on the external systems. (a.k.a. Simulation Mode)\n-P <password> Password if configuration file is encrypted.\n-R            Disable Remote API, ignoring the setting in global.properties.\n-T            Enable Performance logging\n-W            Never terminate the server\n-X            Start Derby Network Server and exit\n-Y            Stop Derby Network Server and exit\n-?            This message\n-0 to -9      for user-defined parameters\n
