RS.USAGE.IBMDISERVER = Syntaxe \: ibmdisrv [OPTION]...\nLes options autorisées sont les suivantes\:\n-c < fichier ... > Fichiers de configuration. Le chargement de plusieurs fichiers requiert l'option -d.\n-d Exécution en mode démon\n-d ferme l'exécution en mode démon et ferme la sortie standard et l'erreur standard lorsque vous êtes prêt à accepter les commandes\n-e Démarrez le serveur en mode sécurisé.\n-f <extProp1\=file1,extProp2\=file2 ... > Fichiers de propriétés externes.\n-g Créez des fichiers de répertoire de solution et quittez.\n-i Ignore le fichier de propriétés globales et le lit à partir du fichier de propriétés de la solution.\n-j < fichier> Lisez les informations de régression AssemblyLine à partir du fichier nommé.\n-k Ignorer l'entrée work lors de la lecture ou de l'écriture des informations de régression.\n-l < fichier ... > Réacheminer la sortie de la console vers le fichier journal spécifié.\n-n < encoding> Codage à utiliser lors de l'écriture des fichiers de \
    configuration.\n-p Vidage des propriétés Java au démarrage.\n-q < mode> mode\=1 Exécution en mode enregistrement, mode\=2 Exécution en mode lecture, mode\=4 Exécution en mode simulation\n-r < al ... > Liste des noms de AssemblyLine à démarrer. Pour démarrer AssemblyLine a et b, utilisez la commande -r a b.\n-s < dir> Indique le répertoire de travail dans lequel se trouve la solution. Doit être la première option.\n-v Afficher les informations de version et quitter. Il est consigné uniquement dans le fichier journal.\n-w Attendez la fin de chaque AssemblyLine avant de démarrer la suivante.\n-D Désactive le démarrage des AssemblyLinesdémarrées automatiquement.\n-J < fichier> Ecrit les informations de régression AssemblyLine dans le fichier nommé.\n-M N'apportez aucune modification aux systèmes externes. (a.k.a. Mode simulation)\n-P < mot_de_passe> Mot de passe si le fichier de configuration est chiffré.\n-R Désactive l'API distante en ignorant le paramètre dans global.properties.\
    \n-T Activer la consignation des performances\n-W Ne jamais arrêter le serveur\n-X Démarrage du serveur de réseau Derby et sortie\n-Y Arrêter Derby Network Server et quitter\n-?            Ce message\n-0 à -9 pour les paramètres définis par l'utilisateur\n
