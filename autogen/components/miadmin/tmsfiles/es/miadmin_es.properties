FDS.help = Ayuda
FDS.welcome1 = Bienvenido a Federated Directory Server. Utilice este panel de control para configurar los recursos necesarios para crear y gestionar el entorno de servidor de directorios federado.
FDS.welcome2 = El servidor de directorios federado aborda varios desafíos de empresa, incluidos los siguientes escenarios típicos\:
FDS.welcome3 = Las identidades y las contraseñas de usuario se encuentran en varios directorios existentes. El servidor de directorios federado permite que otros sistemas se autentiquen a través del mismo y acceder a los demás sistemas como si estuvieran en un único entorno.
FDS.welcome4 = Los datos sobre gente se reparten entre varios sistemas, incluidos los orígenes que no están en directorios LDAP. El servidor de directorios federado agrupa esta información en una única vista consolidada de la empresa.
FDS.welcome5 = Configurar el destino
FDS.welcome6 = El primer paso es configurar los valores de conexión para IBM Security Directory Server de destino, que es el repositorio centralizado principal del servidor de directorios federado.
FDS.welcome7 = Configurar puntos finales
FDS.welcome8 = Los puntos finales son los directorios y los orígenes de datos existentes que es necesario federar y sincronizar. Al añadir un nuevo punto final, se le mostrará una selección de posibles tipos de puntos finales. Elija el tipo correcto y rellene los parámetros para el punto final.
FDS.welcome9 = Crear flujos
FDS.welcome10 = Los flujos definen las relaciones entre puntos finales y el servidor de directorios federado. Los flujos pueden ser bastante simples, aunque también pueden configurarse con mucho detalle. Después de crear un flujo, puede añadir una planificación para ejecutar a intervalos específicos y aplicar la correlación de atributos personalizados. Otras prestaciones se describen en la siguiente sección.
FDS.welcome11 = Características avanzadas
FDS.welcome12 = La autenticación de paso a través permite a los usuarios autenticarse delegando la autenticación a un servidor LDAP de punto final. Cuando un usuario se registra en un servidor de directorios federado, reconoce que el usuario existe en uno de los puntos finales y luego solicita al punto final que verifique las credenciales.
FDS.welcome13 = Correlaciones de atributos
FDS.welcome14 = Las correlaciones de atributos definen la cantidad de información que debe recopilar el servidor de directorios federado de los puntos finales. Si es necesario, los datos pueden modificarse mediante la transformación cuando se cuando se introduce en el servidor de directorios federado.
FDS.welcome15 = Un flujo puede unir datos de un punto final con datos de otro punto final. Por ejemplo, una base de datos puede contener información sobre personas, que no está disponible en un directorio LDAP. Al unir el directorio LDAP con la base de datos, el servidor de directorios federado puede mostrar datos más abundantes sobre las personas.
FDS.preConfigureSDS = El primer paso es configurar IBM Security Directory Server. Pulse en Valores de conexión para acceder al panel de configuración.
FDS.preConfigureEP = Los puntos finales definen dónde se ubican los datos. Añada como mínimo un punto final antes de continuar. Pulse Añadir en el panel Puntos finales.
FDS.preConfigureFlow = Un flujo define la relación entre los puntos finales y el Servidor de directorios. Un flujo simple conecta el punto final con el Servidor de directorios, pero también puede unir datos de un punto final con datos de otro punto final. Por ejemplo, una base de datos puede contener información sobre personas, que no está disponible en un directorio LDAP. Al unir el directorio LDAP con la base de datos, el servidor de directorios federado puede mostrar datos más abundantes sobre las personas.
FDS.loginSubtitle = Especifique su información
FDS.inactivityMessage = Tenga en cuenta que, después de algún tiempo de inactividad, el sistema finalizará la sesión automáticamente y le solicitará que vuelva a iniciarla.
FDS.loginCopyright = Materiales bajo licencia-Propiedad de IBM Corp, IBM Corporation y otro (s) 2015, 2023. IBM es una marca registrada de IBM Corporation, en Estados Unidos o en otros países.
FDS.runMigrateTitle = Sincronización inicial
FDS.runMigrateInfo = Selecciona todas las entradas en los puntos finales que coinciden con los criterios de flujo y actualiza el servidor de directorios como corresponde.
FDS.runSyncTitle = Sincronización incremental
FDS.runSyncInfo = Actualiza el servidor de directorios basándose en los cambios realizados en el punto final.\nSe puede añadir una planificación a este flujo para que se ejecute periódicamente.
FDS.runSimulateTitle = Simular
FDS.runSimulateInfo = Lleva a cabo la misma acción que Sincronización inicial, pero no escribe nada en el servidor de directorios. Es útil en la fase de planificación inicial para verificar que el flujo puede seleccionar el subconjunto de datos correcto en el punto final.
FDS.terminateConfirm = Esto terminará el flujo (cualquier planificación activa podrá reiniciar el flujo)
FDS.writeBack = Reescritura
FDS.writeBackInfo = Al habilitar la reescritura los cambios se propagarán al punto final de origen en este flujo. Sólo los cambios realizados en las entradas de persona que son destinos de este flujo son candidatos para la reescritura.
FDS.writeBackMap = Seleccionar qué atributos reescribir en el punto final de origen
