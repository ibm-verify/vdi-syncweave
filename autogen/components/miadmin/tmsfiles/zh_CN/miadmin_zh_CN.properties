FDS.welcome6 = 第一步是为目标 IBM Security Directory Server 配置连接设置，该 IBM Security Directory Server 是 Federated Directory Server 的核心集中化存储库。
FDS.welcome7 = 配置端点
FDS.welcome8 = 端点是需要联合并同步的现有目录和数据源。 当添加新端点时，将为您提供一组可能的端点类型供选择。 请为端点选择正确的参数。
FDS.welcome9 = 创建流
FDS.welcome10 = 流定义端点和 Federated Directory Server 之间关系。 流可以是很简单的，但是也可以是高度配置的。 在创建了流之后，可以添加调度以指定时间间隔运行并应用定制属性映射。 其他功能会在下一个部分中进行描述。
FDS.welcome11 = 高级功能部件
FDS.welcome12 = 传递认证使用户可以通过将认证委派给端点 LDAP 服务器进行认证。 当用户登录到 Federated Directory Server 时，服务器会识别出该用户存在于某个端点中，然后会要求端点验证凭证。
FDS.welcome13 = 属性映射
FDS.welcome14 = 属性映射定义 Federated Directory Server 必须从端点处收集到的信息量。 如果需要，当 Federated Directory Server 收集数据时，数据可以在转换过程中被修改。
FDS.welcome15 = 流可以将一个端点中的数据与另一个端点中的数据连接起来。 例如，某个数据库可能包含有关人员的信息，但是这些数据在 LDAP 目录不可用。 通过将 LDAP 目录与该数据库进行连接，Federated Directory Server 可以显示有关人员的更丰富的信息。
FDS.preConfigureSDS = 首先配置 IBM Security Directory Server。 单击“连接设置”可进入配置面板。
FDS.preConfigureEP = 端点用于定义数据所在的位置。 继续前，请至少添加一个端点。 单击“端点”面板中的“添加”。
FDS.preConfigureFlow = 流用于定义端点与目录服务器之间的关系。 简单流用于连接端点和目录服务器，但流还可以将某个端点中的数据与另一端点中的数据连接起来。 例如，某个数据库可能包含有关人员的信息，但是这些数据在 LDAP 目录不可用。 通过将 LDAP 目录与该数据库进行连接，Federated Directory Server 可以显示有关人员的更丰富的信息。
FDS.loginSubtitle = 请输入您的信息
FDS.inactivityMessage = 请注意，如果一段时间处于不活动状态，那么系统会注销您的帐号并提示您重新登录。
