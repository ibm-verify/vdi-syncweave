FDS.help = Ajuda
FDS.welcome1 = Bem-vindo ao Federated Directory Server. Use esse painel para configurar os recursos necessários para criar e gerenciar o ambiente do Federated Directory Server.
FDS.welcome2 = O Federated Directory Server endereça vários desafios de negócios, incluindo os cenários típicos a seguir\:
FDS.welcome3 = Há identidades do usuário e senhas em vários diretórios existentes. O Federated Directory Server permite que outros sistemas autentiquem por meio dele e cheguem aos outros sistemas como se fossem um único ambiente.
FDS.welcome4 = Os dados sobre pessoas são difundidos em diversos sistemas, incluindo origens que não são diretórios LDAP. O Federated Directory Server extrai essas informações em conjunto para uma única visualização consolidada da empresa.
FDS.welcome5 = Configurar o destino
FDS.welcome6 = A primeira etapa é configurar as configurações de conexão para o IBM Security Directory Server de destino, que é o repositório centralizado principal para o Fderated Directory Server.
FDS.welcome7 = Configurar terminais
FDS.welcome8 = Os terminais são os diretórios e origens de dados existentes que precisam ser federados e sincronizados. Quando você inclui um novo terminal, uma seleção de tipos de terminais possíveis lhe é apresentada. Escolha o tipo adequado e preencha os parâmetros para o terminal.
FDS.welcome9 = Criar fluxos
FDS.welcome10 = Os fluxos definem os relacionamentos entre os terminais e o Federated Directory Server. Os fluxos podem ser bem simples, mas também podem ser altamente configurados. Depois de criar um fluxo, é possível incluir um planejamento para ser executado em intervalos específicos e aplicar o mapeamento de atributo customizado. Outros recursos são descritos na próxima seção.
FDS.welcome11 = Recursos avançados
FDS.welcome12 = A Autenticação de Passagem permite que os usuários sejam autenticados delegando autenticação para um servidor LDAP de terminal. Quando um usuário efetua login no Federated Directory Server, ele reconhece que o usuário existe em um dos terminais e, então, solicita ao terminal para verificar as credenciais.
FDS.welcome13 = Mapas de atributo
FDS.welcome14 = Os mapas de atributos definem a quantia de informações que o Federated Directory Server deve coletar dos terminais. Se necessário, os dados podem ser modificados por meio de transformação quando são extraídos no Federated Directory Server.
FDS.welcome15 = Um fluxo pode associar dados em um terminal com dados de um outro terminal. Por exemplo, um banco de dados pode conter informações sobre pessoas, que não estão disponíveis em um diretório LDAP. Associando o diretório LDAP ao banco de dados, o Federated Directory Server pode mostrar dados mais ricos sobre as pessoas.
FDS.preConfigureSDS = A primeira etapa é configurar o IBM Security Directory Server. Clique em Configurações de Conexão para chegar no painel de configuração.
FDS.preConfigureEP = Terminais definem onde os dados estão localizados. Inclua pelo menos um terminal antes de continuar. Clique em Incluir no painel Terminais.
FDS.preConfigureFlow = Um fluxo define o relacionamento entre terminais e o Directory Server. Um fluxo simples conecta o terminal e o Directory Server, mas um Fluxo também pode juntar dados de  um terminal com dados de outro terminal. Por exemplo, um banco de dados pode conter informações sobre pessoas, que não estão disponíveis em um diretório LDAP. Associando o diretório LDAP ao banco de dados, o Federated Directory Server pode mostrar dados mais ricos sobre as pessoas.
FDS.loginSubtitle = Insira suas informações
FDS.inactivityMessage = Observe que, após algum tempo de inatividade, o sistema efetuará o seu sign out automaticamente e solicitará que você efetue sign in novamente.
FDS.loginCopyright = Materiais Licenciados-Propriedade da IBM Corp, IBM Corporation e outro (s) 2015, 2023. IBM é uma marca registrada da IBM Corporation nos Estados Unidos e/ou em outros países.
FDS.runMigrateTitle = Sincronização inicial
FDS.runMigrateInfo = Seleciona todas as entradas no terminal que correspondem aos critérios de fluxo e atualiza o Directory Server adequadamente.
FDS.runSyncTitle = Sincronização incremental
FDS.runSyncInfo = Atualiza o Directory Server com base nas mudanças no terminal.\nUm planejamento pode ser incluído nesse fluxo para que seja executado periodicamente.
FDS.runSimulateTitle = Simular
FDS.runSimulateInfo = Executa a mesma ação que a Sincronização Inicial, mas não grava nada no Directory Server. Isso é útil na fase de planejamento inicial para verificar se o fluxo é capaz de selecionar o subconjunto de dados correto \tno terminal.
FDS.terminateConfirm = Isso finalizará o fluxo (qualquer planejamento ativo pode reiniciar o fluxo)
FDS.writeBack = Writeback
FDS.writeBackInfo = A ativação de writeback faz com que as mudanças sejam propagadas de volta para o terminal de origem neste fluxo. Apenas mudanças feitas em \tentradas de pessoa que são destinos desse fluxo são candidatas para writeback.
