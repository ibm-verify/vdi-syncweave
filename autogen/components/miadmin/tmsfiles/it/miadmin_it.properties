FDS.help = Guida
FDS.welcome1 = Benvenuti in Directory Server federato. Utilizzare questo dashboard per configurare le risorse richieste per creare e gestire un ambiente Directory Server federato.
FDS.welcome2 = Directory Server federato affronta diverse sfide aziendali, inclusi gli scenari tipici riportati di seguito\:
FDS.welcome3 = Le identità utente e le password sono presenti in diverse directory esistenti. Directory Server federato consente agli altri sistemi di eseguire l'autenticazione tramite se stesso e di arrivare agli altri sistemi come se fossero un singolo ambiente.
FDS.welcome4 = I dati relativi agli utenti vengono diffusi tra più sistemi, incluse le origini che non sono directory LDAP. Directory Server federato riunisce queste informazioni in una singola vista consolidata dell'enterprise.
FDS.welcome5 = Configura la destinazione
FDS.welcome6 = Il primo passo consiste nel configurare le impostazioni di connessione per IBM Security Directory Server di destinazione, che costituisce il repository centralizzato di base per Directory Server federato.
FDS.welcome7 = Configura endpoint
FDS.welcome8 = Gli endpoint costituiscono le directory e le origini dati esistenti che devono essere federate e sincronizzate. Quando si aggiunge un nuovo endpoint, viene visualizzata una selezione dei possibili tipi di endpoint. Scegliere il tipo corretto e compilare i parametri dell'endpoint.
FDS.welcome9 = Crea flussi
FDS.welcome10 = I flussi definiscono le relazioni tra gli endpoint e Directory Server federato. I flussi possono avere sia una configurazione semplice che complessa. Una volta creato un flusso, è possibile aggiungere una pianificazione da eseguire ad intervalli specifici ed applicare la mappatura dell'attributo personalizzata. Le altre capacità vengono descritte nella prossima sezione.
FDS.welcome11 = Funzioni avanzate
FDS.welcome12 = L'autenticazione pass-through consente agli utenti di essere autenticati delegando l'autenticazione ad un server LDAP endpoint. Quando un utente esegue l'accesso a Directory Server federato, riconosce che l'utente è presente in uno degli endpoint e richiede quindi all'endpoint di verificare le credenziali.
FDS.welcome13 = Mappe attributi
FDS.welcome14 = Le mappe attributi definiscono la quantità di informazioni che Directory Server federato deve raccogliere dagli endpoint. Se necessario, i dati possono essere modificati tramite la trasformazioni quando vengono inseriti in Directory Server federato.
FDS.welcome15 = Un flusso può unire i dati in un endpoint con dati derivanti da un altro endpoint. Ad esempio, un database potrebbe contenere informazioni sugli utenti che non sono disponibili in una directory LDAP. Unendo la directory LDAP al database, Directory Server federato può mostrare dati relativi agli utenti più dettagliati.
FDS.preConfigureSDS = Il primo passo consiste nel configurare IBM Security Directory Server. Fare clic su Impostazioni di connessione per raggiungere il pannello di configurazione.
FDS.preConfigureEP = Gli endpoint definiscono l'ubicazione dei dati. Aggiungere almeno un endpoint prima di continuare. Fare clic su Aggiungi nel pannello Endpoint.
FDS.preConfigureFlow = Un flusso definisce la relazione tra gli endpoint e Directory Server. Un flusso semplice collega l'endpoint e Directory Server, ma un flusso può anche unire i dati in un endpoint con quelli derivanti da un altro endpoint. Ad esempio, un database potrebbe contenere informazioni sugli utenti che non sono disponibili in una directory LDAP. Unendo la directory LDAP al database, Directory Server federato può mostrare dati relativi agli utenti più dettagliati.
FDS.loginSubtitle = Immettere le proprie informazioni
FDS.inactivityMessage = Notare che, dopo un intervallo di tempo di inattività, il sistema si scollegherà automaticamente e richiederà un nuovo accesso.
FDS.loginCopyright = Materiali su licenza - Proprietà di IBM Corp, IBM Corporation e altri 2015, 2023. IBM è un marchio di IBM Corporation, negli Stati Uniti e/o in altri paesi.
FDS.runMigrateTitle = Sincronizzazione iniziale
FDS.runMigrateInfo = Seleziona tutte le voci presenti nell'endpoint che corrispondono ai criteri del flusso e aggiorna di conseguenza Directory Server.
FDS.runSyncTitle = Sincronizzazione incrementale
FDS.runSyncInfo = Aggiorna Directory Server in base alle modifiche presenti nell'endpoint.\nÈ possibile aggiungere una pianificazione a questo flusso in modo che venga eseguito periodicamente.
FDS.runSimulateTitle = Simula
FDS.runSimulateInfo = Esegue la stessa azione di Sincronizzazione iniziale, ma non scrive nulla in Directory Server. È utile nella fase di pianificazione iniziale per verificare che il flusso sia in grado di selezionare la sottoserie corretta di dati nell'endpoint.
