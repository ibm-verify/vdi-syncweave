FDS.writeBack = Write-back
FDS.writeBackInfo = L'abilitazione del write-back provoca la propagazione delle modifiche nell'endpoint di origine di questo flusso. Solo le modifiche alle voci utente che costituiscono una destinazione di questo flusso sono candidate per il write-back.
