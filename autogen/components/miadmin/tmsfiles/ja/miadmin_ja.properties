FDS.help = ヘルプ
FDS.welcome1 = Federated Directory Server へようこそ。 このダッシュボードを使用して、Federated Directory Server 環境を作成および管理するために必要なリソースを構成します。
FDS.welcome2 = Federated Directory Server は、以下の標準的なシナリオを含め、数々のビジネス問題に対処します。
FDS.welcome3 = ユーザー ID とパスワードは、既存の複数のディレクトリーに存在します。 Federated Directory Server を使用すると、他の複数のシステムが単一の環境であるかのように、Federated Directory Server を介して認証を行って他のシステムにアクセスできます。
FDS.welcome4 = 個人に関するデータは、LDAP ディレクトリーではないソースを含む複数のシステムに分散されています。 Federated Directory Server は、この情報を企業の単一の統合ビューに取り込みます。
FDS.welcome5 = ターゲットの構成
FDS.welcome6 = 最初のステップは、Federated Directory Server の一元化されたコア・リポジトリーであるターゲット IBM Security Directory Server の接続設定を構成することです。
FDS.welcome7 = エンドポイントの構成
FDS.welcome8 = エンドポイントとは、統合して同期する必要がある既存のディレクトリーおよびデータ・ソースです。 新規エンドポイントを追加するときには、選択可能なエンドポイントのタイプが提示されます。 適切なタイプを選択し、そのエンドポイントのパラメーターを入力します。
FDS.welcome9 = フローの作成
FDS.welcome10 = フローは、エンドポイントと Federated Directory Server との間の関係を定義します。 フローはかなり単純なものにできますが、高度に構成されたフローにすることもできます。 フローを作成した後、特定の間隔で実行するスケジュールを追加し、カスタム属性マッピングを適用することができます。 その他の機能については、次のセクションで説明されています。
FDS.welcome11 = 高度な機能
FDS.welcome12 = パススルー認証により、認証をエンドポイント LDAP サーバーに委任してユーザーを認証できます。 ユーザーが Federated Directory Server にログインすると、Federated Directory Server はそのユーザーがエンドポイントのいずれかに存在することを認識してから、該当するエンドポイントに対して資格情報の検証を要求します。
FDS.welcome13 = 属性マップ
FDS.welcome14 = 属性マップは、Federated Directory Server がエンドポイントから収集する情報の量を定義します。 必要に応じて、データが Federated Directory Server に取り込まれるときに、変換によりデータを変更できます。
FDS.welcome15 = フローは、あるエンドポイントのデータを別のエンドポイントのデータと結合することができます。 例えば、LDAP ディレクトリーでは使用できないユーザー情報がデータベースに格納されている場合があります。 そのデータベースに LDAP ディレクトリーを結合すると、そのユーザーに関するより豊富なデータを Federated Directory Server で表示できるようになります。
FDS.preConfigureSDS = 最初のステップは、IBM Security Directory Server を構成することです。 構成パネルにアクセスするには、「接続設定」をクリックします。
FDS.preConfigureEP = エンドポイントは、データが配置される場所を定義します。 続行する前に、1 つ以上のエンドポイントを追加します。 「エンドポイント」パネルで「追加」をクリックします。
FDS.preConfigureFlow = フローは、エンドポイントと Directory Server との間の関係を定義します。 単純なフローはエンドポイントと Directory Server とを接続しますが、フローは、あるエンドポイントのデータと別のエンドポイントのデータとを結合することもできます。 例えば、LDAP ディレクトリーでは使用できないユーザー情報がデータベースに格納されている場合があります。 そのデータベースに LDAP ディレクトリーを結合すると、そのユーザーに関するより豊富なデータを Federated Directory Server で表示できるようになります。
FDS.loginSubtitle = 情報を入力してください
FDS.inactivityMessage = 注\: 一定時間操作しなかった場合、システムは自動的にログアウト処理を行い、再度サインインするように要求します。
FDS.loginCopyright = \://www.ibm.com/legal/copytrade.shtml をご覧ください。
FDS.runMigrateTitle = イニシャル同期
FDS.runMigrateInfo = エンドポイント内のフロー基準に一致するすべての項目を選択し、それに応じて Directory Server を更新します。
FDS.runSyncTitle = 増分同期
FDS.runSyncInfo = エンドポイント内の変更に基づいて Directory Server を更新します。\nこのフローにスケジュールを追加して、定期的にスケジュールを実行できます。
FDS.runSimulateTitle = シミュレート
FDS.runSimulateInfo = 初期同期と同じアクションを実行しますが、Directory Server への書き込みは行いません。 これは、初期計画の段階で、フローがエンドポイントの正しいデータ・サブセットを選択できることを検証する場合に役立ちます。
FDS.terminateConfirm = フローを終了します (アクティブなスケジュールにより、フローが再開される可能性があります)
FDS.writeBack = 書き戻し
FDS.writeBackInfo = 書き戻しを有効にすると、このフローのソース・エンドポイントに変更が反映されます。 書き戻しの候補となるのは、このフローのターゲットとなっている個人項目に対する変更のみです。
FDS.writeBackMap = ソース・エンドポイントに書き戻す属性を選択します
