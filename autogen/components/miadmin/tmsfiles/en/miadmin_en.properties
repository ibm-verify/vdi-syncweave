FDS.help=Help
FDS.welcome1=Welcome to Federated Directory Server. Use this dashboard to configure the resources required to create and manage the Federated Directory Server environment.
FDS.welcome2=Federated Directory Server addresses several business challenges, including the following typical scenarios:
FDS.welcome3=User identities and passwords exist in several existing directories. Federated Directory Server allows other systems to authenticate through it and get to the other systems as if they were a single environment.
FDS.welcome4=Data about people is spread across multiple systems, including sources that are not LDAP directories. Federated Directory Server pulls this information together to a single consolidated view of the enterprise.
FDS.welcome5=Configure the target
FDS.welcome6=The first step is to configure the connection settings for the target IBM Security Directory Server, which is the core centralized repository for Federated Directory Server.
FDS.welcome7=Configure endpoints
FDS.welcome8=Endpoints are the existing directories and data sources that need to be federated and synchronized. When you add a new endpoint, you are presented with a selection of possible endpoint types. Choose the proper type and fill in the parameters for the endpoint.
FDS.welcome9=Create flows
FDS.welcome10=Flows define the relationships between endpoints and Federated Directory Server. Flows can be quite simple, but can also be highly configured. After you create a flow, you can add a schedule to run at specific intervals and apply custom attribute mapping. Other capabilities are described in the next section.
FDS.welcome11=Advanced features
FDS.welcome12=Pass-Through Authentication enables users to be authenticated by delegating authentication to an endpoint LDAP server. When a user logs in to Federated Directory Server, it recognizes that the user exists in one of the endpoints, and then asks the endpoint to verify the credentials.
FDS.welcome13=Attribute maps
FDS.welcome14=Attribute maps define the amount of information that Federated Directory Server must collect from the endpoints. If necessary, data can be modified through transformation when it is pulled into Federated Directory Server.
FDS.welcome15=A flow can join data in one endpoint with data from another endpoint. For example, a database might contain information about people, which is not available in an LDAP directory. By joining the LDAP directory with the database, Federated Directory Server can show richer data about the people.
FDS.preConfigureSDS=The first step is to configure the IBM Security Directory Server. Click Connection Settings to reach the configuration panel.
FDS.preConfigureEP=Endpoints define where data is located. Add at least one endpoint before continuing. Click Add in the Endpoints panel.
FDS.preConfigureFlow=A Flow defines the relationship between endpoints and the Directory Server. A simple Flow connects the endpoint and Directory Server, but a Flow can also join data in one endpoint with data from another endpoint. For example, a database might contain information about people, which is not available in an LDAP directory. By joining the LDAP directory with the database, Federated Directory Server can show richer data about the people.
