FDS.welcome1 = 歡迎使用聯合目錄伺服器。 請使用本儀表板來配置建立及管理聯合目錄伺服器環境所需的資源。
FDS.welcome2 = 聯合目錄伺服器解決了數個業務難題，包括下列典型情況：
FDS.welcome3 = 數個現有目錄中存在使用者身分及密碼。 聯合目錄伺服器容許其他系統透過它進行鑑別，並轉向其他系統，如同在單一環境中一樣。
FDS.welcome4 = 人員相關資料跨多個系統展開，包括非 LDAP 目錄的來源。 聯合目錄伺服器拉出所有此類資訊，並將其放到企業的單個合併視圖中。
FDS.welcome5 = 配置目標
FDS.welcome6 = 首要步驟是配置目標 IBM Security Directory Server（它是聯合目錄伺服器的核心集中式儲存庫）的連線設定。
FDS.welcome7 = 配置端點
FDS.welcome8 = 端點是需要聯合及同步的現有目錄及資料來源。 當您新增端點時，會呈現可用的端點類型的選擇。 選擇適當的類型，並填寫端點的參數。
FDS.welcome9 = 建立流程
FDS.welcome10 = 流程定義端點及聯合目錄伺服器之間的關係。 流程可以非常簡單，但也可以高度配置。 建立流程之後，您可以新增排程以根據特定的間隔執行，並套用自訂屬性對映。 下一節中說明了其他功能。
FDS.welcome11 = 進階功能
FDS.welcome12 = 透通鑑別容許透過委派鑑別給端點 LDAP 伺服器來鑑別使用者。 當使用者登入聯合目錄伺服器時，它會辨識使用者是否在某個端點中，然後要求該端點驗證認證。
FDS.welcome13 = 屬性對映
FDS.welcome14 = 屬性對映定義聯合目錄伺服器必須從端點收集的資訊量。 必要的話，可以在將資料拉出至聯合目錄伺服器時透過轉換來修改它。
FDS.welcome15 = 流程可以將一個端點的資料與另一個端點的資料結合。 例如，資料庫可以包含人員的相關資訊，LDAP 目錄中不提供該資訊。 透過將 LDAP 目錄與資料庫結合，聯合目錄伺服器可以顯示更多人員資料。
FDS.preConfigureSDS = 首要步驟是配置 IBM Security Directory Server。 按一下「連線設定」，以達到配置畫面。
FDS.preConfigureEP = 端點會定義資料的位置。 在繼續之前，新增至少一個端點。 按一下「端點」畫面中的「新增」。
FDS.preConfigureFlow = 「流程」會定義端點與「目錄伺服器」之間的關係。 簡式「流程」會連接端點與「目錄伺服器」，但「流程」也可以結合一個端點中的資料與另一個端點中的資料。 例如，資料庫可以包含人員的相關資訊，LDAP 目錄中不提供該資訊。 透過將 LDAP 目錄與資料庫結合，聯合目錄伺服器可以顯示更多人員資料。
