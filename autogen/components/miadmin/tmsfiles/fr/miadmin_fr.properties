FDS.help = Aide
FDS.welcome1 = Bienvenue dans Federated Directory Server. Utilisez ce tableau de bord pour configurer les ressources requises pour créer et gérer l'environnement Federated Directory Server.
FDS.welcome2 = Federated Directory Server répond à plusieurs défis métier, notamment aux scénarios classiques suivants \:
FDS.welcome3 = Les identifiants et les mots de passe des utilisateurs existent dans plusieurs annuaires. Federated Directory Server permet aux autres systèmes de s'identifier par son intermédiaire et d'accéder aux autres systèmes comme s'ils faisaient partie d'un seul environnement.
FDS.welcome4 = Les données sur les utilisateurs sont disséminées sur plusieurs systèmes, y compris des sources qui ne sont pas des répertoires LDAP. Federated Directory Server rassemble ces informations et les présente dans une seule vue consolidée de l'entreprise.
FDS.welcome5 = Configurer la cible
FDS.welcome6 = La première étape consiste à configurer la connexion pour le serveur IBM Security Directory Server cible, lequel est le référentiel centralisé fondamental de Federated Directory Server.
FDS.welcome7 = Configurer les noeuds finaux
FDS.welcome8 = Les noeuds finaux sont les annuaires et les sources de données existants qui ont besoin d'être fédérés et synchronisés. Lorsque vous ajoutez un nouveau noeud final, vous avez le choix entre plusieurs types de noeud final. Sélectionnez le type approprié et renseignez les paramètres du noeud final.
FDS.welcome9 = Créer des flux
FDS.welcome10 = Les flux définissent les relations entre les noeuds finaux et Federated Directory Server. Les flux peuvent être simples, mais peuvent aussi avoir une configuration complexe. Après avoir créé un flux, vous pouvez ajouter un planning pour l'exécuter à intervalles fixes et lui appliquer un mappage d'attributs personnalisé. D'autres fonctionnalités sont décrites dans la section suivante.
FDS.welcome11 = Fonctions avancées
FDS.welcome12 = L'authentification passe-système permet aux utilisateurs d'être authentifiés en déléguant l'authentification à un serveur LDAP de noeud final. Lorsqu'un utilisateur se connecte à Federated Directory Server, celui-ci détecte que l'utilisateur existe dans l'un des noeuds finaux et demande alors au noeud final de vérifier ses données d'identification.
FDS.welcome13 = Mappes d'attributs
FDS.welcome14 = Les mappes d'attributs définissent le volume d'informations que Federated Directory Server doit collecter auprès des noeuds finaux. Si nécessaire, les données peuvent être modifiées en leur appliquant une transformation lorsqu'elles sont importées dans Federated Directory Server.
FDS.welcome15 = Un flux peut joindre des données dans un noeud final à des données dans un autre noeud final. Par exemple, une base de données peut contenir des informations sur des personnes qui ne sont pas disponibles dans un annuaire LDAP. En reliant l'annuaire LDAP à la base de données, Federated Directory Server peut présenter des données plus substantielles sur les personnes.
FDS.preConfigureSDS = La première étape consiste à configurer le serveur IBM Security Directory Server. Cliquez sur Paramètres de connexion pour accéder au panneau de configuration.
FDS.preConfigureEP = Les noeuds finaux définissent l'emplacement des données. Ajoutez au moins un noeud final avant de poursuivre. Cliquez sur Ajouter dans le panneau Noeuds finaux.
FDS.preConfigureFlow = Un flux définit la relation entre des noeuds finaux et le serveur d'annuaire. Un flux simple connecte le noeud final et le serveur d'annuaire, mais il peut également joindre les données d'un noeud final aux données d'un autre noeud final. Par exemple, une base de données peut contenir des informations sur des personnes qui ne sont pas disponibles dans un annuaire LDAP. En reliant l'annuaire LDAP à la base de données, Federated Directory Server peut présenter des données plus substantielles sur les personnes.
FDS.loginSubtitle = Entrez vos informations
FDS.inactivityMessage = Notez qu'après un certain délai d'inactivité, le système vous déconnectera automatiquement et vous demandera de vous reconnecter.
FDS.loginCopyright = 
FDS.runMigrateTitle = Synchronisation initiale
FDS.runMigrateInfo = Sélectionne toutes les entrées dans le noeud final qui correspondent aux critères du flux et met à jour le serveur Directory Server en conséquence.
FDS.runSyncTitle = Synchronisation incrémentielle
FDS.runSyncInfo = Met à jour le serveur Directory Server compte tenu des modifications dans le noeud final.\nUn planning peut être ajouté à ce flux de sorte à ce qu'il s'exécute périodiquement.
FDS.runSimulateTitle = Simuler
