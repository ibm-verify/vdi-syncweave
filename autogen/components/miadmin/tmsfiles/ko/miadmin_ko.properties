FDS.welcome1 = 연합 디렉토리 서버를 시작합니다. 이 대시보드를 사용하여 연합 디렉토리 서버 환경을 작성하고 관리하는 데 필요한 자원을 구성하십시오.
FDS.welcome2 = 연합 디렉토리 서버는 다음 일반 시나리오를 포함하여 여러 비즈니스 문제를 다룹니다.
FDS.welcome3 = 사용자 ID와 비밀번호가 여러 기존 디렉토리에 존재합니다. 연합 디렉토리 서버는 다른 시스템도 해당 연합 디렉토리 서버를 통해 인증이 가능하도록 하여 마치 단일 환경인 것처럼 나머지 시스템에 연결될 수 있습니다.
FDS.welcome4 = 개인 데이터는 LDAP 디렉토리가 아닌 소스를 포함하여 다중 시스템에 전달됩니다. 연합 디렉토리 서버는 엔터프라이즈의 통합된 단일 보기로 이 정보를 모읍니다.
FDS.welcome5 = 대상 구성
FDS.welcome6 = 첫 번째 단계는 연합 디렉토리 서버의 핵심 중앙 집중적 저장소인 대상 IBM Security Directory Server의 연결 설정을 구성하는 것입니다.
FDS.welcome7 = 엔드포인트 구성
FDS.welcome8 = 엔드포인트는 연합하여 동기화해야 하는 기존 디렉토리와 데이터 소스입니다. 새 엔드포인트 추가 시, 사용 가능한 엔드포인트 유형 선택사항이 제공됩니다. 적합한 유형을 선택하고 엔드포인트의 매개변수를 입력하십시오.
FDS.welcome9 = 플로우 작성
FDS.welcome10 = 플로우는 엔드포인트와 연합 디렉토리 서버의 관계를 정의합니다. 플로우는 매우 단순할 수도 있고 복잡하게 구성될 수도 있습니다. 플로우를 작성한 후, 특정 간격으로 실행할 스케줄을 추가하고 속성 맵핑을 적용할 수 있습니다. 다른 기능은 다음 섹션에서 설명됩니다.
FDS.welcome11 = 고급 기능
FDS.welcome12 = PTA(Pass-Through Authentication)을 통해 엔드포인트 LDAP 서버에 인증을 위임하여 사용자를 인증할 수 있습니다. 사용자가 연합 디렉토리 서버에 로그인하면 사용자가 엔드포인트 중 하나에 존재한다는 것을 인식한 후 신임 정보를 검증하도록 엔드포인트에 요청합니다.
FDS.welcome13 = 속성 맵
FDS.welcome14 = 속성 맵핑은 연합 디렉토리 서버가 엔드포인트에서 수집해야 하는 정보량을 정의합니다. 연합 디렉토리 서버로 데이터 수집 시 필요한 경우 변환을 통해 데이터를 수정할 수 있습니다.
FDS.welcome15 = 플로우는 하나의 엔드포인트에 있는 데이터를 다른 엔드포인트의 데이터와 결합할 수\n있습니다. 예를 들어 데이터베이스에 LDAP 디렉토리에서는 사용할 수 없는\n개인에 대한 정보가 포함되어 있을 수 있습니다. LDAP 디렉토리와\n해당 데이터베이스를 결합하여 Federated Directory Server에서 개인에\n대한 더 풍부한 데이터를 표시할 수 있습니다.
FDS.preConfigureSDS = 첫 번째 단계는 IBM Security Directory Server를 구성하는 것입니다. 구성 패널을 보려면 연결 설정을 클릭하십시오.
FDS.preConfigureEP = 엔드포인트에서 데이터 위치를 정의합니다. 계속하기 전에 최소 하나의 엔드포인트를 추가하십시오. 엔드포인트 패널에서 추가를 클릭하십시오.
FDS.preConfigureFlow = 플로우에서 엔드포인트와 디렉토리 서버 사이의 관계를 정의합니다. 단순 플로우에서는 엔드포인트와 디렉토리 서버를 연결하지만 플로우에서 어떤 한 엔드포인트의 데이터를 다른 엔드포인트의 데이터와 결합할 수도 있습니다. 예를 들어 데이터베이스에 LDAP 디렉토리에서는 사용할 수 없는\n개인에 대한 정보가 포함되어 있을 수 있습니다. LDAP 디렉토리와\n해당 데이터베이스를 결합하여 Federated Directory Server에서 개인에\n대한 더 풍부한 데이터를 표시할 수 있습니다.
FDS.loginSubtitle = 사용자 정보를 입력하십시오.
FDS.inactivityMessage = 일정 시간 시스템을 사용하지 않으면 자동으로 로그아웃되며 사용자에게 다시 로그인할지 여부를 묻습니다.
