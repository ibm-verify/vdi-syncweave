FDS.welcome1 = Willkommen bei Federated Directory Server. Mit diesem Dashboard können Sie die Ressourcen konfigurieren, die erforderlich sind, um die Federated Directory Server-Umgebung zu erstellen und zu verwalten.
FDS.welcome2 = Federated Directory Server unterstützt Sie bei einer Reihe geschäftlicher Herausforderungen, die z. B. folgende Szenarios umfassen können\:
FDS.welcome3 = Benutzeridentitäten und Kennwörter sind in mehreren bestehenden Verzeichnissen vorhanden. Federated Directory Server ermöglicht anderen Systemen die Durchgriffsauthentifizierung und den Zugriff auf die jeweils anderen Systeme wie in einer einzigen Umgebung.
FDS.welcome4 = Personenbezogene Daten sind auf mehrere Systeme verteilt, unter anderem auch auf Quellen, bei denen es sich nicht um LDAP-Verzeichnisse handelt. Federated Directory Server fasst diese Informationen in einer einzelnen konsolidierten Unternehmensansicht zusammen.
FDS.welcome5 = Ziel konfigurieren
FDS.welcome6 = Im ersten Schritt werden die Verbindungseinstellungen für den IBM Security Directory Server-Zielserver konfiguriert, der das zentrale Kernrepository für Federated Directory Server darstellt.
FDS.welcome7 = Endpunkte konfigurieren
FDS.welcome8 = Endpunkte sind die vorhandenen Verzeichnisse und Datenquellen, die föderiert und synchronisiert werden müssen. Wenn Sie einen neuen Endpunkt hinzufügen, können Sie aus einer Reihe möglicher Endpunkttypen auswählen. Wählen Sie den entsprechenden Typ aus und geben Sie die Parameter für den Endpunkt an.
FDS.welcome9 = Datenflüsse erstellen
FDS.welcome10 = Datenflüsse definieren die Beziehungen zwischen Endpunkten und Federated Directory Server. Datenflüsse können einfach aufgebaut sein, aber auch aus komplexen Konfigurationen bestehen. Nach der Erstellung eines Datenflusses können Sie einen Zeitplan für eine Ausführung in bestimmten Intervallen hinzufügen. Weitere Funktionen sind im folgenden Abschnitt beschrieben.
FDS.welcome11 = Erweiterte Features
FDS.welcome12 = Mithilfe der Durchgriffsauthentifizierung können Benutzer authentifiziert werden, indem sie die Authentifizierung an einen Endpunkt-LDAP-Server delegieren. Wenn sich ein Benutzer bei Federated Directory Server anmeldet, erkennt das Programm, dass der Benutzer in einem der Endpunkte vorhanden ist, und fordert den Endpunkt zur Prüfung der Berechtigungsnachweise auf.
FDS.welcome13 = Attributzuordnungen
FDS.welcome14 = Attributzuordnungen definieren die Menge an Informationen, die Federated Directory Server von den Endpunkten erfassen muss. Falls erforderlich, können Daten beim Einlesen in Federated Directory Server mithilfe der Transformation modifiziert werden.
FDS.welcome15 = Ein Datenfluss kann Daten eines Endpunkts mit Daten eines anderen Endpunkts verknüpfen. So kann eine Datenbank beispielsweise personenbezogene Informationen enthalten, die nicht in einem LDAP-Verzeichnis verfügbar sind. Durch die Verknüpfung des LDAP-Verzeichnisses mit der Datenbank kann Federated Directory Server ausführlichere Daten zu den Personen anzeigen.
FDS.preConfigureSDS = Im ersten Schritt wird IBM Security Directory Server konfiguriert. Rufen Sie die Konfigurationsanzeige auf, indem Sie auf 'Verbindungseinstellungen' klicken.
FDS.preConfigureEP = Endpunkte definieren die Position der Daten. Fügen Sie mindestens einen Endpunkt hinzu, bevor Sie fortfahren. Klicken Sie in der Endpunktanzeige auf 'Hinzufügen'.
FDS.preConfigureFlow = Ein Datenfluss definiert die Beziehung zwischen Endpunkten und Directory Server. Ein einfacher Datenfluss verbindet den Endpunkt und Directory Server, ein Datenfluss kann aber auch Daten in einem Endpunkt mit Daten eines anderen Endpunkts verbinden. So kann eine Datenbank beispielsweise personenbezogene Informationen enthalten, die nicht in einem LDAP-Verzeichnis verfügbar sind. Durch die Verknüpfung des LDAP-Verzeichnisses mit der Datenbank kann Federated Directory Server ausführlichere Daten zu den Personen anzeigen.
FDS.loginSubtitle = Informationen eingeben
FDS.inactivityMessage = Bitte beachten Sie\: Finden innerhalb eines bestimmten Zeitraums keine Aktivitäten statt, werden Sie vom System automatisch abgemeldet und dazu aufgefordert, sich erneut anzumelden.
FDS.loginCopyright = Lizenziertes Material-Eigentum der IBM Corporation, IBM Corporation und andere 2015, 2023. IBM ist eine eingetragene Marke der IBM Corporation in den USA und/oder anderen Ländern.
FDS.runMigrateTitle = Erste Synchronisation
FDS.runMigrateInfo = Wählt alle Einträge im Endpunkt aus, die mit den Datenflusskriterien übereinstimmen, und aktualisiert Directory Server entsprechend.
FDS.runSyncTitle = Inkrementelle Synchronisation
FDS.runSyncInfo = Aktualisiert Directory Server auf der Basis von Änderungen im Endpunkt.\nZu diesem Datenfluss kann ein Zeitplan hinzugefügt werden, sodass er in regelmäßigen Abständen ausgeführt wird.
FDS.runSimulateTitle = Simulieren
FDS.runSimulateInfo = Führt dieselbe Aktion aus wie die erste Synchronisation, schreibt jedoch keine Daten in Directory Server. Dies ist in der Anfangsphase der Planung nützlich, um zu überprüfen, ob der Datenfluss das korrekte Datensubset im Endpunkt auswählen kann.
FDS.terminateConfirm = Beendet den Datenfluss (der Datenfluss kann durch einen aktiven Zeitplan erneut gestartet werden)
FDS.writeBack = Zurückschreiben
FDS.writeBackInfo = Durch das Aktivieren des Zurückschreibens werden Änderungen im Quellenendpunkt dieses Datenflusses repliziert. Nur Änderungen an Personeneinträgen, die Ziele dieses Datenflusses darstellen, kommen für das Zurückschreiben infrage.
