FailureAL.label = Fertigungslinie bei Fehlern
FailureAL.description = Die FL, die auszuf\u00FChren ist, wenn diese Fertigungslinie fehlschl\u00E4gt.
WithinSeconds.label = Mindestanzahl Sekunden
WithinSeconds.description = Wird die Fertigungslinie innerhalb dieser Zeit beendet, gilt ihre Ausf\u00FChrung als fehlgeschlagen.
stopOnFailure.label = Scheduler bei fehlgeschlagener Ausf\u00FChrung der Fertigungslinie stoppen
stopOnFailure.description = Schl\u00E4gt das Ausf\u00FChren einer Fertigungslinie fehl, so wird die Fertigungslinie bei Fehlern ausgef\u00FChrt (sofern definiert) und dann der Scheduler gestoppt.
stopOnFailure.seq.label = Sequenz bei Fehler stoppen
stopOnFailure.seq.desc = Wenn diese FL mit einer Ausnahmebedingung gestoppt wird, so wird die gesamte Sequenz gestoppt. Dies trifft nicht zu, wenn die Ausf\u00FChrung der FL im Hintegrund erfolgt.
shareScript.label = JavaScript gemeinsam nutzen
shareScript.desc = Die Nutzung von JavaScript erfolgt gemeinsam mit allen anderen Fertigungslinien, bei denen dieses Feld ebenfalls ausgew\u00E4hlt ist. Es erfolgt keine gemeinsame Nutzung, wenn die Option 'Im Hintergrund ausf\u00FChren' ausgew\u00E4hlt ist oder die Fertigungslinie auf einem anderen Server ausgef\u00FChrt wird.
shareLog.label = Gemeinsame Protokollierung
shareLog.desc = Bei Auswahl dieser Option erfolgt die Protokollierung der Fertigungslinie in demselben Protokoll wie die Sequenz.
runInBackground.label = Im Hintergrund ausf\u00FChren
runInBackground.desc = Bei Auswahl dieser Option wartet die Sequenz nicht auf die Beendigung der Fertigungslinie, bevor sie mit der n\u00E4chsten Fertigungslinie fortf\u00E4hrt.
inheritWork.label = Work-Eintrag \u00FCbernehmen
inheritWork.desc = Bei Auswahl dieser Option wird der letzte Work-Eintrag aus der vorhergehenden Fertigungslinie, deren Ausf\u00FChrung nicht im Hintergrund erfolgte, als erster Work-Eintrag f\u00FCr diese Fertigungslinie verwendet.
