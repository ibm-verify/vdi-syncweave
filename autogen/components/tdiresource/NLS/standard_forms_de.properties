DELTA_CONF_ROW_LOCKING_LABEL = Zeilensperre
DELTA_CONF_ROW_LOCKING_DESC = Dieser Parameter steuert die Zeilensperren in einer Deltaspeichertabelle, wenn mehrere Datenbankclients\nauf dieselben Daten zugreifen, indem eine Transaktionsisolationsstufe festgelegt wird. Durch eine h\u00F6here Isolationsstufe werden\nTransaktionsanomalien wie fehlerhafte Leseoperationen, nicht wiederholbares Lesen und Scheinleseoperationen reduziert, indem Zeilen- und Tabellensperren eingesetzt werden.
