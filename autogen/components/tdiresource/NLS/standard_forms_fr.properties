OPERATION_INIT_DESC = Param\u00E8tres de la ligne d'assemblage (appel\u00E9e avant l'op\u00E9ration) 
Advanced = Avanc\u00E9
StartTimesDesc = Heures auxquelles ce planificateur sera ex\u00E9cut\u00E9
StartTimesLabel = Heures de d\u00E9but
FailureAL.label = Cha\u00EEne d'assemblage d\u00E9faillante
FailureAL.description = L'op\u00E9ration de ligne d'assemblage doit \u00EAtre ex\u00E9cut\u00E9e en cas d'\u00E9chec de la ligne d'assemblage.
WithinSeconds.label = D\u00E9lai minimal, en secondes
WithinSeconds.description = Si la ligne d'assemblage se termine avant expiration de ce d\u00E9lai, ceci indique un \u00E9chec.
stopOnFailure.label = Arr\u00EAter le planificateur en cas d'\u00E9chec de la ligne d'assemblage
stopOnFailure.description = Si la ligne d'assemblage \u00E9choue, ex\u00E9cutez la ligne d'assemblage de d\u00E9faillance (si elle est d\u00E9finie), puis arr\u00EAtez le planificateur.
stopOnFailure.seq.label = Arr\u00EAter la s\u00E9quence en cas d'incident
stopOnFailure.seq.desc = Si cette cha\u00EEne d'assemblage s'arr\u00EAte avec une exception, toute la s\u00E9quence s'arr\u00EAte. Ceci ne s'applique pas lors de l'ex\u00E9cution de la cha\u00EEne d'assemblage en arri\u00E8re-plan.
shareScript.label = Partager JavaScript
shareScript.desc = Partagez JavaScript avec une autre cha\u00EEne d'assemblage dans la s\u00E9quence o\u00F9 cette case est \u00E9galement coch\u00E9e. Le partage ne sera pas effectu\u00E9 lors de l'utilisation de "Ex\u00E9cuter en arri\u00E8re-plan" ou lorsque la cha\u00EEne d'assemblage est ex\u00E9cut\u00E9e sur un autre serveur.
shareLog.label = Partager la consignation
shareLog.desc = Si cette case est coch\u00E9e, cette cha\u00EEne d'assemblage se connecte au m\u00EAme journal que celui de la s\u00E9quence.
runInBackground.label = Ex\u00E9cuter en arri\u00E8re-plan
runInBackground.desc = Si cette case est coch\u00E9e, la s\u00E9quence n'attend pas que la cha\u00EEne d'assemblage s'arr\u00EAte avant de passer \u00E0 la cha\u00EEne d'assemblage suivante
inheritWork.label = H\u00E9riter de l'entr\u00E9e work
inheritWork.desc = Si cette case est coch\u00E9e, la derni\u00E8re entr\u00E9e work, provenant de la cha\u00EEne d'assemblage pr\u00E9c\u00E9dente qui n'a pas \u00E9t\u00E9 ex\u00E9cut\u00E9e en arri\u00E8re-plan, est utilis\u00E9e comme entr\u00E9e work initiale pour cette cha\u00EEne d'assemblage.
