shareLog.desc = When checked, this AssemblyLine will log to the same log as the Sequence.
runInBackground.label = Run in Background
runInBackground.desc = When checked, the sequence will not wait for the AssemblyLine to finish before proceeding to the next AssemblyLine
inheritWork.label = Inherit work Entry
inheritWork.desc = When checked, the last work Entry from the previous AssemblyLine that was not run in background, will be used as the initial work Entry for this AssemblyLine.
