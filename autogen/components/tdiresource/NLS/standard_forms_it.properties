DELTA_CONF_ROW_LOCKING_DESC = Questo parametro indica la necessit\u00E0 del blocco delle righe in una tabella Archivio Delta quando pi\u00F9 client DB accedono \nagli stessi dati, impostando un 'Livello di isolamento della transazione'. Impostando un livello di isolamento pi\u00F9 elevato, le anomalie della transazione\nnote come 'dirty read', 'non-repeatable reads' e 'phantom reads' vengono ridotte utilizzando blocchi di righe e tabelle.
