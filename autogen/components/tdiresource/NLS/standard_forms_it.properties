FailureAL.label = AssemblyLine in caso di errore
FailureAL.description = L'AL da eseguire se l'AssemblyLine ha esito negativo.
WithinSeconds.label = Numero minimo di secondi
WithinSeconds.description = Se l'AssemblyLine termina entro questo lasso di tempo, non \u00E8 riuscito.
stopOnFailure.label = Arresta programma di pianificazione se AssemblyLine in errore
stopOnFailure.description = Se l'AssemblyLine non riesce, esegue l'AL in caso di errore (se definito) ed arresta il programma di pianificazione.
stopOnFailure.seq.label = Arresta sequenza in caso di errore
stopOnFailure.seq.desc = Se questo AL viene arrestato con un'eccezione, verr\u00E0 arrestata l'intera sequenza. Ci\u00F2 non accade quando AL viene eseguito in background.
shareScript.label = Condividi JavaScript
shareScript.desc = Condivide JavaScript con altri AssemblyLine nella sequenza in cui questa casella \u00E8 selezionata. La condivisione non viene eseguita quando si utilizza "Esegui in background" o quando l'AssemblyLine viene eseguito su un altro server.
shareLog.label = Condividi registrazione
shareLog.desc = Quando questa opzione \u00E8 selezionata, questo AssemblyLine si collegher\u00E0 allo stesso log della sequenza.
runInBackground.label = Esegui in background
runInBackground.desc = Quando questa opzione \u00E8 selezionata, la sequenza non attender\u00E0 il termine dell'AssemblyLine prima di procedere con l'AssemblyLine successivo
inheritWork.label = Eredita voce di lavoro
inheritWork.desc = Quando questa opzione \u00E8 selezionata, l'ultima voce di lavoro dall'AssemblyLine precedente, che non \u00E8 stato eseguito in background, verr\u00E0 utilizzata come voce di lavoro iniziale per questo AssemblyLine.
