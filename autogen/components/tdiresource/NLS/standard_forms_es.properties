shareScript.label = Compartir JavaScript
shareScript.desc = Consultar JavaScript con otra l\u00EDnea de ensamblaje en la secuencia cuando est\u00E1 casilla est\u00E9 seleccionada tambi\u00E9n. El uso compartido no tendr\u00E1 lugar cuando se utilice "ejecutar en segundo plano" o cuando la l\u00EDnea de ensamblaje se ejecute en otro servidor.
shareLog.label = Compartir registro
shareLog.desc = Si se selecciona, esta l\u00EDnea de ensamblaje se registrar\u00E1 en el mismo registro que la secuencia.
runInBackground.label = Ejecutar en segundo plano
runInBackground.desc = Si se selecciona, la secuencia no esperar\u00E1 a que finalice la l\u00EDnea de ensamblaje antes de continuar con la siguiente l\u00EDnea de ensamblaje.
inheritWork.label = Heredar entrada de trabajo
inheritWork.desc = Si se selecciona, la \u00FAltima entrada de trabajo de la l\u00EDnea de ensamblaje anterior que no se ejecut\u00F3 segundo plano se utilizar\u00E1 como la entrada de trabajo inicial de esta l\u00EDnea de ensamblaje.
