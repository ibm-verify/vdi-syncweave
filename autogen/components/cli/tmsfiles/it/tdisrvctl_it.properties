GEN_CMD_USAGE = \nUtilizzo\: tdisrvctl [ general_options] -op operation [ operation_specific_options]\n\ngeneral_options\:\n -h host indirizzo IP o nome host del server remoto (il valore predefinito è localhost)\n -K nome keystore del file di database delle chiavi SSL\n -p numero porta (il valore predefinito è 1099)\n -P password file chiave key_pwd\n -s dir Specifica la directory di lavoro in cui si trova la directory della soluzione.\n -T nome truststore del file di database truststore SSL\n -u userID nome utente (per l'autenticazione personalizzata)\n -v esegue in modalità verbose\n -w user_pwd user password (per l'autenticazione personalizzata)\n -W password file trust trust_pwd -?                  utilizzo dei comandi di visualizzazione\n\n\noperazione\:\n event send custom notification event prop manage Config properties queryop query an AssemblyLine for operations reload reload reload running Configs report generate Config report o list Configs on remote server shutdown \
    shutdown the server srvinfo view SyncWeave server information status view status of Configs or AssemblyLines \n avviare la configurazione specifica o AssemblyLines arrestare la configurazione specifica o la vista tombstone AssemblyLine voci tombstone per la configurazione specifica o AssemblyLine deletetombstone elimina una voce tombstone esegue il debug dei componenti in un AssemblyLine in esecuzione\n\nPer ottenere aiuto per un'operazione specifica\: tdisrvctl -op operation -?\n
RELOAD_USAGE = \nL'utilizzo per l'operazione di ricaricamento è\: tdisrvctl [ general_options] -op reload -c config_list\n\ndove\:\n -c config_list elenco separato da virgole di configurazioni da ricaricare\n
SHUTDOWN_USAGE = \nL'utilizzo per l'operazione di arresto è\: tdisrvctl [ general_options] -op shutdown [ - o return_code] [ -f]\n\ndove\:\n -o codice_ritorno chiude il server con il codice di ritorno specificato\n -f forza una chiusura controllata ed esce da tutte le AssemblyLines\n\n
SRVINFO_USAGE = \nL'utilizzo per l'operazione di informazioni sul server è\:\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \nL'utilizzo per l'operazione di stato è\: tdisrvctl [ general_options] -op status [ - c config_list | all]\n                                       [ - r AL_list | tutti]\n                                       [ - ascolta]\n\ndove\:\n -c config_list elenco separato da virgole di configurazioni o parola chiave ' all'\n -r AL_list elenco separato da virgole di AL o parola chiave ' all'-listen inizia a ricevere i log di una configurazione o di un AssemblyLine in esecuzione\n\nEsempio\: per visualizzare lo stato di tutte le configurazioni e le ALs caricate tdisrvctl [ opzioni_generali] -op status\n\nPer visualizzare lo stato di tutte le ALs in esecuzione tdisrvctl [ opzioni_generali] -op status -r all\n\nPer visualizzare lo stato di tutti i componenti di una particolare configurazione caricata tdisrvctl [ opzioni_generali] -op status -c Config.xml -r all Nota\:\n- La parola chiave ' all'indica tutte le configurazioni o AssemblyLines.\n- L'opzione -listen richiede \
    esattamente una configurazione o AssemblyLine da specificare.\n
START_USAGE = \nL'utilizzo dell'operazione di avvio è\: tdisrvctl [ general_options] -op start -c config [ - e password]\n                               [ - r AL_list | tutti]\n                               [ - s]\n                               [ - r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f nomefile]\n\t\t\t       [ - m config_run_name -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [ - t]\n\t\t\t       [ - ascolta]\n\t\t\t       [ - sync]\n\ndove\:\n -c config nome della configurazione da avviare\n -e password password del file di configurazione se è protetto da password\n -r AL_list elenco separato da virgole di AssemblyLines da avviare o parola chiave ' all'\n -s simulate mode run AssemblyLine in simulate mode -alop opname AssemblyLine operazione con gli attributi richiesti e i relativi valori\n -f nomefile nomefile per specificare le operazioni\n -m config nome di esecuzione nome di \
    esecuzione della configurazione -o file delle proprietà elenco separato da virgole elenco di nomi e valori dell'archivio delle proprietà\n -t avvia una configurazione temporanea -listen riceve i log della configurazione specificata o AssemblyLine -sync esegue in modo sincrono AssemblyLine Nota\:\n- L'opzione -c è obbligatoria.\n- La parola chiave ' all'indica tutti gli AssemblyLines.\n- L'opzione -t prevede che la configurazione specificata nell'opzione -c si trovi sulla macchina client.\n- L'opzione -listen richiede esattamente una configurazione o AssemblyLine da specificare.\n- L'opzione -listen esegue un AssemblyLine in modo sincrono. Non è necessario combinarlo con l'opzione -sync. - L'opzione -sync richiede che sia specificato esattamente un AssemblyLine .\n
STOP_USAGE = \nL'utilizzo per l'operazione di arresto è\: tdisrvctl [ general_options] -op stop -c config [ - r AL_list | all]\n                                    [ -f]\n\ndove\:\n -c config name of Config -r AL_list comma separated list of ALs to stop or keyword ' all'-f force a controlled shutdown of AssemblyLines Nota\:\n- L'opzione -c è obbligatoria.\n- La parola chiave ' all'indica tutti gli AssemblyLines.\n
TOMBSTONE_USAGE = \nL'utilizzo per l'operazione tombstone è\: tdisrvctl [ general_options] -op tombstone -c config [ - r AL_name]\n                                         [ - età n]\n                                         [ [ elenco_attributi] | tutti]\n\ndove\:\n -age n visualizza il record di eliminazione per gli ultimi ' n' giorni (il valore predefinito è 1 giorno)\n -c config name of Config -r AL_name name of Aseembly Line mostra tutti gli attributi Tombstone\n\nelenco_attributi\:\n -ct component type -cn component name -cfg configuration name -guid Tombstone entry's guid -et event type -ex exit code -stime component's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (valido solo per ALs)\n\nEsempio\: per visualizzare le voci di eliminazione degli ultimi 2 giorni (tutti attributi) per Config C1.xml tdisrvctl [ general_options] -op tombstone -c C1.xml -age 2 all Nota\:\n- L'opzione -c è obbligatoria.\n- Solo una delle opzioni -r \
    o -t è consentita. Non entrambe.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E La configurazione {0} non è caricata sul server {1}.
CONFIG_FOLDER_EMPTY = CTGDJB058I La cartella di configurazione sul server {0} è vuota.
REPORT_USAGE = \nL'utilizzo per l'operazione di report è\: tdisrvctl [ general_options] -op report [ - c config | -l]\n\ndove\:\n -c nome di configurazione della configurazione il cui report deve essere generato\n -l elenca le configurazioni nella cartella di configurazione del server remoto Nota\:\n- La configurazione specificata deve essere già caricata sul server remoto.\n- È consentita solo una delle opzioni -c o -l. Non entrambe.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E Il server {0} non supporta la cartella ''config''. Il supporto per la cartella ''config'' non è disponibile per i server precedenti alla versione 6.1.
EVENT_NOTIFICATION_USAGE = \nL'utilizzo per l'operazione dell'evento è\: tdisrvctl [ general_options] -op event -e event_name [ - s source]\n                                                    [ - d dati]\n\n\ndove\:\n -e nome_evento nome dell'evento da inviare\n -s source il nome dell'origine che richiama l'evento (valore predefinito tdisrvctl)\n -d data i dati (messaggio) da passare a un listener di evento (il valore predefinito è null) Nota\:\n- Tutti gli eventi inviati da tdisrvctl (opzione -e) sono automaticamente prefissati dalla stringa "user".\n\nEsempio\: per inviare un evento "user.process.X.completed" da "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin trigger event".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I L''evento {0} è stato inviato correttamente.
CONFIG_PROPERTIES_USAGE = \nL'utilizzo dell'operazione prop è\: tdisrvctl [ general_options] -op prop -c config [ -l] | [ [ - o store] [ [ - g key | all] | [ - s key\=value [ -e]] | [ - d key]]] \n\ndove\:\n -c nome di configurazione della configurazione da utilizzare\n -l elenca tutti gli archivi delle proprietà configurati\n -o nome dell'archivio delle proprietà da utilizzare\n -g key ottiene il valore della chiave specificata (o la parola chiave ' all'che implica l'acquisizione di tutte le chiavi)\n -s key\=valore imposta la chiave sul valore specificato\n -e codifica il valore durante l'inserimento nell'archivio (può essere utilizzato solo con l'opzione -s) -d chiave elimina la chiave specificata dall'archivio Nota\:\n- L'opzione -c è obbligatoria. La configurazione specificata deve essere una configurazione caricata sul server remoto.\n- Le opzioni -l, -g, -s e -d si escludono reciprocamente e non possono essere utilizzate insieme.\n- L'opzione -e può essere utilizzata solo con \
    l'opzione -s.\n- L'opzione -o è obbligatoria quando si utilizza l'opzione -d.\n\nEsempi\: per elencare tutti gli archivi proprietà per la configurazione C1.xml tdisrvctl -op prop -c C1.xml -l\n\nPer ottenere tutte le proprietà per la configurazione C1.xml tdisrvctl -op prop -c C1.xml -g all\n\nPer ottenere tutte le proprietà per la configurazione C1.xml dal negozio MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nPer impostare una proprietà MY_PROP sul valore MY_VALUE per Config C1.xml nel negozio MyStore e contrassegnarlo come protetto tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
