DEBUG_USAGE = \nL'utilizzo per l'operazione di debug è\: tdisrvctl [ general_options] -op debug -c config -r assembly_line [ - alc al_component]\n                               -on/off\n\ndove\:\n -c config ID istanza configurazione\n -r assembly_line name of AssemblyLine -alc al_component name of the AssemblyLine component -on flag per abilitare la modalità di debug off flag per disabilitare la modalità di debug Nota\:\n- Le opzioni -c e -r sono obbligatorie e richiedono la specifica di una sola configurazione /AssemblyLine .\n- Se l'opzione -alc non è specificata, verranno interessati tutti i componenti nell' AssemblyLine specificato.\n\nEsempi\: per visualizzare il valore della modalità di debug dei componenti negli AssemblyLines di una configurazione specificata tdisrvctl -op report -c config\n\nPer abilitare la modalità debug per tutti i componenti nell'esecuzione di AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 -on\n\nPer disabilitare la modalità di debug per i \
    componenti specificati nell' AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn -off\n\n
