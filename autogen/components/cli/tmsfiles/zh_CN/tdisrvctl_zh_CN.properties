DEBUG_USAGE = \n调试操作的用法为\: tdisrvctl [general_options] -op debug -c config -r assembly_line [-alc al_component]\n                               -on/off\n\n其中\:\n -c 配置配置实例标识\n -r assembly_line name of the AssemblyLine -alc al_component name of the AssemblyLine component -on flag to enable debug mode off flag to disable debug mode 注\:\n--c 和 -r 选项是必需的，需要正好指定一个 Config/AssemblyLine 。\n-如果未指定 -alc 选项，那么指定的 AssemblyLine 中的所有组件都将受到影响。\n\n示例\: 查看指定 Config tdisrvctl -op report -c config 的 AssemblyLines 中组件的调试方式值\n\n对正在运行的 AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 -on 中的所有组件启用调试方式\n\n要对正在运行的 AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread ，httpServer和 myconn off 中的指定组件禁用调试方式\n\n
