GEN_CMD_USAGE = \n用法 \:tdisrvctl [general_options] -op operation [operation_specific_options]\n\ngeneral_options\:\n -h 主机远程服务器 IP 地址或主机名 (缺省值为 localhost)\n SSL 密钥数据库文件的 -K 密钥库名称\n -p 端口号 (缺省值为 1099)\n -P key_pwd 密钥文件密码\n -s dir 指定解决方案目录所在的工作目录。\n SSL 信任库数据库文件的 -T 信任库名称\n -u userID 用户名 (用于定制认证)\n -v 以详细方式运行\n -w user_pwd 用户密码 (用于定制认证)\n -W trust_pwd 信任文件密码-?                  display 命令用法\n\n\n操作\:\n event send custom notification event prop manage Config properties queryop query an AssemblyLine for operations reload reload running Configs report generate Config report or list Configs on remote server shutdown 关闭服务器 srvinfo view SyncWeave server information status view status of Configs or AssemblyLines \n 启动特定配置或 AssemblyLines 停止特定配置或 AssemblyLine 墓碑视图墓碑条目特定配置或 AssemblyLine deletetombstone 删除正在运行的 AssemblyLine 中的墓碑条目调试调试组件\n\n要获取特定操作的帮助\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \n重新装入操作的用法为\: tdisrvctl [general_options] -op reload -c config_list\n\n其中\:\n -c config_list 要重新装入的配置的逗号分隔列表\n
SHUTDOWN_USAGE = \n关闭操作的用法为\: tdisrvctl [general_options] -op shutdown [-o return_code] [-f]\n\n其中\:\n -o return_code 关闭服务器，具有指定的返回码\n -f 强制受控关闭并退出所有 AssemblyLines\n\n
SRVINFO_USAGE = \nsrvinfo 操作的用法为：\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \n状态操作的用法为\: tdisrvctl [general_options] -op status [-c config_list | all]\n                                       [-r AL_list | all]\n                                       [-侦听]\n\n其中\:\n -c config_list 以逗号分隔的 Configs 或关键字 "all" 的列表\n -r AL_list 以逗号分隔的 ALs 或关键字 " all" 的列表 -listen 开始接收正在运行的 Config 或 AssemblyLine 的日志\n\n示例\: 查看所有已装入的配置和 ALs tdisrvctl [general_options] -op 状态的状态\n\n要查看所有正在运行的 ALs tdisrvctl [general_options] -op status -r all 的状态\n\n要查看特定装入的 Config tdisrvctl [general_options] -op status -c Config.xml -r all Note 的所有组件的状态\:\n-关键字 "all" 指示所有 Configs 或 AssemblyLines。\n--listen 选项需要正好指定一个 Config 或 AssemblyLine 。\n
START_USAGE = \n启动操作的用法为\: tdisrvctl [general_options] -op start -c config [-e password]\n                               [-r AL_list | all]\n                               [-s]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f 文件名]\n\t\t\t       [-m config_run_name -o storeName1\=value1， storeName2\=value2， storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-侦听]\n\t\t\t       [-同步]\n\n其中\:\n 要启动的配置的 -c 配置名称\n 配置文件的 -e 密码密码 (如果它受密码保护)\n -r AL_list 以逗号分隔的要启动的 AssemblyLines 列表或关键字 "all"\n -s 模拟方式在模拟方式 -alop opname AssemblyLine 操作中运行 AssemblyLine ，其中包含必需属性及其值\n -f 用于指定操作的文件名\n -m config run name run name of config -o property file list 逗号分隔的属性库名称和值列表\n -t 启动临时配置 -listen 接收指定的 Config 或 AssemblyLine -sync 同步执行 AssemblyLine 的日志注意\:\n--c 选项是必需的。\n-关键字 "all" 指示所有 AssemblyLines。\n--t 选项期望 -c 选项中指定的配置位于客户机上。\n--listen 选项需要正好指定一个 Config 或 AssemblyLine 。\n--listen 选项以同步方式执行 AssemblyLine 。 不需要将其与 -sync 选项结合使用。 --sync 选项要求正好指定一个 AssemblyLine 。\n
STOP_USAGE = \n停止操作的用法为\: tdisrvctl [general_options] -op stop -c config [-r AL_list | all]\n                                    [-f]\n\n其中\:\n -c config -r AL_list 逗号分隔的要停止的 ALs 列表或关键字 "all" -f 强制受控关闭 AssemblyLines 注\:\n--c 选项是必需的。\n-关键字 "all" 指示所有 AssemblyLines。\n
TOMBSTONE_USAGE = \ntombstone 操作的用法为\: tdisrvctl [general_options] -op tombstone -c config [-r AL_name]\n                                         [-年龄 n]\n                                         [[attribute_list] | 全部]\n\n其中\:\n -age n 显示过去 "n" 天的墓碑记录 (缺省值为 1 天)\n -c config -r AL_name name of Config -r AL_name name of A看似 Line all 显示所有 Tombstone 属性\n\n属性列表\:\n -ct component type -cn component name -cfg configuration name -guid Tombstone entry 's guid -et event type -ex exit code -stime component 's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (仅适用于 ALs)\n\n示例\: 要查看配置 C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2 的最近 2 天 Tombstone 条目 (所有属性) ，请注意\:\n--c 选项是必需的。\n-只允许 -r 或 -t 选项之一。 不是两者都有\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E 未将配置 {0} 装入服务器 {1}。
CONFIG_FOLDER_EMPTY = CTGDJB058I 服务器 {0} 上的 Config 文件夹内容为空。
REPORT_USAGE = \n报告操作的用法为\: tdisrvctl [general_options] -op report [-c config | -l]\n\n其中\:\n 要生成其报告的配置的 -c 配置名称\n -l 列出远程服务器的 Config 文件夹中的 Configs 注\:\n-必须已在远程服务器上装入指定的配置。\n-只允许使用 -c 或 -l 选项之一。 不是两者都有\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E 服务器 {0} 不支持“config”文件夹。 在版本低于 6.1 的服务器上不支持“config”文件夹。
EVENT_NOTIFICATION_USAGE = \n事件操作的用法为\: tdisrvctl [general_options] -op event -e event_name [-s source]\n                                                    [-d 数据]\n\n\n其中\:\n -e 要发送的事件的 event_name 名称\n -s source 调用事件的源的名称 (缺省值为 tdisrvctl)\n -d 数据要传递给事件侦听器的数据 (消息) (缺省值为空) 注意\:\n-从 tdisrvctl (-e 选项) 发送的所有事件都自动以字符串 "user" 作为前缀。\n\n示例\: 从 "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin 触发的事件" 发送事件 "user.process.X.completed"。\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I 事件 {0} 已成功发送。
CONFIG_PROPERTIES_USAGE = \nprop 操作的用法为\: tdisrvctl [general_options] -op prop -c config [-l] | [[-o store] [[-g key | all] | [-s key\=value [-e]] | [-d key]]] \n\n其中\:\n 要使用的配置的 -c 配置名称\n -l 列出所有已配置的属性库\n 要使用的属性库的 -o 名称\n -g key 获取指定键的值 (或关键字 "all" 表示获取所有键)\n -s key\=value 将键设置为指定的值\n -e 在放入商店时对值进行加密 (只能与 -s 选项配合使用) -d key 从商店中删除指定的密钥注\:\n--c 选项是必需的。 指定的配置应该是远程服务器上已装入的配置。\n--l ， -g ， -s 和 -d 选项互斥，不能一起使用。\n--e 选项只能与 -s 选项配合使用。\n-当使用 -d 选项时， -o 选项是必需的。\n\n示例\: 列出 Config C1.xml tdisrvctl -op prop -c C1.xml -l 的所有属性存储\n\n获取配置 C1.xml tdisrvctl -op prop -c C1.xml -g all 的所有属性\n\n从商店 MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all 获取配置 C1.xml 的所有属性\n\n将属性 MY_PROP 设置为商店 MyStore 中配置 C1.xml 的值 MY_VALUE ，并将其标记为受保护的 tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
