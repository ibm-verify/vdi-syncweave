DEBUG_USAGE = \nO uso para a operação de depuração é\: tdisrvctl [general_options] -op debug -c config -r assembly_line [-alc al_component]\n                               -on/off\n\nem que\:\n -c ID da instância de configuração\n -r assembly_line name of the AssemblyLine -alc al_component name of the AssemblyLine component -on flag para ativar o modo de depuração -off flag para desativar o modo de depuração Nota\:\n-As opções -c e -r são obrigatórias e requerem exatamente uma opção Config/AssemblyLine a ser especificada\n-Se a opção -alc não for especificada, todos os componentes na AssemblyLine especificada serão afetados\n\nExemplos\: Para visualizar o valor do modo de Depuração dos componentes nas AssemblyLines de um Config tdisrvctl -op report -c config especificado\n\nPara ativar o modo de depuração para todos os componentes na AssemblyLine al2 em execução tdisrvctl -op debug -c config_name -r al2 -on\n\nPara desativar o modo de depuração para componentes especificados na \
    AssemblyLine al3 em execução tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn -off\n\n
