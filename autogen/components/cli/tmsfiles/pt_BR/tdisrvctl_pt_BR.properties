GEN_CMD_USAGE = \nUso\: tdisrvctl [general_options] -op operação [operation_specific_options]\n\ngeneral_options\:\n -h endereço IP ou nome do host do servidor remoto do host (o padrão é localhost)\n -K nome do keystore do arquivo do banco de dados de chave SSL\n -p número da porta (o padrão é 1099)\n -P key_pwd senha do arquivo-chave\n -s dir Especifica o diretório de trabalho no qual o diretório da solução está localizado\n -T nome do armazenamento confiável do arquivo de banco de dados de armazenamento confiável SSL\n -u userID username (para autenticação customizada)\n -v executar no modo detalhado..\n -w user_pwd senha do usuário (para autenticação customizada)\n -W trust_pwd senha do arquivo confiável-?                  uso do comando de exibição\n\n\noperação\:\n O evento de envio de notificação customizada que o prop. de eventos gerencia a consulta do queryop de propriedades do Config em uma AssemblyLine para operações de recarregamento executando o relatório Configs gerar \
    relatório do Config ou listar Configs no encerramento do servidor remoto encerrar a visualização srvinfo do servidor SyncWeave status da visualização de status das informações do servidor de Configurações ou AssemblyLines \n iniciar configuração específica ou AssemblyLines parar parada específica de Config ou AssemblyLine tombstone visualizar entradas Tombstone para configuração específica ou AssemblyLine deletetombstone excluir componentes de depuração de depuração de entrada de tombstone em uma AssemblyLine em execução\n\nPara obter ajuda para uma operação específica\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \nO uso para operação de recarregamento é\: tdisrvctl [general_options] -op reload -c config_list\n\nem que\:\n -c config_list lista separada por vírgula de Configurações para recarregar\n
SHUTDOWN_USAGE = \nO uso para a operação de encerramento é\: tdisrvctl [general_options] -op shutdown [-o return_code] [-f]\n\nem que\:\n -o return_code encerrar o servidor com o código de retorno especificado\n -f forçar um encerramento controlado e sair de todas as AssemblyLines\n\n
SRVINFO_USAGE = \nO uso para a operação srvinfo é\:\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \nO uso para a operação de status é\: tdisrvctl [general_options] -op status [-c config_list | all]\n                                       [-r AL_list | todos]\n                                       [-ouvir]\n\nem que\:\n -c config_list lista separada por vírgula de configurações ou palavra-chave ' all'\n -r AL_list lista separada por vírgula de ALs ou palavra-chave ' all' -listen começa a receber os logs de uma Configuração em execução ou AssemblyLine\n\nExemplo\: Para ver o status de todos os Configs e ALs carregados tdisrvctl [general_options] -op status\n\nPara ver o status de todos os ALs em execução tdisrvctl [general_options] -op status -r all\n\nPara ver o status de todos os componentes de um determinado Config tdisrvctl [general_options] -op status -c Config.xml -r all Nota\:\n-A palavra-chave ' all' indica todos os Configs ou AssemblyLines\n-A opção -listen requer que exatamente um Config ou AssemblyLine seja especificado\n
START_USAGE = \nO uso para a operação inicial é\: tdisrvctl [general_options] -op start -c config [-e password]\n                               [-r AL_list | todos]\n                               [-s]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}|\n                                -f nome do arquivo]\n\t\t\t       [-m config_run_name -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-ouvir]\n\t\t\t       [-sincronização]\n\nem que\:\n -c nome da configuração para iniciar\n -e senha do arquivo de configuração se ele for protegido por senha\n -r AL_list lista separada por vírgula de AssemblyLines para iniciar ou palavra-chave ' all'\n -s simulam a operação de execução do modo AssemblyLine no modo simulado -alop opname AssemblyLine com atributos necessários e seus valores\n -f filename filename para especificar as operações\n -m config run name run name of config -o property file list \
    lista separada por vírgulas de nomes e valores de armazenamento de propriedades\n -t iniciar uma lista de configuração temporária receber os logs da configuração especificada ou AssemblyLine -sync executar AssemblyLine de forma síncrona Nota\:\nA opção -c é obrigatória.\n-A palavra-chave ' all' indica todas as AssemblyLines.\n-A opção -t espera que o Config especificado na opção -c esteja localizado na máquina cliente\n-A opção -listen requer que exatamente um Config ou AssemblyLine seja especificado\n-A opção -listen executa uma AssemblyLine sincronicamente. Não é necessário combiná-lo com a opção -sync. -A opção -sync requer que exatamente uma AssemblyLine seja especificada\n
STOP_USAGE = \nO uso para a operação de parada é\: tdisrvctl [general_options] -op stop -c config [-r AL_list | all]\n                                    [-f]\n\nem que\:\n -c config name of Config -r AL_list lista separada por vírgula de ALs para parar ou palavra-chave ' all' -f forçar um encerramento controlado de AssemblyLines Nota\:\nA opção -c é obrigatória.\n-A palavra-chave ' all' indica todas as AssemblyLines.\n
TOMBSTONE_USAGE = \nO uso para a operação tombstone é\: tdisrvctl [general_options] -op tombstone -c config [-r AL_name]\n                                         [-idade n]\n                                         [[attribute_list] | todos]\n\nem que\:\n -age n exibir registro tombstone para os últimos ' n' dias (o padrão é 1 dia)\n -c config name of Config -r AL_name name of Asemontagem Line todos mostram todos os atributos do Tombstone\n\nattribute_list\:\n -ct component type -cn component name -cfg configuration name -guid guid do Tombstone entry guid -et event type -ex exit code -stime component's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (válido apenas para ALs)\n\nExemplo\: para ver os últimos 2 dias de entradas Tombstone (todos os atributos) para Config C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2 all Nota\:\nA opção -c é obrigatória.\n-Apenas uma das opções -r ou -t é permitida Não os dois.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E A Configuração {0} não está carregada no servidor {1}.
CONFIG_FOLDER_EMPTY = CTGDJB058I A pasta de Configuração no servidor {0} está vazia.
REPORT_USAGE = \nO uso para operação de relatório é\: tdisrvctl [general_options] -op report [-c config | -l]\n\nem que\:\n -c config name do Config cujo relatório deve ser gerado\n -l listar os Configs na pasta Config do servidor remoto Nota\:\n-O Config especificado já deve estar carregado no servidor remoto\n-Apenas uma das opções -c ou -l é permitida Não os dois.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E O servidor {0} não suporta a pasta ''config''. O suporte à pasta ''config'' não está disponível no servidores pré-6.1.
EVENT_NOTIFICATION_USAGE = \nO uso para operação de evento é\: tdisrvctl [general_options] -op event -e event_name [-s source]\n                                                    [-d dados]\n\n\nem que\:\n -e event_name nome do evento a ser enviado\n -s o nome da origem que chama o evento (padrão tdisrvctl)\n -d dados os dados (mensagem) a serem transmitidos para um listener de eventos (o padrão é nulo) Nota\:\n-Todos os eventos enviados de tdisrvctl (opção-e) são prefixados automaticamente pela sequência "user".\n\nExemplo\: para enviar um evento "user.process.X.completed" de "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin acionado evento".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I O evento {0} foi enviado com êxito.
CONFIG_PROPERTIES_USAGE = \nO uso para a operação prop é\: tdisrvctl [general_options] -op prop -c config [-l] | [[-o store] [[-g key | all] | [-s key\=value [-e]] | [-d key]]] \n\nem que\:\n -c nome de configuração do Config a ser usado\n -l lista todos os armazenamentos de propriedade configurados\n -o nome do armazenamento de propriedades para usar\n -g key obtém o valor da chave especificada (ou palavra-chave ' all' implicando obter todas as chaves)\n -s key\=value configurar a chave para o valor especificado\n -e criptografar o valor ao colocar no armazenamento (pode ser usado apenas com a opção -s) -d chave excluir a chave especificada do armazenamento Nota\:\nA opção -c é obrigatória. A Configuração especificada deve ser uma Configuração carregada no servidor remoto.\nAs opções -l, -g, -s e -d são mutuamente exclusivas e não podem ser usadas juntas.\n-A opção -e pode ser usada com apenas a opção -s.\n-A opção -o é obrigatória ao usar a opção -d..\n\nExemplos\: Para listar \
    todos os armazenamentos de propriedades para Config C1.xml tdisrvctl -op prop -c C1.xml -l\n\nPara obter todas as propriedades para Config C1.xml tdisrvctl -op prop -c C1.xml -g all\n\nPara obter todas as propriedades para Config C1.xml do armazenamento MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nPara configurar uma propriedade MY_PROP para o valor MY_VALUE para Config C1.xml no armazenamento MyStore e marcá-la como protegida tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
PROP_OPTIONS_MUTUALLY_EXCLUSIVE = CTGDJB064E Pode ser especificada apenas uma das opções\: -l, -g, -s e -d. Elas não podem ocorrer em conjunto.
