GEN_CMD_USAGE=\nUsage:\ntdisrvctl [general_options] -op operation [operation_specific_options]\n\ngeneral_options:\n -h  host            remote server IP address or hostname(default is localhost)\n -K  keystore        name of the SSL key database file\n -p  port            port number(default is 1099)\n -P  key_pwd         key file password\n -s  dir             Specifies the working directory where the solution directory is located.\n -T  truststore      name of the SSL trust store database file\n -u  userID          username(for custom authentication)\n -v                  run in verbose mode\n -w  user_pwd        user password(for custom authentication)\n -W  trust_pwd       trust file password\n -?                  display command usage\n\n\noperation:\n event               send custom notification event\n prop                manage Config properties\n queryop             query an AssemblyLine for operations\n reload              reload running Configs\n report              generate Config report or list Configs on remote server\n shutdown            shut down the server\n srvinfo             view SyncWeave server information\n status              view status of Configs or AssemblyLines \n start               start specific Config or AssemblyLines \n stop                stop specific Config or AssemblyLine \n tombstone           view Tombstone entries for specific Config or AssemblyLine \n deletetombstone     delete a tombstone entry\n debug               debug components in a running AssemblyLine\n\nTo get help for a specific operation:\ntdisrvctl -op operation -?\n
RELOAD_USAGE=\nThe usage for reload operation is:\ntdisrvctl [general_options] -op reload -c config_list\n\nwhere:\n -c config_list    comma separated list of Configs to reload\n
SHUTDOWN_USAGE=\nThe usage for shutdown operation is:\ntdisrvctl [general_options] -op shutdown [-o return_code] [-f]\n\nwhere:\n -o return_code    shutdown server with specified return code\n -f                force a controlled shutdown and exit all AssemblyLines\n\n
SRVINFO_USAGE=\nThe usage for srvinfo operation is:\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE=\nThe usage for status operation is:\ntdisrvctl [general_options] -op status [-c config_list | all]\n                                       [-r AL_list     | all]\n                                       [-listen ]\n\nwhere:\n -c config_list   comma separated list of Configs  or keyword 'all'\n -r AL_list       comma separated list of ALs or keyword 'all'\n -listen          start receiving the logs of a running Config or AssemblyLine\n\nExample:\nTo see the status of all loaded Configs and ALs\ntdisrvctl [general_options] -op status\n\nTo see the status of all running ALs\ntdisrvctl [general_options] -op status -r all\n\nTo see the status of all components of a particular loaded Config\ntdisrvctl [general_options] -op status -c Config.xml -r all\n\nNote:\n- The keyword 'all' indicates all Configs or AssemblyLines.\n- The -listen option requires exactly one Config or AssemblyLine to be specified.\n
START_USAGE=\nThe usage for the start operation is:\ntdisrvctl [general_options] -op start -c config\n                               [-e password]\n                               [-r AL_list | all]\n                               [-s ]\n                               [-r AL_list -alop opname [{attr1:value1;attr2:value2;attrN:valueN}]|\n                                -f filename]\n			       [-m config_run_name -o storeName1=value1, storeName2=value2, storenameN=valueN]\n			       [-t ]\n			       [-listen ]\n			       [-sync ]\n\nwhere:\n -c     config              name of config to start\n -e     password            password of the config file if it is password protected\n -r     AL_list             comma separated list of AssemblyLines to start or keyword 'all'\n -s     simulate mode       run AssemblyLine in simulate mode\n -alop  opname              AssemblyLine operation with required attributes and their values\n -f     filename            filename to specify the operations\n -m     config run name     run name of config \n -o     property file list  comma separated list of property store names and values\n -t                         start a temporary Config\n -listen                    receive the logs of the specified Config or AssemblyLine\n -sync                      execute AssemblyLine synchronously\n\nNote:\n- The -c option is mandatory.\n- The keyword 'all' indicates all AssemblyLines.\n- The -t option expects the Config specified in the -c option to be located on the client machine.\n- The -listen option requires exactly one Config or AssemblyLine to be specified.\n- The -listen option executes an AssemblyLine synchronously. There is no need to combine it with the -sync option. - The -sync option requires exactly one AssemblyLine to be specified.\n
STOP_USAGE=\nThe usage for stop operation is:\ntdisrvctl [general_options] -op stop -c config\n                                    [-r AL_list | all]\n                                    [-f]\n\nwhere:\n -c config     name of Config \n -r AL_list    comma separated list of ALs to stop or keyword 'all' \n -f            force a controlled shutdown of AssemblyLines\n\nNote:\n- The -c option is mandatory.\n- The keyword 'all' indicates all AssemblyLines.\n
TOMBSTONE_USAGE=\nThe usage for tombstone operation is:\ntdisrvctl [general_options] -op tombstone -c config \n                                         [-r AL_name]\n                                         [-age n]\n                                         [[attribute_list] | all ]\n\nwhere:\n -age n             display tombstone record for the last 'n' days\n                    (default is 1 day)\n -c   config        name of Config \n -r   AL_name       name of Aseembly Line  \n all                show all Tombstone attributes\n\nattribute_list:\n -ct                component type\n -cn                component name\n -cfg               configuration name\n -guid              Tombstone entry's guid\n -et                event type\n -ex                exit code\n -stime             component's start time\n -ctime             Tombstone create time\n -desc              error description\n -um                user message\n -stat              statistics (valid for ALs only)\n\nExample:\nTo see the last 2 days Tombstone entries (all attributes) for Config C1.xml\ntdisrvctl [general_options] -op tombstone -c C1.xml -age 2 all\n\nNote:\n- The -c option is mandatory.\n- Only one of the -r or -t option is allowed. Not both.\n
CONFIG_NOT_LOADED_ERR=CTGDJB057E The Config {0} is not loaded on the server {1}.
CONFIG_FOLDER_EMPTY=CTGDJB058I The Config folder on server {0} is empty.
REPORT_USAGE=\nThe usage for report operation is:\ntdisrvctl [general_options] -op report [-c config | -l]\n\nwhere:\n -c config     name of the Config whose report is to be generated\n -l            list the Configs in the remote server's Config folder\n\nNote:\n- The specified Config must be already loaded on the remote server.\n- Only one of the -c or -l option is allowed. Not both.\n
CONFIG_FOLDER_UNSUPPORTED=CTGDJB060E The server {0} does not support 'config' folder. The 'config' folder support is not available in pre-6.1 servers.
EVENT_NOTIFICATION_USAGE=\nThe usage for event operation is:\ntdisrvctl [general_options] -op event -e event_name [-s source]\n                                                    [-d data]\n\n\nwhere:\n -e event_name     name of the event to send\n -s source         the name of the source invoking the\n                   event (default tdisrvctl)\n -d data           the data (message) to be passed to an \n                   event listener (default is null)\n\nNote:\n- All events sent from tdisrvctl (-e option) are automatically prefixed by the string \"user\".\n\nExample:\nTo send an event \"user.process.X.completed\" from \"admin\" \ntdisrvctl -h hostname -op event -e \"process.X.completed\" -s admin -d \"Admin triggered event\".\n
EVENT_NOTIFICATION_SUCCESSFUL=CTGDJB062I The event {0} successfully sent.
CONFIG_PROPERTIES_USAGE=\nThe usage for prop operation is:\ntdisrvctl [general_options] -op prop -c config [-l] | \n          [ [-o store] [[-g key | all]  |  [-s key=value [-e]] | [-d key]] ] \n\nwhere:\n -c config     name of the Config to use\n -l            list all the configured property stores\n -o            name of the property store to use\n -g key        get the value of the specified key (or keyword 'all'\n               implying get all keys)\n -s key=value  set the key to the specified value\n -e            encrypt the value when putting in the store (can \n               be used with -s option only) \n -d key        delete the specified key from the store\nNote:\n- The -c option is mandatory. The specified Config should be a loaded Config on the remote server.\n- The -l, -g, -s, and -d options are mutually exclusive, and cannot be used together.\n- The -e option can be used with only the -s option.\n- The -o option is mandatory when using the -d option.\n\nExamples:\nTo list all property stores for Config C1.xml\ntdisrvctl -op prop -c C1.xml -l\n\nTo get all properties for Config C1.xml\ntdisrvctl -op prop -c C1.xml -g all\n\nTo get all properties for Config C1.xml from store MyStore\ntdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nTo set a property MY_PROP to value MY_VALUE for Config C1.xml in store MyStore and mark it as protected\ntdisrvctl -op prop -c C1.xml -o MyStore -s \"MY_PROP=MY_VALUE\" -e\n
PROP_OPTIONS_MUTUALLY_EXCLUSIVE=CTGDJB064E Only one of the options -l, -g, -s, and -d can be specified. They cannot occur together.
