DEBUG_USAGE=\nThe usage for the debug operation is:\ntdisrvctl [general_options] -op debug -c config -r assembly_line\n                               [-alc al_component]\n                               -on/off\n\nwhere:\n -c     config              config instance ID\n -r     assembly_line       name of the AssemblyLine\n -alc   al_component        name of the AssemblyLine component\n -on                        flag to enable debug mode\n -off                       flag to disable debug mode\n\nNote:\n- The -c and -r options are mandatory and require exactly one Config/AssemblyLine to be specified.\n- If -alc option is not specified all components in the specified AssemblyLine will be affected.\n\nExamples:\nTo view the Debug mode value of the components in the AssemblyLines of a specified Config\ntdisrvctl -op report -c config\n\nTo enable the debug mode for all components in the running AssemblyLine al2\ntdisrvctl -op debug -c config_name -r al2 -on\n\nTo disable the debug mode for specified components in the running AssemblyLine al3\ntdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer,myconn -off\n\n
