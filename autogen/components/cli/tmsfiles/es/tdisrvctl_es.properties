GEN_CMD_USAGE = \nUso\: tdisrvctl [opciones_generales] -op operación [opciones_específicas de operación]\n\nopciones_generales\:\n -h host servidor remoto dirección IP o nombre de host (el valor predeterminado es localhost)\n -K nombre de almacén de claves del archivo de base de datos de claves SSL\n -p número de puerto (el valor predeterminado es 1099)\n -P contraseña de archivo de claves key_pwd\n -s dir Especifica el directorio de trabajo donde se encuentra el directorio de solución.\n -T nombre de almacén de confianza del archivo de base de datos de almacén de confianza SSL\n -u userID username (para autenticación personalizada)\n -v ejecutar en modalidad detallada\n -w contraseña_usuario_contraseña (para autenticación personalizada)\n -W contraseña de archivo de confianza trust_pwd-?                  uso de mandatos de visualización\n\n\noperación\:\n event send custom notification event prop manage Config properties queryop query an AssemblyLine for operations reload reload \
    running Configs report generate Config report or list Configs on remote server shutdown down the server srvinfo view SyncWeave server information status view status status of Configs or AssemblyLines \n start start start specific Config o AssemblyLines stop stop specific Config o AssemblyLine tombstone view Tombstone entries for specific Config o AssemblyLine deletetombstone delete a tombstone entry debug debug components in a running AssemblyLine\n\nPara obtener ayuda para una operación específica\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \nEl uso para la operación de recarga es\: tdisrvctl [opciones_generales] -op reload -c lista_config\n\ndonde\:\n -c config_list lista separada por comas de Configs a recargar\n
SHUTDOWN_USAGE = \nEl uso para la operación de conclusión es\: tdisrvctl [opciones_generales] -op shutdown [-o código_retorno] [-f]\n\ndonde\:\n -o return_code shutdown server con el código de retorno especificado\n -f forzar una conclusión controlada y salir de todas las AssemblyLines\n\n
SRVINFO_USAGE = \nLas indicaciones de uso para la operación srvinfo son\:\ntdisrvctl [opciones_generales] -op srvinfo\n
STATUS_USAGE = \nEl uso para la operación de estado es\: tdisrvctl [opciones_generales] -op status [-c lista_config | all]\n                                       [-r lista_AL | all]\n                                       [-escuchar]\n\ndonde\:\n -c config_list lista separada por comas de Configs o palabra clave ' all'\n -r AL_list lista separada por comas de ALs o palabra clave ' all' -listen iniciar la recepción de los registros de una configuración en ejecución o AssemblyLine\n\nEjemplo\: Para ver el estado de todos los Configs y ALs cargados tdisrvctl [opciones_generales] -op estado\n\nPara ver el estado de todos los ALs en ejecución tdisrvctl [opciones_generales] -op status -r all\n\nPara ver el estado de todos los componentes de una determinada Config tdisrvctl [opciones_generales] -op status -c Config.xml -r all Nota\:\n-La palabra clave ' all' indica todas las Configs o AssemblyLines.\n-La opción -listen requiere que se especifique exactamente una configuración o una AssemblyLine .\n
START_USAGE = \nEl uso para la operación de inicio es\: tdisrvctl [opciones_generales] -op start -c config [-e contraseña]\n                               [-r lista_AL | all]\n                               [-s]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f nombre_archivo]\n\t\t\t       [-m config_run_name -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-escuchar]\n\t\t\t       [-sync]\n\ndonde\:\n -c nombre de configuración de la configuración que se va a iniciar\n -e contraseña del archivo de configuración si está protegido por contraseña\n -r AL_list lista separada por comas de AssemblyLines para iniciar o palabra clave ' all'\n -s simulate mode run AssemblyLine in simulate mode -alop opname AssemblyLine operation with required attributes and their values\n -f nombre de archivo para especificar las operaciones\n -m config ejecutar nombre \
    ejecutar nombre de config -o archivo de propiedades lista separada por comas lista de nombres y valores de almacén de propiedades\n -t iniciar una configuración temporal -listen recibir los registros de la configuración especificada o AssemblyLine -sync ejecutar AssemblyLine de forma síncrona Nota\:\n-La opción -c es obligatoria.\n-La palabra clave ' all' indica todas las AssemblyLines.\n-La opción -t espera que la configuración especificada en la opción -c se encuentre en la máquina cliente.\n-La opción -listen requiere que se especifique exactamente una configuración o una AssemblyLine .\n-La opción -listen ejecuta una AssemblyLine de forma síncrona. No es necesario combinarlo con la opción -sync. -La opción -sync requiere que se especifique exactamente una AssemblyLine .\n
STOP_USAGE = \nEl uso para la operación de detención es\: tdisrvctl [opciones_generales] -op stop -c config [-r lista_AL | all]\n                                    [-f]\n\ndonde\:\n -c config name of Config -r AL_list lista separada por comas de los AL a detener o palabra clave ' all' -f forzar una conclusión controlada de AssemblyLines Nota\:\n-La opción -c es obligatoria.\n-La palabra clave ' all' indica todas las AssemblyLines.\n
TOMBSTONE_USAGE = \nEl uso de la operación tombstone es\: tdisrvctl [opciones_generales] -op tombstone -c config [-r AL_name]\n                                         [-edad n]\n                                         [[lista_atributos] | all]\n\ndonde\:\n -age n muestra el registro tombstone de los últimos ' n' días (el valor predeterminado es 1 día)\n -c config name of Config -r AL_name name of Asemontaje Line all show all Tombstone attributes\n\nlista_atributos\:\n -ct tipo componente -cn nombre componente -cfg nombre configuración -guid guid entrada guid -et tipo suceso -ex código salida -stime hora inicio del componente -ctime hora creación Tombstone -desc descripción error -um mensaje usuario -stat estadísticas (válido solo para ALs)\n\nEjemplo\: Para ver las entradas de Tombstone de los últimos 2 días (todos los atributos) para Config C1.xml tdisrvctl [opciones_generales] -op tombstone -c C1.xml -age 2 all Nota\:\n-La opción -c es obligatoria.\n-Sólo se permite una de las \
    opciones -r o -t. No ambos.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E La configuración {0} no está cargada en el servidor {1} 
CONFIG_FOLDER_EMPTY = CTGDJB058I La carpeta de configuración del servidor {0} está vacía.
REPORT_USAGE = \nEl uso para la operación de informe es\: tdisrvctl [opciones_generales] -op report [-c config | -l]\n\ndonde\:\n -c nombre de configuración de la configuración cuyo informe se va a generar\n -l listar las configuraciones en la carpeta de configuración del servidor remoto Nota\:\n-La configuración especificada ya debe estar cargada en el servidor remoto.\n-Sólo se permite una de las opciones -c o -l. No ambos.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E El servidor {0} no soporta la carpeta ''config''. El soporte de la carpeta ''config'' no está disponible en los servidores anteriores a la versión 6.1.
EVENT_NOTIFICATION_USAGE = \nEl uso para la operación de suceso es\: tdisrvctl [opciones_general] -op event -e nombre_suceso [-s origen]\n                                                    [-d datos]\n\n\ndonde\:\n -e nombre_suceso nombre del suceso que se va a enviar\n -s obtener el nombre del origen que invoca el suceso (valor predeterminado tdisrvctl)\n -d data los datos (mensaje) que se van a pasar a un escucha de sucesos (el valor predeterminado es nulo) Nota\:\n-Todos los eventos enviados desde tdisrvctl (opción-e) son automáticamente precedidos por la cadena "user".\n\nEjemplo\: Para enviar un suceso "user.process.X.completed" desde "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Suceso desencadenado por administrador".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I El suceso {0} se ha enviado correctamente.
CONFIG_PROPERTIES_USAGE = \nEl uso para la operación prop es\: tdisrvctl [opciones_generales] -op prop -c config [-l] | [[-o store] [[-g key | all] | [-s clave\=valor [-e]] | [-d clave]]] \n\ndonde\:\n -c nombre de configuración de la configuración a utilizar\n -l listar todos los almacenes de propiedades configurados\n -o nombre del almacén de propiedades a utilizar\n -g key obtener el valor de la clave especificada (o la palabra clave ' all' que implica obtener todas las claves)\n -s clave\=valor establecer la clave en el valor especificado\n -e cifrar el valor al poner en la tienda (sólo se puede utilizar con la opción -s) -d clave suprimir la clave especificada de la tienda Nota\:\n-La opción -c es obligatoria. La configuración especificada debe ser una configuración cargada en el servidor remoto.\n-Las opciones -l, -g, -s y -d son mutuamente excluyentes y no se pueden utilizar juntas.\n-La opción -e se puede utilizar sólo con la opción -s.\n-La opción -o es obligatoria cuando \
    se utiliza la opción -d.\n\nEjemplos\: Para listar todos los almacenes de propiedades para Config C1.xml tdisrvctl -op prop -c C1.xml -l\n\nPara obtener todas las propiedades de la configuración C1.xml tdisrvctl -op prop -c C1.xml -g all\n\nPara obtener todas las propiedades para la configuración C1.xml de la tienda MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nPara establecer una propiedad MY_PROP en el valor MY_VALUE para Config C1.xml en la tienda MyStore y marcarla como protegida tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
PROP_OPTIONS_MUTUALLY_EXCLUSIVE = CTGDJB064E Sólo se puede especificar una de las opciones -l, -g, -s y -d. No se pueden especificar juntas.
