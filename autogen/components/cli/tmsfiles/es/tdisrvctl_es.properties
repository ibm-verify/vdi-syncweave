DEBUG_USAGE = \nEl uso de la operación de depuración es\: tdisrvctl [opciones_generales] -op debug -c config -r assembly_line [-alc al_component]\n                               -on/desactivado\n\ndonde\:\n -c ID de instancia de configuración de configuración\n -r nombre_línea_ensamblaje de la AssemblyLine -alc nombre_componente del componente AssemblyLine para habilitar el distintivo -off de modalidad de depuración para inhabilitar la modalidad de depuración Nota\:\n-Las opciones -c y -r son obligatorias y requieren que se especifique exactamente una Config/AssemblyLine .\n-Si no se especifica la opción -alc, se verán afectados todos los componentes de la AssemblyLine especificada.\n\nEjemplos\: para ver el valor de modalidad de depuración de los componentes en AssemblyLines de una configuración especificada tdisrvctl -op report -c config\n\nPara habilitar la modalidad de depuración para todos los componentes en la ejecución de AssemblyLine al2 tdisrvctl -op debug -c config_name -r \
    al2 -on\n\nPara inhabilitar la modalidad de depuración para componentes especificados en la ejecución de AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn -off\n\n
