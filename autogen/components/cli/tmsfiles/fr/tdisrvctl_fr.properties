DEBUG_USAGE = \nLa syntaxe de l'opération de débogage est la suivante\: tdisrvctl [ general_options ] -op debug -c config -r assembly_line [-alc al_component ]\n                               -on/off\n\noù\:\n -c config config ID instance\n -r assembly_line name of the AssemblyLine -alc al_component name of the AssemblyLine component flag to enable debug mode off flag to disable debug mode Remarque\:\n-Les options -c et -r sont obligatoires et requièrent la spécification d'une seule valeur Config/AssemblyLine .\n-Si l'option -alc n'est pas spécifiée, tous les composants de la AssemblyLine spécifiée seront affectés.\n\nExemples\: pour afficher la valeur du mode débogage des composants dans les AssemblyLines d'une configuration spécifiée tdisrvctl -op report -c config\n\nPour activer le mode débogage pour tous les composants de la AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 en cours d'exécution\n\nPour désactiver le mode débogage pour les composants spécifiés dans la \
    AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn off\n\n
