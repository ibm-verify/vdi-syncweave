GEN_CMD_USAGE = \nSyntaxe\: tdisrvctl [ options_générales ] -op operation [ options_spécif_opération ]\n\noptions_générales\:\n -h adresse IP ou nom d'hôte du serveur distant de l'hôte (la valeur par défaut est localhost)\n -K nom de magasin de clés du fichier de la base de données de clés SSL\n -p numéro de port (la valeur par défaut est 1099)\n -P mot de passe du fichier de clés key_pwd\n -s dir Indique le répertoire de travail dans lequel se trouve le répertoire de solutions.\n -T nom du magasin de clés de confiance du fichier de base de données du magasin de clés de confiance SSL\n -u userID nom d'utilisateur (pour l'authentification personnalisée)\n -v exécuter en mode prolixe\n -w user_pwd Mot de passe de l'utilisateur (pour l'authentification personnalisée)\n -W mot de passe du fichier de clés certifiées trust_pwd-?                  utilisation de la commande display\n\n\nopération\:\n event send custom notification event prop manage Config properties queryop query an \
    AssemblyLine for operations reload reload running Configs report generate Config report or list Configs on remote server shutdown shutdown the server srvinfo view IBM Security Verify Directory Integrator server information status view status status of Configs or AssemblyLines \n start start specific Config ou AssemblyLines stop stop specific Config ou AssemblyLine tombstone view Tombstone entries for specific Config ou AssemblyLine deletetombstone delete a tombstone entry debug debug components in a running AssemblyLine\n\nPour obtenir de l'aide sur une opération spécifique\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \nLa syntaxe de l'opération de rechargement est la suivante\: tdisrvctl [ general_options ] -op reload -c config_list\n\noù\:\n -c config_list Liste séparée par des virgules des configurations à recharger\n
SHUTDOWN_USAGE = \nLa syntaxe de l'opération d'arrêt est la suivante\: tdisrvctl [ general_options ] -op shutdown [-o code_retour ] [ -f ]\n\noù\:\n -o return_code Arrêt du serveur avec le code retour spécifié\n -f Force un arrêt contrôlé et quitte toutes les AssemblyLines\n\n
SRVINFO_USAGE = \nLa syntaxe de l'opération srvinfo est \:\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \nLa syntaxe de l'opération de statut est\: tdisrvctl [ general_options ] -op status [-c config_list | all ]\n                                       [-r AL_list | tous ]\n                                       [-écouter ]\n\noù\:\n -c config_list Liste séparée par des virgules des configurations ou du mot clé'all'\n -r AL_list Liste séparée par des virgules des ALs ou du mot clé'all' -listen start recevant les journaux d'une configuration ou d'une AssemblyLine en cours d'exécution\n\nExemple\: Pour afficher le statut de toutes les configurations et tous les ALs chargés, entrez tdisrvctl [ general_options ] -op status\n\nPour afficher le statut de toutes les ALs en cours d'exécution tdisrvctl [ general_options ] -op status -r all\n\nPour afficher le statut de tous les composants d'une configuration chargée particulière, procédez comme suit\: Config tdisrvctl [ general_options ] -op status -c Config.xml -r all Remarque\:\n-Le mot clé'all' indique toutes les \
    configurations ou AssemblyLines.\n-L'option -listen requiert qu'une seule configuration ou AssemblyLine soit spécifiée.\n
START_USAGE = \nLa syntaxe de l'opération de démarrage est la suivante\: tdisrvctl [ general_options ] -op start -c config [-e password ]\n                               [-r AL_list | tous ]\n                               [-s ]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f nom_fichier ]\n\t\t\t       [-m nom_exécution_config -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [-t ]\n\t\t\t       [-écouter ]\n\t\t\t       [-sync ]\n\noù\:\n -c config Nom de la configuration à démarrer\n -e mot de passe du fichier de configuration s'il est protégé par mot de passe\n -r AL_list Liste séparée par des virgules des AssemblyLines à démarrer ou mot clé'all'\n -s simulmode run AssemblyLine in simulmode -alop opname AssemblyLine avec les attributs requis et leurs valeurs\n -f nom_fichier nom de fichier pour spécifier les opérations\n -m config run name run name of config -o \
    property file list Liste de noms et de valeurs de magasin de propriétés séparés par des virgules\n -t start a temporary Config -listen reçoit les journaux de la configuration spécifiée ou AssemblyLine -sync execute AssemblyLine de manière synchrone Remarque\:\n-L'option -c est obligatoire.\n-Le mot clé'all' indique toutes les AssemblyLines.\n-L'option -t attend que la configuration spécifiée dans l'option -c se trouve sur la machine client.\n-L'option -listen requiert qu'une seule configuration ou AssemblyLine soit spécifiée.\n-L'option -listen exécute une AssemblyLine de manière synchrone. Il n'est pas nécessaire de le combiner avec l'option -sync. -L'option -sync requiert qu'une seule AssemblyLine soit spécifiée.\n
STOP_USAGE = \nLa syntaxe de l'opération d'arrêt est la suivante\: tdisrvctl [ general_options ] -op stop -c config [-r AL_list | all ]\n                                    [ -f ]\n\noù\:\n -c config name of Config -r AL_list Liste séparée par des virgules des ALs à arrêter ou mot clé'all' -f force un arrêt contrôlé de AssemblyLines Remarque\:\n-L'option -c est obligatoire.\n-Le mot clé'all' indique toutes les AssemblyLines.\n
TOMBSTONE_USAGE = \nLa syntaxe de l'opération tombstone est la suivante\: tdisrvctl [ general_options ] -op tombstone -c config [-r AL_name ]\n                                         [-age n ]\n                                         [ [ liste_attributs ] | tous ]\n\noù\:\n -age n affiche l'enregistrement de tombstone pour les'n'derniers jours (la valeur par défaut est 1 jour)\n -c config nom de la configuration -r AL_name nom de la ligne d'assemblage all affiche tous les attributs de tombstone\n\nliste_attributs\:\n -ct type de composant -cn nom de composant -cfg nom de configuration -guid identificateur global unique de l'entrée Tombstone -et type d'événement -ex code de sortie -stime heure de début du composant -ctime Heure de création de Tombstone -desc description de l'erreur -um message utilisateur -stat statistiques (valides uniquement pour les ALs)\n\nExemple\: Pour voir les 2 derniers jours, les entrées de tombstone (tous les attributs) pour Config C1.xml tdisrvctl [ \
    general_options ] -op tombstone -c C1.xml -age 2 all Remarque\:\n-L'option -c est obligatoire.\n-Une seule option -r ou -t est admise. Pas les deux.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E La configuration {0} n''est pas chargée sur le serveur {1}.
CONFIG_FOLDER_EMPTY = CTGDJB058I Le dossier de configuration sur le serveur {0} est vide.
REPORT_USAGE = \nLa syntaxe de l'opération de rapport est la suivante\: tdisrvctl [ general_options ] -op report [-c config | -l ]\n\noù\:\n -c config Nom de la configuration dont le rapport doit être généré\n -l répertorie les configurations dans le dossier de configuration du serveur distant Remarque\:\n-La configuration spécifiée doit être déjà chargée sur le serveur distant.\n-Une seule des options -c ou -l est autorisée. Pas les deux.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E Le serveur {0} ne prend pas en charge le dossier ''config''. La prise en charge du dossier ''config'' n''est pas assurée sur les serveurs antérieurs à la version 6.1.
EVENT_NOTIFICATION_USAGE = \nLa syntaxe de l'opération d'événement est la suivante\: tdisrvctl [ general_options ] -op event -e nom_événement [-s source ]\n                                                    [-d données ]\n\n\noù\:\n -e nom_événement nom de l'événement à envoyer\n -s source nom de la source appelant l'événement (tdisrvctl par défaut)\n -d les données (message) à transmettre à un programme d'écoute d'événement (la valeur par défaut est null). Remarque\:\n-Tous les événements envoyés à partir de tdisrvctl (option-e) sont automatiquement préfixés par la chaîne "user".\n\nExemple\: pour envoyer un événement "user.process.X.completed" à partir de "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin triggered event".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I L''événement {0} a été envoyé.
CONFIG_PROPERTIES_USAGE = \nLa syntaxe de l'opération prop est la suivante\: tdisrvctl [ general_options ] -op prop -c config [ -l ] | [ [-o store ] [ [-g key | all ] | [-s key\=value [ -e ] ] | [-d key ] ] \n\noù\:\n -c config Nom de la configuration à utiliser\n -l répertorie tous les magasins de propriétés configurés\n -o nom du magasin de propriétés à utiliser\n -g key obtient la valeur de la clé spécifiée (ou le mot clé'all' impliquant l'obtention de toutes les clés)\n -s clé\=valeur définit la clé sur la valeur spécifiée\n -e chiffre la valeur lors de l'insertion dans le magasin (peut être utilisé avec l'option -s uniquement) -d key supprime la clé spécifiée du magasin Remarque\:\n-L'option -c est obligatoire. La configuration spécifiée doit être une configuration chargée sur le serveur distant.\n-Les options -l, -g, -s et -d s'excluent mutuellement et ne peuvent pas être utilisées ensemble.\n-L'option -e peut être utilisée uniquement avec l'option -s.\n-L'option -o est \
    obligatoire lors de l'utilisation de l'option -d.\n\nExemples\: pour répertorier tous les magasins de propriétés pour Config C1.xml tdisrvctl -op prop -c C1.xml -l\n\nPour obtenir toutes les propriétés de la configuration C1.xml tdisrvctl -op prop -c C1.xml -g all\n\nPour obtenir toutes les propriétés de la configuration C1.xml du magasin MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nPour définir une propriété MY_PROP sur la valeur MY_VALUE pour la configuration C1.xml dans le magasin MyStore et la marquer comme protégée tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
