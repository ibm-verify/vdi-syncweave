DELETE_TOMBSTONE_USAGE = \nLa syntaxe de l'opération de suppression de tombsone est la suivante\: tdisrvctl [ general_options ] -op deletetombstone -guid'GUID \#'\n\noù\:\n -guid'GUID \#'  est l'identificateur unique du tombstone à supprimer.\n\nRemarque\:\n-L'identificateur global unique d'un tombstone peut être obtenu en affichant un tombstone\n
