LISTENING.CI = CTGDJB148I 正在接聽配置訊息...
REMOTESERVERCOMMAND.IN.DEBUGCOMPONENTS = CTGDJB149I 在 debugComponents 方法中。
ASSEMBLY_LINE_NOT_RUNNING = CTGDJB150E AssemblyLine {0} 不在執行中。
COMPONENT_COULD_NOT_SET_DEBUG_MODE = CTGDJB151E 無法對 {0} 元件設定除錯模式。
DEBUG_USAGE = \n除錯作業的用法為\: tdisrvctl [general_options] -op debug -c config -r assembly_line [-alc al_component]\n                               -開啟/關閉\n\n其中\:\n -c config config instance ID\n -r AssemblyLine -alc al_component 名稱 AssemblyLine 元件 -on 旗標，以啟用除錯模式 -off 旗標來停用除錯模式。附註\:\n--c 及 -r 選項是必要的，且只需要指定一個 Config/AssemblyLine 。\n-如果未指定 -alc 選項，則會影響指定 AssemblyLine 中的所有元件。\n\n範例\: 檢視所指定 Config tdisrvctl -op report -c config 之 AssemblyLines 中元件的除錯模式值\n\n針對執行中 AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 -on 中的所有元件啟用除錯模式\n\n在執行 AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread ，httpServer， myconn -off\n\n
