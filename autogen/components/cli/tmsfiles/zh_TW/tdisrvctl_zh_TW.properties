GEN_CMD_USAGE = \n用法 \:tdisrvctl [general_options] -op operation [operation_specific_options]\n\ngeneral_options\:\n -h 主機遠端伺服器 IP 位址或主機名稱 (預設值為 localhost)\n -K SSL 金鑰資料庫檔的金鑰儲存庫名稱\n -p port port number (預設值為 1099)\n -P key_pwd 金鑰檔密碼\n -s dir 指定解決方案目錄所在的工作目錄。\n -T SSL 信任儲存庫資料庫檔案的信任儲存庫名稱\n -u userID username (用於自訂鑑別)\n -v 以詳細模式執行\n -w user_pwd 使用者密碼 (用於自訂鑑別)\n -W trust_pwd 信任檔密碼-?                  顯示指令用法\n\n\n作業\:\n event send custom notification event prop manage Config properties queryop query an AssemblyLine for operations reload running Configs report generate Config report or list Configs on remote server shutdown shutdown the server srvinfo view SyncWeave server information status view status of Configs or AssemblyLines \n start specific Config 或 AssemblyLines stop specific Config 或 AssemblyLine 圖碑視圖圖碑項目，或 AssemblyLine deletetombstone 刪除執行中 AssemblyLine 中的圖碑項目除錯元件\n\n若要取得特定作業的說明\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \n重新載入作業的用法為\: tdisrvctl [general_options] -op reload -c config_list\n\n其中\:\n -c config_list 以逗點區隔的「要重新載入的配置」清單\n
SHUTDOWN_USAGE = \n關閉作業的用法為\: tdisrvctl [general_options] -op shutdown [-o return_code] [-f]\n\n其中\:\n -o return_code shutdown server with specified return code\n -f 強制控制關機並結束所有 AssemblyLines\n\n
SRVINFO_USAGE = \nsrvinfo 作業的用法如下：\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \nstatus 作業的用法為\: tdisrvctl [general_options] -op status [-c config_list | all]\n                                       [-r AL_list | all]\n                                       [-listen]\n\n其中\:\n -c config_list 以逗點區隔的 Configs 或關鍵字 ' all' 清單\n -r AL_list 以逗點區隔的 ALs 清單或關鍵字 ' all' -listen start 接收執行中配置或 AssemblyLine 的日誌\n\n範例\: 若要查看所有已載入配置及 ALs tdisrvctl [general_options] -op status 的狀態\n\n若要查看所有執行中 ALs tdisrvctl [general_options] -op status -r all 的狀態\n\n若要查看特定載入之所有元件的狀態，請配置 tdisrvctl [general_options] -op status -c Config.xml -r all 附註\:\n-關鍵字 ' all' 指出所有「配置」或 AssemblyLines。\n--listen 選項只需要指定一個 Config 或 AssemblyLine 。\n
START_USAGE = \n啟動作業的用法為\: tdisrvctl [general_options] -op start -c config [-e password]\n                               [-r AL_list | all]\n                               [-s]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f 檔名]\n\t\t\t       [-m config_run_name -o storeName1\=value1， storeName2\=value2， storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-listen]\n\t\t\t       [-sync]\n\n其中\:\n -c config name of config to start\n 配置檔的 -e 密碼 (如果受密碼保護)\n -r AL_list 以逗點區隔的 AssemblyLines 清單，以開始或關鍵字 ' all'\n -s 模擬模式以模擬模式執行 AssemblyLine ，並使用必要的屬性及其值來執行 -alap opname AssemblyLine 作業\n -f 檔名，用來指定作業\n -m config run name run name of config -o property file list comma separated list of property store names and values\n -t start a temporary Config -listen receive the logs of the specified Config or AssemblyLine -sync execute AssemblyLine 同步附註\:\n--c 選項是必要的。\n-關鍵字 ' all' 指出所有 AssemblyLines。\n--t 選項預期 -\
    c 選項中指定的「配置」位於用戶端機器上。\n--listen 選項只需要指定一個 Config 或 AssemblyLine 。\n--listen 選項會同步執行 AssemblyLine 。 不需要將它與 -sync 選項結合。 --sync 選項只需要指定一個 AssemblyLine 。\n
STOP_USAGE = \n停止作業的用法為\: tdisrvctl [general_options] -op stop -c config [-r AL_list | all]\n                                    [-f]\n\n其中\:\n -c config name of Config -r AL_list comma separated list of ALs to stop or keyword ' all' -f force a controlled shutdown of AssemblyLines 附註\:\n--c 選項是必要的。\n-關鍵字 ' all' 指出所有 AssemblyLines。\n
TOMBSTONE_USAGE = \n圖碑作業的用法為\: tdisrvctl [general_options] -op tombstone -c config [-r AL_name]\n                                         [-age n]\n                                         [[attribute_list] | all]\n\n其中\:\n -age n 顯示過去 ' n' 天的圖碑記錄 (預設值為 1 天)\n -c config name of Config -r AL_name of Aseal Line all show all Tombstone attributes\n\nattribute_list\:\n -ct component type -cn component name -cfg configuration name -guid Tombstone entry 's guid -et event type -ex exit code -stime component 's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (僅適用於 ALs)\n\n範例\: 若要查看配置 C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2 的過去 2 天圖碑項目 (所有屬性) ，請全部注意\:\n--c 選項是必要的。\n-只接受 -r 或 -t 選項之一。 不是兩者都。\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E 配置 {0} 未載入伺服器 {1}。
CONFIG_FOLDER_EMPTY = CTGDJB058I 伺服器 {0} 上的 Config 資料夾是空白的。
REPORT_USAGE = \n報告作業的用法為\: tdisrvctl [general_options] -op report [-c config | -l]\n\n其中\:\n -c 要產生其報告之「配置」的配置名稱\n -l 列出遠端伺服器的「配置」資料夾中的「配置」附註\:\n-必須已在遠端伺服器上載入指定的「配置」。\n-只接受其中一個 -c 或 -l 選項。 不是兩者都。\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E 伺服器 {0} 不支援 ''config'' 資料夾。 6.1 版之前的伺服器不支援 ''config'' 資料夾。
EVENT_NOTIFICATION_USAGE = \n事件作業的用法為\: tdisrvctl [general_options] -op event -e event_name [-s source]\n                                                    [-d 資料]\n\n\n其中\:\n -e event_name 要傳送的事件名稱\n -s source 呼叫事件的來源名稱 (預設值 tdisrvctl)\n -d data 要傳遞至事件接聽器的資料 (訊息) (預設值是空值) 附註\:\n-從 tdisrvctl (-e 選項) 傳送的所有事件都會自動以字串 "user" 作為字首。\n\n範例\: 從 "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin triggered event" 傳送事件 "user.process.X.completed"。\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I 已順利傳送事件 {0}。
CONFIG_PROPERTIES_USAGE = \nprop 作業的用法為\: tdisrvctl [general_options] -op prop -c config [-l] | [[-o store] [[-g key | all] | [-s key\=value [-e]] | [-d key]]] \n\n其中\:\n -c config name of the Config to use\n -l 列出所有已配置的內容儲存庫\n -o 要使用的內容儲存庫名稱\n -g key 取得指定索引鍵的值 (或關鍵字 ' all' 隱含取得所有索引鍵)\n -s key\=value 將金鑰設為指定的值\n -e 加密放入儲存庫時的值 (只能與 -s 選項搭配使用) -d 金鑰從儲存庫中刪除指定的金鑰附註\:\n--c 選項是必要的。 指定的「配置」應該是遠端伺服器上已載入的「配置」。\n--l、-g、-s 及 -d 選項互斥，無法一起使用。\n--e 選項只能與 -s 選項一起使用。\n-當使用 -d 選項時， -o 選項是必要的。\n\n範例\: 列出 Config C1.xml tdisrvctl -op prop -c C1.xml -l 的所有內容儲存庫\n\n取得配置 C1.xml tdisrvctl -op prop -c C1.xml -g all 的所有內容\n\n從 store MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all 取得配置 C1.xml 的所有內容\n\n針對商店 MyStore 中的配置 C1.xml ，將內容 MY_PROP 設為值 MY_VALUE ，並將它標示為受保護 tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
