ASSEMBLY_LINE_ALL_NOT_ALLOWED = CTGDJB145E 一定要指定 AssemblyLine 名稱。不允許 ''{0}'' 關鍵字。
OPTION_NOT_ALLOWED_FOR_OPERATION = CTGDJB146E 選項 ''{0}'' 不可用於 ''{1}'' 作業。
