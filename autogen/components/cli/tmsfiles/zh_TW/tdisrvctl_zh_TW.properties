DELETE_TOMBSTONE_USAGE = \ntombsone 刪除作業的用法為\: tdisrvctl [general_options] -op deletetombstone -guid 'GUID \#'\n\n其中\:\n -guid 'GUID \#'  是要刪除之圖碑的唯一 ID。\n\n附註\:\n-可以透過檢視圖碑來取得圖碑的 GUID\n
TOMBSTONE_DELETED = CTGDJB143I 已順利刪除 GUID 為{0} 的圖碑。
