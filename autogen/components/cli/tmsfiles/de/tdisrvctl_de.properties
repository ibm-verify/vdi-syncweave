GEN_CMD_USAGE = \nSyntax\: tdisrvctl [allgemeine_optionen] -op operation [operationsspezifische optionen]\n\nAllgemeine Optionen\:\n -h Host IP-Adresse oder Hostname des fernen Servers (Standardwert ist localhost)\n -K Schlüsselspeichername der SSL-Schlüsseldatenbankdatei\n -p Portnummer (Standardwert ist 1099)\n -P Schlüsselkennwort Schlüsseldateikennwort\n -s dir Gibt das Arbeitsverzeichnis an, in dem sich das Lösungsverzeichnis befindet\n -T Truststore-Name der SSL-Truststore-Datenbankdatei\n -u userID Benutzername (für angepasste Authentifizierung)\n -v Ausführung im ausführlichen Modus\n -w Benutzerkennwort Benutzerkennwort (für angepasste Authentifizierung)\n -W Trust-Kennwort Trust-Datei Kennwort-?                  Syntax des Befehls display\n\n\nOperation\:\n Ereignisabfrage AssemblyLine für Operationen zum erneuten Laden von aktiven Konfigurationen Bericht Konfigurationsbericht generieren oder Liste Konfigurationen auf fernen Server herunterfahren Herunterfahren des Servers \
    srvinfo Sicht SyncWeave Serverinformationen Status der Konfigurationen oder AssemblyLines \n Starten einer bestimmten Konfiguration oder AssemblyLines Stoppen einer bestimmten Konfiguration oder AssemblyLine Tombstone-Einträge für eine bestimmte Konfiguration oder AssemblyLine Löschen eines Tombstone-Eintrags Debug-Komponenten in einer aktiven AssemblyLine\n\nHilfe für eine bestimmte Operation anfordern\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \nDie Syntax für die Operation zum erneuten Laden lautet wie folgt\: tdisrvctl [allgemeine_Optionen] -op reload -c Konfigurationsliste\n\nDabei gilt\:\n -c Konfigurationsliste durch Kommas getrennte Liste von Konfigurationen, die erneut geladen werden sollen\n
SHUTDOWN_USAGE = \nSyntax für Beendigungsoperation\: tdisrvctl [allgemeine_optionen] -op shutdown [-o rückkehrcode] [-f]\n\nDabei gilt\:\n -o Rückkehrcode Beendigungsserver mit angegebenem Rückkehrcode\n -f Erzwingt eine kontrollierte Beendigung und beendet alle AssemblyLines .\n\n
SRVINFO_USAGE = \nSyntax für 'srvinfo'\:\ntdisrvctl [allgemeine_optionen] -op srvinfo\n
STATUS_USAGE = \nSyntax für Statusoperation\: tdisrvctl [allgemeine_optionen] -op status [-c config_list | all]\n                                       [-r AL_list | all]\n                                       [-empfangsbereit]\n\nDabei gilt\:\n -c Konfigurationsliste durch Kommas getrennte Liste von Konfigurationen oder Schlüsselwort ' all'\n -r AL_list durch Kommas getrennte Liste mit ALs oder das Schlüsselwort ' all' -listen beginnen mit dem Empfang der Protokolle einer aktiven Konfiguration oder AssemblyLine\n\nBeispiel\: Status aller geladenen Konfigurationen und ALs anzeigen tdisrvctl [allgemeine_Optionen] -op status\n\nZum Anzeigen des Status aller aktiven ALs tdisrvctl [allgemeine_Optionen] -op status -r all\n\nStatus aller Komponenten einer bestimmten geladenen Konfiguration anzeigen tdisrvctl [allgemeine_Optionen] -op status -c Config.xml -r all Hinweis\:\n-Das Schlüsselwort ' all' gibt alle Konfigurationen oder AssemblyLinesan.\n-Für die Option '-listen' muss genau eine \
    Konfiguration oder AssemblyLine angegeben werden.\n
START_USAGE = \nDie Syntax für die Startoperation lautet\: tdisrvctl [allgemeine Optionen] -op start -c config [-e Kennwort]\n                               [-r AL_list | all]\n                               [-s]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f Dateiname]\n\t\t\t       [-m Konfigurationsausführungsname -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-empfangsbereit]\n\t\t\t       [-sync]\n\nDabei gilt\:\n -c Konfigurationsname der zu startenden Konfiguration\n -e Kennwort Kennwort der Konfigurationsdatei, wenn sie kennwortgeschützt ist\n -r AL_list durch Kommas getrennte Liste der zu startenden AssemblyLines oder des Schlüsselworts ' all'\n -s Simulationsmodus AssemblyLine im Simulationsmodus ausführen -alop opname AssemblyLine Operation mit erforderlichen Attributen und ihren Werten\n -f Dateiname Dateiname zur Angabe der \
    Operationen\n -m Konfiguration Ausführungsname Ausführungsname der Konfiguration -o Eigenschaftendatei Liste durch Kommas getrennte Liste von Eigenschaftsspeichernamen und -werten\n -t startet eine temporäre Konfiguration-Empfangsbereitschaft empfängt die Protokolle der angegebenen Konfiguration oder AssemblyLine -sync execute AssemblyLine synchron Hinweis\:\n-Die Option -c ist obligatorisch.\n-Das Schlüsselwort ' all' gibt alle AssemblyLinesan.\n-Die Option -t erwartet, dass sich die in der Option -c angegebene Konfiguration auf der Clientmaschine befindet.\n-Für die Option '-listen' muss genau eine Konfiguration oder AssemblyLine angegeben werden.\n-Die Option -listen führt eine AssemblyLine synchron aus. Es ist nicht erforderlich, sie mit der Option -sync zu kombinieren. -Für die Option '-sync' muss genau eine AssemblyLine angegeben werden.\n
STOP_USAGE = \nSyntax für Stoppoperation\: tdisrvctl [allgemeine_optionen] -op stop -c config [-r AL_list | all]\n                                    [-f].\n\nDabei gilt\:\n -c config name of Config -r AL_list durch Kommas getrennte Liste mit zu stoppenden ALs oder Schlüsselwort ' all' -f force a controlled shutdown of AssemblyLines Hinweis\:\n-Die Option -c ist obligatorisch.\n-Das Schlüsselwort ' all' gibt alle AssemblyLinesan.\n
TOMBSTONE_USAGE = \nDie Syntax für die Tombstone-Operation lautet\: tdisrvctl [allgemeine_Optionen] -op tombstone -c config [-r AL-Name]\n                                         [-age n]\n                                         [ [Attributliste] | all]\n\nDabei gilt\:\n -age n Tombstone-Datensatz für die letzten ' n' Tage anzeigen (Standardwert ist 1 Tag)\n -c config name of Config -r AL_name name of Aseembly Line alle Tombstone-Attribute anzeigen\n\nAttributliste\:\n -ct Komponententyp -cn Komponentenname -cfg Konfigurationsname -guid GUID des Tombstone-Eintrags -et Ereignistyp -ex Exit-Code -stime Startzeit der Komponente -ctime Tombstone Erstellungszeit -desc Fehlerbeschreibung -um Benutzernachricht -stat Statistik (nur für ALs gültig)\n\nBeispiel\: Gehen Sie wie folgt vor, um die Tombstone-Einträge der letzten 2 Tage (alle Attribute) für die Konfiguration C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2 all anzuzeigen\:\n-Die Option -c ist obligatorisch.\n-Nur \
    eine der Optionen -r oder -t ist zulässig. Nicht beides.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E Die Konfiguration {0} ist auf dem Server {1} nicht geladen.
CONFIG_FOLDER_EMPTY = CTGDJB058I Der Konfigurationsordner auf dem Server {0} ist leer.
REPORT_USAGE = \nDie Syntax für die Berichtsoperation lautet\: tdisrvctl [allgemeine Optionen] -op report [-c config | -l]\n\nDabei gilt\:\n -c Konfigurationsname der Konfiguration, deren Bericht generiert werden soll\n -l Configs im Konfigurationsordner des fernen Servers auflisten Hinweis\:\n-Die angegebene Konfiguration muss bereits auf dem fernen Server geladen sein.\n-Nur eine der Optionen -c oder -l ist zulässig. Nicht beides.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E Der Server {0} unterstützt den Konfigurationsordner nicht. Unterstützung für den Konfigurationsordner ist bei Servern vor Version 6.1 nicht verfügbar.
EVENT_NOTIFICATION_USAGE = \nSyntax für Ereignisoperation\: tdisrvctl [allgemeine_optionen] -op ereignis -e ereignisname [-s quelle]\n                                                    [-d Daten]\n\n\nDabei gilt\:\n -e Ereignisname Name des zu sendenden Ereignisses\n -s Quelle der Name der Quelle, die das Ereignis aufruft (Standardwert\: tdisrvctl).\n -d Daten die Daten (Nachricht), die an einen Ereignislistener übergeben werden sollen (Standardwert ist null) Hinweis\:\n-Alle Ereignisse, die von tdisrvctl (Option-e) gesendet werden, erhalten automatisch die Zeichenfolge "user" als Präfix.\n\nBeispiel\: Senden eines Ereignisses "user.process.X.completed" von "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Vom Administrator ausgelöstes Ereignis".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I Das Ereignis {0} wurde erfolgreich gesendet.
CONFIG_PROPERTIES_USAGE = \nDie Syntax für die Eigenschaftenoperation lautet\: tdisrvctl [allgemeine_Optionen] -op prop -c config [-l] | [ [-o Speicher] [ [-g Schlüssel | all] | [-s Schlüssel \= Wert [-e]] | [-d Schlüssel]]] \n\nDabei gilt\:\n -c Konfigurationsname der zu verwendenden Konfiguration\n -l Alle konfigurierten Eigenschaftsspeicher auflisten\n -o Name des zu verwendenden Eigenschaftsspeichers\n -g Schlüssel ruft den Wert des angegebenen Schlüssels ab (oder das Schlüsselwort 'all' impliziert' alle Schlüssel abrufen ').\n -s Schlüssel \= Wert Schlüssel auf den angegebenen Wert setzen\n -e Wert verschlüsseln, wenn in den Speicher gestellt wird (kann nur mit der Option -s verwendet werden) -d Schlüssel Löschen des angegebenen Schlüssels aus dem Speicher Hinweis\:\n-Die Option -c ist obligatorisch. Die angegebene Konfiguration muss eine geladene Konfiguration auf dem fernen Server sein.\n-Die Optionen -l, -g, -s und -d schließen sich gegenseitig aus und können nicht zusammen \
    verwendet werden.\n-Die Option -e kann nur zusammen mit der Option -s verwendet werden.\n-Die Option -o ist obligatorisch, wenn die Option -d verwendet wird.\n\nBeispiele\: Auflisten aller Eigenschaftsspeicher für Konfiguration C1.xml tdisrvctl -op prop -c C1.xml -l\n\nZum Abrufen aller Eigenschaften für die Konfiguration C1.xml tdisrvctl -op prop -c C1.xml -g all\n\nZum Abrufen aller Eigenschaften für die Konfiguration C1.xml aus dem Speicher MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nSo setzen Sie eine Eigenschaft MY_PROP auf den Wert MY_VALUE für die Konfiguration C1.xml im Speicher MyStore und markieren sie als protected tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
