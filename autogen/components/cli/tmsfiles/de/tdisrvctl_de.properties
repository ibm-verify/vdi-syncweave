DEBUG_USAGE = \nDie Syntax für die Debugoperation lautet\: tdisrvctl [allgemeine_Optionen] -op debug -c config -r assembly_line [-alc al_component]\n                               -on/off\n\nDabei gilt\:\n -c config Konfigurationsinstanz-ID\n -r name_der_fertigungslinie name der AssemblyLine -alc name_der_fertigungslinie der komponente AssemblyLine -on flag zum Aktivieren des debugmodus -off flag zum Inaktivieren des debugmodus Hinweis\:\n-Die Optionen -c und -r sind obligatorisch und erfordern die Angabe genau einer Konfiguration/AssemblyLine .\n-Wenn die Option -alc nicht angegeben ist, sind alle Komponenten in der angegebenen AssemblyLine betroffen.\n\nBeispiele\: Wert für den Debugmodus der Komponenten in den AssemblyLines einer angegebenen Konfiguration anzeigen tdisrvctl -op report -c config\n\nZum Aktivieren des Debugmodus für alle Komponenten in der aktiven AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 -on\n\nZum Inaktivieren des Debugmodus für angegebene \
    Komponenten in der aktiven AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn -off\n\n
