DELETE_TOMBSTONE_USAGE = \nSyntax für die Operation zum Löschen von Tombsone\: tdisrvctl [allgemeine_Optionen] -op deletetombstone -guid 'GUID \#'\n\nDabei gilt\:\n -guid 'GUID \#'  Die eindeutige Kennung für den zu löschenden Tombstone.\n\nAnmerkung\:\n-GUID für einen Tombstone kann durch Anzeigen eines Tombstones abgerufen werden\n
