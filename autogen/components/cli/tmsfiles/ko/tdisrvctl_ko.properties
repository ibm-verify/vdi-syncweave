GEN_CMD_USAGE = \nUsage\:\ntdisrvctl [general_options] -op operation [operation_specific_options]\n\ngeneral_options\:\n -h  host            remote server IP address or hostname(default is localhost)\n -K  keystore        name of the SSL key database file\n -p  port            port number(default is 1099)\n -P  key_pwd         key file password\n -s  dir             Specifies the working directory where the solution directory is located.\n -T  truststore      name of the SSL trust store database file\n -u  userID          username(for custom authentication)\n -v                  run in verbose mode\n -w  user_pwd        user password(for custom authentication)\n -W  trust_pwd       trust file password\n -?                  display command usage\n\n\noperation\:\n event               send custom notification event\n prop                manage Config properties\n queryop             query an AssemblyLine for operations\n reload              reload running Configs\n report              \
    generate Config report or list Configs on remote server\n shutdown            shut down the server\n srvinfo             view SyncWeave server information\n status              view status of Configs or AssemblyLines \n start               start specific Config or AssemblyLines \n stop                stop specific Config or AssemblyLine \n tombstone           view Tombstone entries for specific Config or AssemblyLine \n deletetombstone     delete a tombstone entry\n debug               debug components in a running AssemblyLine\n\nTo get help for a specific operation\:\ntdisrvctl -op operation -?\n
RELOAD_USAGE = \n다시 로드 조작의 사용법은 다음과 같습니다. tdisrvctl [general_options] -op reload -c config_list\n\n여기서\:\n -c config_list 쉼표로 분리된 구성 목록을 다시 로드한다.\n
SHUTDOWN_USAGE = \n종료 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op shutdown [- o return_code] [-f]\n\n여기서\:\n 지정된 리턴 코드가 있는 -o return_code shutdown 서버\n -f 강제 종료를 강제 종료하고 모든 AssemblyLines 를 종료합니다.\n\n
SRVINFO_USAGE = \nsrvinfo 조작의 사용법은 다음과 같습니다.\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \n상태 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op status [- c config_list | all]\n                                       [- r AL_list | all]\n                                       [듣는 소리]\n\n여기서\:\n -c config_list 쉼표로 구분된 구성 목록 또는 키워드 ' all'\n -r AL_목록 쉼표로 구분된 AL 목록 또는 키워드 ' all'-실행 중인 구성의 로그 수신 시작 또는 AssemblyLine\n\n예제\: 모든 로드된 구성 및 ALs tdisrvctl [general_options] -op 상태를 보려면\n\n실행 중인 모든 ALs tdisrvctl [general_options] -op status -r 의 상태를 확인한다.\n\n특정 로드된 구성 tdisrvctl [general_options] -op status -c Config.xml 의 모든 구성요소의 상태를 보려면 다음을 참고하십시오.\n- ' all' 키워드는 모든 구성 또는 AssemblyLines를 표시합니다.\n-청취 옵션을 지정하려면 정확히 하나의 구성 또는 AssemblyLine 이 필요합니다.\n
START_USAGE = \n시작 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op start -c config [- e password]\n                               [- r AL_list | all]\n                               [- s]\n                               [- r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f 파일 이름]\n\t\t\t       [- m config_run_name -o storeName1\=value1, storeName2\=value2, storenameN\=valueN]\n\t\t\t       [- t]\n\t\t\t       [듣는 소리]\n\t\t\t       [- sync]\n\n여기서\:\n 시작할 구성의 -c 구성 이름\n 비밀번호로 보호되는 경우 구성 파일의 비밀번호 비밀번호\n -r AL_list 쉼표로 구분된 AssemblyLines 목록을 시작 또는 키워드 ' all'\n -s 시뮬레이션 모드 실행 AssemblyLine 에서 필수 속성 및 해당 값이 있는 시뮬레이션 모드 -alop opname AssemblyLine 조작\n -f 파일 이름 파일 이름으로 조작을 지정한다.\n -m 구성 실행 이름 실행 이름 구성 -o 특성 파일 목록 쉼표로 구분된 특성 저장소 이름 및 값 목록\n -t - 지정된 구성의 로그를 수신하는 임시 구성을 시작하거나 AssemblyLine -sync 실행 AssemblyLine 를 동기적으로 참고하십시오.\n- -c 옵션은 필수입니다.\n- ' all' 키워드는 모든 AssemblyLines를 표시합니다.\n- -t 옵션은 -c 옵션에 지정된 구성이 클라이언트 시스템에 있을 것으로 예상한다.\n-\
    청취 옵션을 사용하려면 정확히 하나의 구성 또는 AssemblyLine 를 지정해야 합니다.\n-청취 옵션은 AssemblyLine 를 동기식으로 실행합니다. 이를 -sync 옵션과 결합할 필요가 없다. -동기화 옵션을 지정하려면 정확히 하나의 AssemblyLine 이 필요합니다.\n
STOP_USAGE = \n중지 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op stop -c config [- r AL_list | all]\n                                    [-f]\n\n여기서\:\n -c 구성 이름의 -c 구성 이름, 쉼표로 분리된 AL의 목록 또는 'all'을 키워드' all'로 구분하여 AssemblyLines 의 제어된 종료를 강제 실행합니다.\n- -c 옵션은 필수입니다.\n- ' all' 키워드는 모든 AssemblyLines를 표시합니다.\n
TOMBSTONE_USAGE = \n삭제 표시 조작의 사용법은 다음과 같습니다. tdisrvctl [general_options] -op tombstone -c config [- r AL_name]\n                                         [나이 n]\n                                         [[attribute_list] | 모두]\n\n여기서\:\n -마지막 'n' 일 (기본값은 1일) 에 대한 삭제 표시 레코드가 표시되지 않습니다.\n -c 구성 이름의 구성 -r AL_name 이름은 모든 종료 표시기 속성을 표시합니다.\n\nattribute_list\:\n -ct component type -cn component name -cn component name -cfg configuration name -guid Tombstone 항목의 guid -et 이벤트 유형 -ex exit code -stime component's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (AL에 대해서만 유효)\n\n예제\: 구성 C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2모두에 대한 최근 2일 종료 표시기 항목 (모든 속성) 을 참조하십시오.\n- -c 옵션은 필수입니다.\n- -r 또는 -t 옵션 중 하나만 허용됩니다. 둘 다 지정할 수는 없습니다.\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E {0} 구성이 {1} 서버에 로드되어 있지 않습니다.
CONFIG_FOLDER_EMPTY = CTGDJB058I {0} 서버의 구성 폴더가 비었습니다.
REPORT_USAGE = \n보고서 조작의 사용법은 다음과 같습니다. tdisrvctl [general_options] -op report [- c config | -l]\n\n여기서\:\n 보고서를 생성할 구성의 -c 구성 이름\n -l 원격 서버의 구성 폴더에 있는 구성을 나열합니다. 참고\:\n-지정된 구성이 원격 서버에 이미 로드되어 있어야 합니다.\n- -c 또는 -l 옵션 중 하나만 허용됩니다. 둘 다 지정할 수는 없습니다.\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E {0} 서버가 ''config'' 폴더를 지원하지 않습니다. 6.1 이전 서버에서는 ''config'' 폴더를 지원하지 않습니다.
EVENT_NOTIFICATION_USAGE = \n이벤트 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op event -e event_name [- s source]\n                                                    [- d 데이터]\n\n\n여기서\:\n -e 전송할 이벤트의 이벤트 이름 이름\n -s 이벤트를 호출하는 소스의 이름 (기본 tdisrvctl)\n -d 데이터 (메시지) 가 이벤트 리스너에 전달될 데이터 (기본값은 널) 에 대한 데이터입니다. 참고\:\n-tdisrvctl (- e 옵션) 에서 보낸 모든 이벤트는 문자열 "user" 로 자동적으로 접두부가 붙는다.\n\n예\: "user.process.X.completed" 이벤트를 "admin" tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin triggered event" 에서 전송합니다.\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I {0} 이벤트를 전송했습니다.
CONFIG_PROPERTIES_USAGE = \nprop 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op prop -c config [-l] | [[- o store] [[- g key | all] | [- s key\=value [-e]] | [- d key]]] \n\n여기서\:\n 사용할 구성의 -c 구성 이름\n -l, 구성된 모든 특성 저장소를 나열합니다.\n 사용할 특성 저장소의 -o 이름\n -g 키는 지정된 키의 값을 가져오십시오 (또는 모든 키를 가져오는 키워드 ' all').\n -s 키 \= 값을 지정된 값으로 설정합니다.\n 상점에 넣을 때 값을 암호화하십시오 (-s 옵션으로만 사용할 수 있음) -d 키가 상점 참고에서 지정된 키를 삭제합니다.\n- -c 옵션은 필수입니다. 지정된 구성은 원격 서버에서 로드된 구성이어야 합니다.\n- -l, -g, -s 및 -d 옵션은 상호 배타적이므로 함께 사용할 수 없습니다.\n- -s 옵션만 사용하여 -e 옵션을 사용할 수 있다.\n- -d 옵션을 사용할 때는 -o 옵션이 필수이다.\n\nExamples\:\nTo list all property stores for Config C1.xml\ntdisrvctl -op prop -c C1.xml -l\n\nTo get all properties for Config C1.xml\ntdisrvctl -op prop -c C1.xml -g all\n\nTo get all properties for Config C1.xml from store MyStore\ntdisrvctl -op prop -c C1.xml -o MyStore -g all\n\nTo set a property MY_PROP to value MY_VALUE for Config C1.xml in store MyStore and mark it as protected\ntdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP\=MY_VALUE" -e\n
PROP_OPTIONS_MUTUALLY_EXCLUSIVE = CTGDJB064E -l, -g, -s 및 -d 옵션 중 하나만 지정할 수 있습니다. 이 옵션들을 함께 사용할 수는 없습니다.
