DEBUG_USAGE = \n디버그 조작에 대한 사용법은 다음과 같습니다. tdisrvctl [general_options] -op debug -c config -r 어셈블리 _line [- alc al_component]\n                               /꺼짐\n\n여기서\:\n -c 구성 구성 인스턴스 ID\n AssemblyLine 구성요소의 AssemblyLine -alc al_component 이름의 -r 어셈블리 이름\: 디버그 모드 종료 플래그를 사용하여 디버그 모드 노트를 사용하지 않도록 설정합니다.\n- -c 및 -r 옵션은 필수이며 정확히 하나의 Config/AssemblyLine 을 지정해야 합니다.\n- -alc 옵션이 지정되지 않은 경우 지정된 AssemblyLine 의 모든 구성요소가 영향을 받습니다.\n\n예제\: 지정된 구성 tdisrvctl -op 보고서 -c 구성의 AssemblyLines 에서 컴포넌트의 디버그 모드 값 보기\n\n실행 중인 모든 컴포넌트에 대해 디버그 모드를 사용 가능하게 하려면 AssemblyLine al2 tdisrvctl -op 디버그 -c config_name -r al2\n\n실행 중인 AssemblyLine al3 tdisrvctl -op debug -c config_name -r al3 -alc fread,httpServer, myconn 오프에서 지정된 컴포넌트의 디버그 모드를 사용하지 않습니다.\n\n
