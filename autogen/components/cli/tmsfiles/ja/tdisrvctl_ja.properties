DELETE_TOMBSTONE_USAGE = \ntombsone 削除操作の使用法は次のとおりです\: tdisrvctl [general_options] -op deletombstone -guid 'GUID \#'\n\nここで、\n -guid 'GUID \#'  削除されるトゥームストーンの固有 ID です。\n\n注\:\n-トゥームストーンの GUID は、トゥームストーンを表示することで取得できます。\n
