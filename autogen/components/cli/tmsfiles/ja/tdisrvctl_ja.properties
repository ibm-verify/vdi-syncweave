GEN_CMD_USAGE = \n使用法\: tdisrvctl [general_options] -op operation [operation_specific_options]\n\ngeneral_options\:\n -h ホスト・リモート・サーバーの IP アドレスまたはホスト名 (デフォルトは localhost)\n -K SSL 鍵データベース・ファイルの鍵ストア名\n -p ポート・ポート番号 (デフォルトは 1099)\n -P key_pwd 鍵ファイル・パスワード\n -s dir ソリューション・ディレクトリーがある作業ディレクトリーを指定します。\n -T SSL トラストストア・データベース・ファイルのトラストストア名\n -u userID username (カスタム認証用)\n -v 冗長モードで実行\n -w user_pwd ユーザー・パスワード (カスタム認証用)\n -W trust_pwd トラスト・ファイルのパスワード-?                  表示コマンドの使用法\n\n\n操作\:\n event send custom notification event prop manage Config properties queryop query an AssemblyLine for operations reload reload running Configs report generate Config report or list Configs on remote server shutdown shutdown shutdown the server srvinfo view SyncWeave server information view status of Configs or AssemblyLines \n start start specific Config または AssemblyLines stop stop specific Config or AssemblyLine tombstone view Tombstone entries for specific Config or \
    AssemblyLine deletetombstone delete a tombstone entry debug components in a running AssemblyLine\n\n特定の操作のヘルプを表示する場合\: tdisrvctl -op operation-?\n
RELOAD_USAGE = \n再ロード操作の使用法\: tdisrvctl [general_options] -op reload -c config_list\n\nここで、\n -c config_list 再ロードする構成のコンマ区切りリスト\n
SHUTDOWN_USAGE = \nシャットダウン操作の使用法\: tdisrvctl [general_options] -op shutdown [-o return_code] [-f]\n\nここで、\n -o return_code 指定された戻りコードでサーバーをシャットダウンします\n -f 制御されたシャットダウンを強制し、すべての AssemblyLines を終了します。\n\n
SRVINFO_USAGE = \nsrvinfo 操作の使用法\:\ntdisrvctl [general_options] -op srvinfo\n
STATUS_USAGE = \n状況操作の使用法\: tdisrvctl [general_options] -op status [-c config_list | all]\n                                       [-r AL_list | すべて]\n                                       [-聞く]\n\nここで、\n -c config_list 構成またはキーワード ' all' のコンマ区切りリスト\n -r AL_list 実行中の構成または AssemblyLine のログの受信を開始する ALs またはキーワード ' all' -listen のコンマ区切りリスト\n\n例\: ロードされたすべての Configs および ALs tdisrvctl [general_options] -op 状況の表示\n\n実行中のすべての ALs の状況を表示するには、tdisrvctl [general_options] -op status -r all\n\n特定のロード済み Config tdisrvctl [general_options] -op status -c Config.xml -r all Note のすべてのコンポーネントの状況を確認するには、以下のようにします。\n-キーワード「all」は、すべての構成または AssemblyLinesを示します。\n--listen オプションでは、構成または AssemblyLine を 1 つのみ指定する必要があります。\n
START_USAGE = \n開始操作の使用法は、tdisrvctl [general_options] -op start -c config [-e password] です。\n                               [-r AL_list | すべて]\n                               [-秒]\n                               [-r AL_list -alop opname [{attr1\:value1;attr2\:value2;attrN\:valueN}] |\n                                -f ファイル名]\n\t\t\t       [-m config_run_name -o storeName1\=value1、 storeName2\=value2、 storenameN\=valueN]\n\t\t\t       [-t]\n\t\t\t       [-聞く]\n\t\t\t       [-同期]\n\nここで、\n -c 開始する構成の構成名\n -e 構成ファイルのパスワード (パスワードで保護されている場合)\n -r AL_list 開始する AssemblyLines のコンマ区切りリストまたはキーワード「all」\n -s シミュレート・モードで AssemblyLine をシミュレート・モードで実行します。-alop opname AssemblyLine 操作に必要な属性とその値を指定します。\n -f 操作を指定するファイル名\n -m config 実行名 config の実行名 -o プロパティー・ファイル・リストプロパティー・ストアの名前と値のコンマ区切りリスト\n -t start a temporary Config -listen 指定された Config または AssemblyLine -sync execute AssemblyLine のログを同期的に受信します。注\:\n--c オプションは必須です。\n-キーワード「all」は、すべての AssemblyLinesを示します。\n--t オプションは、-c オプションで指定された Config が\
    クライアント・マシン上にあることを予期します。\n--listen オプションでは、構成または AssemblyLine を 1 つのみ指定する必要があります。\n--listen オプションは、 AssemblyLine を同期的に実行します。 これを -sync オプションと組み合わせる必要はありません。 --sync オプションには、厳密に 1 つの AssemblyLine を指定する必要があります。\n
STOP_USAGE = \n停止操作の使用法\: tdisrvctl [general_options] -op stop -c config [-r AL_list | all]\n                                    「-f」\n\nここで、\n -c config name of Config -r AL_list 停止する ALs のコンマ区切りリストまたはキーワード ' all' -f AssemblyLines の制御されたシャットダウンを強制します。注\:\n--c オプションは必須です。\n-キーワード「all」は、すべての AssemblyLinesを示します。\n
TOMBSTONE_USAGE = \nトゥームストーン操作の使用法\: tdisrvctl [general_options] -op tombstone -c config [-r AL_name]\n                                         [-年齢 n]\n                                         [[attribute_list] | すべて]\n\nここで、\n -age n 過去 ' n' 日間のトゥームストーン・レコードを表示 (デフォルトは 1 日)\n -c config name of Config -r AL_name name of Aseemstone Line all show all Tombstone attributes\n\n属性リスト\:\n -ct component type -cn component name -cfg configuration name -guid Tombstone entry 's guid -et event type -ex exit code -stime component 's start time -ctime Tombstone create time -desc error description -um user message -stat statistics (ALs にのみ有効)\n\n例\: 構成 C1.xml tdisrvctl [general_options] -op tombstone -c C1.xml -age 2 の最近 2 日間のトゥームストーン・エントリー (すべての属性) をすべて表示するには、以下のようにします。\n--c オプションは必須です。\n--r または -t オプションのいずれか 1 つのみが許可されます。 両方を指定することはできません。\n
CONFIG_NOT_LOADED_ERR = CTGDJB057E サーバー {1} に構成 {0} がロードされていません。
CONFIG_FOLDER_EMPTY = CTGDJB058I サーバー {0} の構成フォルダーが空です。
REPORT_USAGE = \nレポート操作の使用法\: tdisrvctl [general_options] -op report [-c config | -l]\n\nここで、\n -c レポートが生成される構成の構成名。\n -l リモート・サーバーの Config フォルダー内の Configs をリストします。注\:\n-指定された構成は、リモート・サーバーに既にロードされている必要があります。\n--c または -l オプションのいずれか 1 つのみが許可されます。 両方を指定することはできません。\n
CONFIG_FOLDER_UNSUPPORTED = CTGDJB060E サーバー {0} では「config」フォルダーはサポートされていません。6.1 より前のサーバーでは「config」フォルダーはサポートされていません。
EVENT_NOTIFICATION_USAGE = \nイベント操作の使用法\: tdisrvctl [general_options] -op event -e event_name [-s source]\n                                                    [-d データ]\n\n\nここで、\n -e event_name 送信するイベントの名前\n -s イベントを呼び出すソースの名前を source (デフォルト tdisrvctl)\n -d イベント・リスナーに渡されるデータ (メッセージ) をデータ化します (デフォルトはヌルです)。注\:\n-tdisrvctl (-e オプション) から送信されるすべてのイベントには、ストリング「user」が自動的に接頭部として付けられます。\n\n例\: イベント「user.process.X.completed」を「admin」から送信するには、tdisrvctl -h hostname -op event -e "process.X.completed" -s admin -d "Admin triggered event".\n
EVENT_NOTIFICATION_SUCCESSFUL = CTGDJB062I イベント {0} が正常に送信されました。
CONFIG_PROPERTIES_USAGE = \nProp 操作の使用法\: tdisrvctl [general_options] -op prop -c config [-l] | [[-o store] [[-g key | all] | [-s key\=value [-e]] | [-d key]]] \n\nここで、\n -c 使用する構成の構成名\n -l すべての構成済みプロパティー・ストアをリストします\n -o 使用するプロパティー・ストアの名前\n -g key 指定されたキーの値を取得します (または、すべてのキーを取得することを意味するキーワード ' all')\n -s key\=value 指定された値にキーを設定します\n -e store に入れるときに値を暗号化します (-s オプションでのみ使用できます) -d key 指定された鍵を store から削除します注\:\n--c オプションは必須です。 指定された構成は、リモート・サーバー上のロードされた構成でなければなりません。\n--l、-g、-s、および -d オプションは相互に排他的であり、一緒に使用することはできません。\n--e オプションは -s オプションと一緒にのみ使用できます。\n--d オプションを使用する場合、-o オプションは必須です。\n\n例\: Config C1.xml tdisrvctl -op prop -c C1.xml -l のすべてのプロパティー・ストアをリストする\n\n構成 C1.xml tdisrvctl -op prop -c C1.xml -g all のすべてのプロパティーを取得します。\n\nストア MyStore tdisrvctl -op prop -c C1.xml -o MyStore -g all から Config C1.xml のすべてのプロパティーを取得します。\n\nプロパティー MY_PROP をストア MyStore 内の構成 C1.xml の値 MY_VALUE に設定し、保護された tdisrvctl -op prop -c C1.xml -o MyStore -s "MY_PROP \= MY_VALUE" -e\n
