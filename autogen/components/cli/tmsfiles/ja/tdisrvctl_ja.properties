DEBUG_USAGE = \nデバッグ操作の使用法は次のとおりです。tdisrvctl [general_options] -op debug -c config -r assembly_line [-alc al_component]\n                               -オン/オフ\n\nここで、\n -c config config インスタンス ID\n -r AssemblyLine の AssemblyLine 名 -alc al_component AssemblyLine コンポーネント・オン・フラグの名前。デバッグ・モードを無効にするためのデバッグ・モード・オフ・フラグを有効にします。注\:\n--c および -r オプションは必須であり、Config/AssemblyLine を 1 つのみ指定する必要があります。\n--alc オプションが指定されていない場合、指定された AssemblyLine 内のすべてのコンポーネントが影響を受けます。\n\n例\: 指定された Config tdisrvctl -op レポート -c config の AssemblyLines 内のコンポーネントのデバッグ・モード値を表示する\n\n実行中の AssemblyLine al2 tdisrvctl -op debug -c config_name -r al2 のすべてのコンポーネントのデバッグ・モードを有効にする\n\n実行中の AssemblyLine al3 で指定されたコンポーネントのデバッグ・モードを無効にするには、tdisrvctl -op debug -c config_name -r al3 -alc fread、httpServer、myconn -off\n\n
