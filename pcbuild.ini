* --------------------------------------------------------------------
* This is the common PCBUILD.INI file for releases ibmdi_dev and ibmdi_dev_docs
* --------------------------------------------------------------------
*   Note: The following environment variables are ALWAYS defined:
*          LMF_BUILD_PLATFORM    ; set to either WIN or OS2
*          LMF_BUILD_DRIVE       ; set to your build drive letter (e.g. - J:)
*          LMF_CMVC_RELEASE      ; set to your CMVC release name
*          LMF_CMVC_LEVEL        ; set to your CMVC level name for this extract
* ------------------------------------------------------------------------------

[build_type]
FULL


[build_entry_win]
pcbuild.cmd


[envsetup_win]
BLDTOOLS     = LMF_BLDTOOLS
CYGWIN       = LMF_CYGWIN_1.5.9-1
GSA_PREREQS  = GSA_PREREQS
LMF_W2008R2  = LMF_W2008R2
LMF_ANT      = LMF_ANT_1.7.0
LMF_CBUTIL   = LMF_CBUTIL_3.0
LMF_JDK      = LMF_JDK_160
LMF_OBJREXX  = LMF_OBJREXX4
LMF_RAB_CMVC = LMF_RAB_CMVC
LMF_IDWB_4.3.1 = LMF_IDWB_4.4.6
RABROOT      = LMF_RANDY
TDITOOLS     = LMF_JASON
