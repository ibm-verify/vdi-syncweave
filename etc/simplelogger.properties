# SLF4J Simple Logger Configuration
# This file suppresses SLF4J warnings about missing providers

# Default log level for all instances of SimpleLogger
# Valid levels: trace, debug, info, warn, error, off
org.slf4j.simpleLogger.defaultLogLevel=error

# Log level for specific loggers
org.slf4j.simpleLogger.log.org.slf4j=error

# Show date time in log messages
org.slf4j.simpleLogger.showDateTime=false

# Show thread name in log messages
org.slf4j.simpleLogger.showThreadName=false

# Show logger name in log messages
org.slf4j.simpleLogger.showLogName=false

# Show short logger name (last component only)
org.slf4j.simpleLogger.showShortLogName=true

# Set to true to output to System.err, false for System.out
org.slf4j.simpleLogger.logFile=System.err

# Cache output stream (improves performance)
org.slf4j.simpleLogger.cacheOutputStream=true