# Java Util Logging Configuration
# This file configures java.util.logging to suppress Jersey and other framework warnings

# Global logging level
.level=WARNING

# Console handler configuration
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Suppress Jersey warnings
org.glassfish.jersey.level=SEVERE
org.glassfish.jersey.servlet.WebComponent.level=SEVERE
org.glassfish.jersey.server.wadl.WadlFeature.level=SEVERE
org.glassfish.jersey.internal.inject.Providers.level=SEVERE
org.glassfish.jersey.server.level=SEVERE
org.glassfish.jersey.internal.level=SEVERE

# Suppress other common framework warnings
javax.ws.rs.level=SEVERE
com.sun.jersey.level=SEVERE